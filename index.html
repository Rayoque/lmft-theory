 Transference","correct":true,"belongsTo":"self-psychology"}],"rationale":"“enactment” is claimed by Self Psychology, Structural Family Therapy, so it discriminates nothing. Adversarial Transference is unique to Self Psychology.","sourceLine":"Adversarial Transference: The need for a supportive relationship that the patient can oppose in order to grow. The therapist can be a person who cares about them, but C is also allowed to disagree and push back, and this could be an important way of healing for a client who felt differential their entire life."},{"id":"v_attachment_dismissive","tier":2,"type":"V_vignette","models":["attachment"],"stem":"A client dismisses the importance of love and connection, idealizes their parents although actual memories do not corroborate it, dislikes looking inward, and has difficulty tolerating heightened emotions in others.\n\nThis attachment pattern is:","options":[{"text":"Secure Attachment","correct":false,"belongsTo":"attachment"},{"text":"Fearful/Avoidant Attachment (Disorganized)","correct":false,"belongsTo":"attachment"},{"text":"Preoccupied/Anxious Attachment","correct":false,"belongsTo":"attachment"},{"text":"Dismissive/Avoidant Attachment","correct":true,"belongsTo":"attachment"}],"rationale":"Dismissive/Avoidant per the packet's description.","sourceLine":"Dismissive/Avoidant Attachment: The person dismisses the importance of love and connection – and the value of emotions in general. Often idealizes parents, but actual memories don’t corroborate. They dislike looking inward and often have a shallow, if any, self-reflection. They often are very independent, dismissive of their own emotionality, and have difficulty tolerating the heightened emotions of others."},{"id":"v_gestalt_tearing_up","tier":2,"type":"V_vignette","models":["gestalt","existential","experiential","self-psychology"],"stem":"A client begins to cry in session. Rather than saying “you seem sad,” the therapist says: “I see you tearing up, I'm wondering what you're experiencing right now.”\n\nThis illustrates which Gestalt method?","options":[{"text":"Holding","correct":false,"belongsTo":"existential"},{"text":"Phenomenological description","correct":true,"belongsTo":"gestalt"},{"text":"Activating Constructive Anxiety","correct":false,"belongsTo":"experiential"},{"text":"Experience-Near Empathy","correct":false,"belongsTo":"self-psychology"}],"rationale":"The packet contrasts these two therapist responses directly. Gestalt explains the client's experience by description instead of interpretation.","sourceLine":"Explaining experience of the client by using description instead of interpretation. Client is crying in session. Interpretation “you seem sad.” For Gestalt phenomenological method: “I see you tearing up, I’m wondering what you’re experiencing right now.” This allows for more expanded of what the client is experiencing. You’re asking them to really describe what they are experiencing in the moment."},{"id":"t2_coll_existential_hereandnowpresen","tier":2,"type":"T2_collision","models":["existential","client-centered","gestalt"],"stem":"Existential Therapy share the marker “here and now / present moment” with Client Centered Therapy, Gestalt Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Existential Therapy?","options":[{"text":"Present experience while discussing the past","correct":false,"belongsTo":"gestalt"},{"text":"“Imaginal death” exercises","correct":true,"belongsTo":"existential"},{"text":"Phenomenological description","correct":false,"belongsTo":"gestalt"},{"text":"Body awareness","correct":false,"belongsTo":"gestalt"}],"rationale":"“here and now / present moment” is claimed by Client Centered Therapy, Existential Therapy, Gestalt Therapy, so it discriminates nothing. “Imaginal death” exercises is unique to Existential Therapy.","sourceLine":"“Imaginal death” exercises: Envisioning one's death to reflect on what truly matters. Brings clarity, gratitude, and urgency for authentic living."},{"id":"v_experiential_silent_family","tier":2,"type":"V_vignette","models":["experiential","structural","strategic","satir"],"stem":"A family comes in for therapy and nobody is speaking.\n\nWhat would an Experiential/Symbolic therapist do?","options":[{"text":"Paradoxical Directives","correct":false,"belongsTo":"strategic"},{"text":"Enactment","correct":false,"belongsTo":"structural"},{"text":"Wait silently for the family to take initiative","correct":true,"belongsTo":"experiential"},{"text":"Modeling Communication","correct":false,"belongsTo":"satir"}],"rationale":"The packet states this answer outright. Motivation for change must come from the family; the therapist should not be working harder than the family.","sourceLine":"Battle for Initiative: Motivation for change must come from family. Includes having a family state the agenda for each session, waiting silently for family to take initiative, allowing family to determine how change is going to happen. The therapist should not be working harder than the family. A family comes in, and nobody is speaking. What would experiential therapist do? The right answer would be the therapist would wait silently for the family to take initiative."},{"id":"e_cbt_first_session","tier":2,"type":"T2_examtip","models":["cbt"],"stem":"According to the packet, what is taught in the first CBT session, alongside psychoeducation about how CBT works?","options":[{"text":"Assertiveness Training","correct":false,"belongsTo":"cbt"},{"text":"Problem-Solving Training","correct":false,"belongsTo":"cbt"},{"text":"Psychoeducation on the negative triad","correct":true,"belongsTo":"cbt"},{"text":"Downward Arrow","correct":false,"belongsTo":"cbt"}],"rationale":"The packet places the negative triad in the first session.","sourceLine":"Teach the client about negative triad, done in first session as well as psychoeducation about how CBT works."},{"id":"v_bowen_cutoff","tier":2,"type":"V_vignette","models":["bowen","structural","satir","strategic"],"stem":"A grandmother learned to avoid conflict by emotionally shutting down. Her daughter grew up with a distant mother and became overly enmeshed with her own daughter. That granddaughter is now emotionally reactive under stress, has moved far away to escape the family, and married someone equally distant.\n\nA Bowen therapist would name this pattern:","options":[{"text":"Family Life Chronology","correct":false,"belongsTo":"satir"},{"text":"Restraining","correct":false,"belongsTo":"strategic"},{"text":"Multigenerational Transmission Process","correct":true,"belongsTo":"bowen"},{"text":"Power Hierarchy","correct":false,"belongsTo":"structural"}],"rationale":"The packet's three-generation example. Small differences in differentiation between parents and offspring lead over many generations to marked differences.","sourceLine":"Multigenerational Transmission Process: The concept of the multigenerational transmission process describes how small differences in the levels of differentiation between parents and their offspring lead over many generations to marked differences in differentiation among the members of a multigenerational family."},{"id":"t2_coll_strategic_reframing","tier":2,"type":"T2_collision","models":["strategic","bowen","cbt","experiential","structural"],"stem":"Strategic Therapy share the marker “reframing” with Bowen Family Systems, CBT (interventions), Experiential / Symbolic Therapy (Whitaker), Structural Family Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Strategic Therapy?","options":[{"text":"Battle for Structure","correct":false,"belongsTo":"experiential"},{"text":"Enactment","correct":false,"belongsTo":"structural"},{"text":"Activating Constructive Anxiety","correct":false,"belongsTo":"experiential"},{"text":"Positioning","correct":true,"belongsTo":"strategic"}],"rationale":"“reframing” is claimed by Bowen Family Systems, CBT (interventions), Experiential / Symbolic Therapy (Whitaker), Strategic Therapy, Structural Family Therapy, so it discriminates nothing. Positioning is unique to Strategic Therapy.","sourceLine":"Positioning: Therapist takes a more exaggerated and extreme view of the problem and the family is obligated to rebel. That leads to them seeing the ways in which they have Competency. (T says your family is completely hopeless w hopes they’d say no its not)"},{"id":"t2_coll_structural_boundarywork","tier":2,"type":"T2_collision","models":["structural","experiential"],"stem":"Structural Family Therapy share the marker “boundary work” with Experiential / Symbolic Therapy (Whitaker), so that marker cannot tell them apart. Which of these IS distinctive of Structural Family Therapy?","options":[{"text":"Activating Constructive Anxiety","correct":false,"belongsTo":"experiential"},{"text":"Enmeshed Boundaries","correct":true,"belongsTo":"structural"},{"text":"Trial of Labor","correct":false,"belongsTo":"experiential"},{"text":"Battle for Initiative","correct":false,"belongsTo":"experiential"}],"rationale":"“boundary work” is claimed by Experiential / Symbolic Therapy (Whitaker), Structural Family Therapy, so it discriminates nothing. Enmeshed Boundaries is unique to Structural Family Therapy.","sourceLine":"Enmeshed Boundaries: Family members are overly dependent and too closely involved and reactive to other family members. Can lead to incest."},{"id":"t2_coll_satir_activedirectivet","tier":2,"type":"T2_collision","models":["satir","strategic","structural"],"stem":"Satir Communications Therapy share the marker “active / directive therapist” with Strategic Therapy, Structural Family Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Satir Communications Therapy?","options":[{"text":"Enmeshed Boundaries","correct":false,"belongsTo":"structural"},{"text":"Restraining","correct":false,"belongsTo":"strategic"},{"text":"Disengaged Boundaries","correct":false,"belongsTo":"structural"},{"text":"Styles of Communication","correct":true,"belongsTo":"satir"}],"rationale":"“active / directive therapist” is claimed by Satir Communications Therapy, Strategic Therapy, Structural Family Therapy, so it discriminates nothing. Styles of Communication is unique to Satir Communications Therapy.","sourceLine":"Styles of Communication: The rules that govern family interaction function as a method of ensuring the maintenance and preservation of the family’s current functioning level."},{"id":"t2_coll_narrative_investigatordete","tier":2,"type":"T2_collision","models":["narrative","bowen","satir"],"stem":"Narrative Therapy share the marker “investigator / detective stance” with Bowen Family Systems, Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Narrative Therapy?","options":[{"text":"Transforming Rules","correct":false,"belongsTo":"satir"},{"text":"Emotional Cutoff","correct":false,"belongsTo":"bowen"},{"text":"Differentiation of Self","correct":false,"belongsTo":"bowen"},{"text":"Written Artifact","correct":true,"belongsTo":"narrative"}],"rationale":"“investigator / detective stance” is claimed by Bowen Family Systems, Narrative Therapy, Satir Communications Therapy, so it discriminates nothing. Written Artifact is unique to Narrative Therapy.","sourceLine":"Written Artifact: This is a type of intervention. It is some form or written documentation that reinforces the client’s new story."},{"id":"t2_coll_solution-focused_strengthsandreso","tier":2,"type":"T2_collision","models":["solution-focused","narrative","satir"],"stem":"Solution-Focused Therapy share the marker “strengths and resources” with Narrative Therapy, Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Solution-Focused Therapy?","options":[{"text":"Affirmations/Compliments","correct":true,"belongsTo":"solution-focused"},{"text":"Distracter","correct":false,"belongsTo":"satir"},{"text":"Transforming Rules","correct":false,"belongsTo":"satir"},{"text":"Written Artifact","correct":false,"belongsTo":"narrative"}],"rationale":"“strengths and resources” is claimed by Narrative Therapy, Satir Communications Therapy, Solution-Focused Therapy, so it discriminates nothing. Affirmations/Compliments is unique to Solution-Focused Therapy.","sourceLine":"Affirmations/Compliments: Regularly acknowledge progress, strengths, and resources. Example: Tell the client, \"I am impressed you are sitting in that chair again after what you just went through.\""},{"id":"v_objrel_identification","tier":2,"type":"V_vignette","models":["object-relations","self-psychology","attachment","self-psychology"],"stem":"A husband has not merely taken on the idea that women should do the housework. He sees himself as head of the household, like his father, and expects his wife to treat him as his mother treated his dad.\n\nThis is:","options":[{"text":"Twinship Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Identification","correct":true,"belongsTo":"object-relations"},{"text":"Idealizing Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Attachment Behavior System","correct":false,"belongsTo":"attachment"}],"rationale":"The packet distinguishes identification from introjection with this example: he does not just take on the belief, he identifies with the person.","sourceLine":"Identification occurs when a person not only takes on a belief or voice of another person, but also begins to identify with that individual. In this case, the husband has not merely taken on the idea that women should do the housework; rather, he sees himself as the head of his household, like his father. He is identifying with his father. Because of this identification, he expects to be treated like his father, with his wife respecting him and treating him as his mom treated his dad."},{"id":"t2_coll_self-psychology_transferencework","tier":2,"type":"T2_collision","models":["self-psychology","object-relations"],"stem":"Self Psychology share the marker “transference work” with Object Relations, so that marker cannot tell them apart. Which of these IS distinctive of Self Psychology?","options":[{"text":"Self- and Object-Representations","correct":false,"belongsTo":"object-relations"},{"text":"Provide “experience-near” empathy","correct":true,"belongsTo":"self-psychology"},{"text":"Identification","correct":false,"belongsTo":"object-relations"},{"text":"Focus on transference/countertransference","correct":false,"belongsTo":"object-relations"}],"rationale":"“transference work” is claimed by Object Relations, Self Psychology, so it discriminates nothing. Provide “experience-near” empathy is unique to Self Psychology.","sourceLine":"Provide “experience-near” empathy"},{"id":"v_attachment_preoccupied","tier":2,"type":"V_vignette","models":["attachment"],"stem":"A client is still embroiled with anger and hurt at their parents, becomes overly dependent on attachment figures, recalls role reversal in childhood, and dreads abandonment.\n\nThis attachment pattern is:","options":[{"text":"Fearful/Avoidant Attachment (Disorganized)","correct":false,"belongsTo":"attachment"},{"text":"Secure Attachment","correct":false,"belongsTo":"attachment"},{"text":"Preoccupied/Anxious Attachment","correct":true,"belongsTo":"attachment"},{"text":"Dismissive/Avoidant Attachment","correct":false,"belongsTo":"attachment"}],"rationale":"Preoccupied/Anxious per the packet's description.","sourceLine":"Preoccupied/Anxious Attachment: The person is still embroiled with anger and hurt at parents. They sometimes value intimacy to such an extent that they become overly dependent on the attachment figure both past and present. They often recall role reversal in childhood and have a hard time seeing their own responsibility in relationships. They dread abandonment."},{"id":"t2_coll_gestalt_experiments","tier":2,"type":"T2_collision","models":["gestalt","cbt"],"stem":"Gestalt Therapy share the marker “experiments” with CBT (interventions), so that marker cannot tell them apart. Which of these IS distinctive of Gestalt Therapy?","options":[{"text":"Labeling Distortions","correct":false,"belongsTo":"cbt"},{"text":"Behavioral Activation","correct":false,"belongsTo":"cbt"},{"text":"Relaxation Training","correct":false,"belongsTo":"cbt"},{"text":"Repeating words or exaggerating gestures","correct":true,"belongsTo":"gestalt"}],"rationale":"“experiments” is claimed by CBT (interventions), Gestalt Therapy, so it discriminates nothing. Repeating words or exaggerating gestures is unique to Gestalt Therapy.","sourceLine":"Repeating words of overexaggerating gestures"},{"id":"t2_coll_existential_nonjudgmentalsta","tier":2,"type":"T2_collision","models":["existential","attachment","client-centered","gestalt"],"stem":"Existential Therapy share the marker “nonjudgmental stance” with Attachment-Based Therapy (Bowlby), Client Centered Therapy, Gestalt Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Existential Therapy?","options":[{"text":"Repeating statement","correct":false,"belongsTo":"gestalt"},{"text":"Mastering emotional pain","correct":true,"belongsTo":"existential"},{"text":"Empty chair","correct":false,"belongsTo":"gestalt"},{"text":"Experiments","correct":false,"belongsTo":"gestalt"}],"rationale":"“nonjudgmental stance” is claimed by Attachment-Based Therapy (Bowlby), Client Centered Therapy, Existential Therapy, Gestalt Therapy, so it discriminates nothing. Mastering emotional pain is unique to Existential Therapy.","sourceLine":"Mastering emotional pain: unique healing activities. Relating to pain as something that you have endured and has shaped who you are, so that the painful experience has meaning and significance. Being able to share your deepest wounds with a present nonjudgemental person – T is there with C in their suffering."},{"id":"t2_coll_experiential_familyhistorymap","tier":2,"type":"T2_collision","models":["experiential","bowen","satir","structural"],"stem":"Experiential / Symbolic Therapy (Whitaker) share the marker “family history mapping (function)” with Bowen Family Systems, Satir Communications Therapy, Structural Family Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Experiential / Symbolic Therapy (Whitaker)?","options":[{"text":"Power Hierarchy","correct":false,"belongsTo":"structural"},{"text":"Tracking","correct":false,"belongsTo":"structural"},{"text":"Reduce emotional reactivity","correct":false,"belongsTo":"bowen"},{"text":"Play, Humor, and “Craziness”","correct":true,"belongsTo":"experiential"}],"rationale":"“family history mapping (function)” is claimed by Bowen Family Systems, Experiential / Symbolic Therapy (Whitaker), Satir Communications Therapy, Structural Family Therapy, so it discriminates nothing. Play, Humor, and “Craziness” is unique to Experiential / Symbolic Therapy (Whitaker).","sourceLine":"Play, Humor, and “Craziness:” Tapping irrational side. Finding solutions in creative interactions."},{"id":"e_cbt_amt_early","tier":2,"type":"T2_examtip","models":["cbt"],"stem":"The packet notes that one CBT intervention is skill acquisition done early in therapy, teaching general coping skills with a lot of imagery and relaxation practice.\n\nWhich is it?","options":[{"text":"Behavioral Activation","correct":false,"belongsTo":"cbt"},{"text":"Exposure","correct":false,"belongsTo":"cbt"},{"text":"Anxiety Management Training","correct":true,"belongsTo":"cbt"},{"text":"Systematic Desensitization","correct":false,"belongsTo":"cbt"}],"rationale":"AMT teaches general coping skills for anytime, anywhere. Systematic desensitization instead targets a specific fear hierarchy.","sourceLine":"Skill acquisition, done early in therapy."},{"id":"v_bowen_projection","tier":2,"type":"V_vignette","models":["bowen","structural","satir","strategic"],"stem":"Maria becomes preoccupied with her daughter Emily's emotions. When Emily cries after a bad test grade, Maria reads it as evidence that Emily is emotionally fragile. Maria begins hovering, solving problems for her, and calling teachers to complain about stressful assignments.\n\nA Bowen therapist would identify this as:","options":[{"text":"Positioning","correct":false,"belongsTo":"strategic"},{"text":"Family Projection Process","correct":true,"belongsTo":"bowen"},{"text":"Enmeshed Boundaries","correct":false,"belongsTo":"structural"},{"text":"Incongruent Communication","correct":false,"belongsTo":"satir"}],"rationale":"This is the packet's own worked example of the family projection process: the primary way parents transmit their emotional problems to a child.","sourceLine":"Family Projection Process: The family projection process describes the primary way parents transmit their emotional problems to a child. The projection process can impair the functioning of one or more children and increase their vulnerability to clinical symptoms. Example: parents show no conflict or are too argumentative in front of kids"},{"id":"t2_coll_structural_reframing","tier":2,"type":"T2_collision","models":["structural","bowen","cbt","experiential","strategic"],"stem":"Structural Family Therapy share the marker “reframing” with Bowen Family Systems, CBT (interventions), Experiential / Symbolic Therapy (Whitaker), Strategic Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Structural Family Therapy?","options":[{"text":"Subsystems","correct":true,"belongsTo":"structural"},{"text":"Cognitive Restructuring","correct":false,"belongsTo":"cbt"},{"text":"Positioning","correct":false,"belongsTo":"strategic"},{"text":"Play, Humor, and “Craziness”","correct":false,"belongsTo":"experiential"}],"rationale":"“reframing” is claimed by Bowen Family Systems, CBT (interventions), Experiential / Symbolic Therapy (Whitaker), Strategic Therapy, Structural Family Therapy, so it discriminates nothing. Subsystems is unique to Structural Family Therapy.","sourceLine":"Subsystems: Families organize themselves by generation, relationship, and necessity. Examples: marital subsystem – spouses; parental subsystem: parents; executive subsystem: people who run the family; sibling subsystem – kids."},{"id":"v_satir_computer","tier":2,"type":"V_vignette","models":["satir"],"stem":"A family member responds to every emotional question by being super reasonable, intellectual, and distant, and is always correct.\n\nSatir would call this stance:","options":[{"text":"Computer","correct":true,"belongsTo":"satir"},{"text":"Leveler","correct":false,"belongsTo":"satir"},{"text":"Placater","correct":false,"belongsTo":"satir"},{"text":"Blamer","correct":false,"belongsTo":"satir"}],"rationale":"Computer: super reasonable, intellectual, distant, always correct.","sourceLine":"Computer: Super reasonable, intellectual, distant, always correct."},{"id":"t2_coll_narrative_collaborativegoa","tier":2,"type":"T2_collision","models":["narrative","cbt","solution-focused"],"stem":"Narrative Therapy share the marker “collaborative goal setting” with CBT (interventions), Solution-Focused Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Narrative Therapy?","options":[{"text":"Thin Story","correct":true,"belongsTo":"narrative"},{"text":"Finding Alternatives","correct":false,"belongsTo":"cbt"},{"text":"Exception Questioning","correct":false,"belongsTo":"solution-focused"},{"text":"Anxiety Management Training","correct":false,"belongsTo":"cbt"}],"rationale":"“collaborative goal setting” is claimed by CBT (interventions), Narrative Therapy, Solution-Focused Therapy, so it discriminates nothing. Thin Story is unique to Narrative Therapy.","sourceLine":"Thin Story: The alternate story being developed, which has minimal details. A goal is to build on this story and make it thicker."},{"id":"t2_coll_solution-focused_homeworkbetweens","tier":2,"type":"T2_collision","models":["solution-focused","bowen","cbt","strategic"],"stem":"Solution-Focused Therapy share the marker “homework / between-session task” with Bowen Family Systems, CBT (interventions), Strategic Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Solution-Focused Therapy?","options":[{"text":"Restraining","correct":false,"belongsTo":"strategic"},{"text":"Models","correct":false,"belongsTo":"bowen"},{"text":"Ordeals","correct":false,"belongsTo":"strategic"},{"text":"Coping Questions","correct":true,"belongsTo":"solution-focused"}],"rationale":"“homework / between-session task” is claimed by Bowen Family Systems, CBT (interventions), Solution-Focused Therapy, Strategic Therapy, so it discriminates nothing. Coping Questions is unique to Solution-Focused Therapy.","sourceLine":"Coping Questions: If a client has trouble identifying positive change, coping questions are asked by the therapist in order to illustrate resources that the client already has. This can include validating the client’s difficulties while also showing that they are still able to get up in the morning, go to school, etc. This highlights the client’s strengths without undermining their view of reality. These questions are supportive while also challenging the client and shifting the focus away from problem-focused narratives. Example: “How do you keep going each day even when it feels like there is no hope?”"},{"id":"t2_coll_object-relations_terminationwork","tier":2,"type":"T2_collision","models":["object-relations","self-psychology"],"stem":"Object Relations share the marker “termination work” with Self Psychology, so that marker cannot tell them apart. Which of these IS distinctive of Object Relations?","options":[{"text":"Idealizing Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Confront resistance and primitive defenses","correct":true,"belongsTo":"object-relations"},{"text":"Mirroring","correct":false,"belongsTo":"self-psychology"},{"text":"Demonstrate containment","correct":false,"belongsTo":"self-psychology"}],"rationale":"“termination work” is claimed by Object Relations, Self Psychology, so it discriminates nothing. Confront resistance and primitive defenses is unique to Object Relations.","sourceLine":"Confront (aka bringing the issues to attention: I notice when I bring this up, you quickly change the subject) resistance and primitive defense mechanisms."},{"id":"t2_coll_self-psychology_selfesteem","tier":2,"type":"T2_collision","models":["self-psychology","satir"],"stem":"Self Psychology share the marker “self-esteem” with Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Self Psychology?","options":[{"text":"Blamer","correct":false,"belongsTo":"satir"},{"text":"Leveler","correct":false,"belongsTo":"satir"},{"text":"Computer","correct":false,"belongsTo":"satir"},{"text":"Mourning loss of selfobjects","correct":true,"belongsTo":"self-psychology"}],"rationale":"“self-esteem” is claimed by Satir Communications Therapy, Self Psychology, so it discriminates nothing. Mourning loss of selfobjects is unique to Self Psychology.","sourceLine":"Mourning loss of selfobjects Mourning the mother they may have never had. They can grieve these losses. An acceptance of that loss, a sadness that is allowed to happen over it. Cry for their younger selves, inner child."},{"id":"t2_conf_attachment_secureattachment","tier":2,"type":"T2_collision","models":["attachment"],"stem":"Within Attachment-Based Therapy (Bowlby): which term matches this description?\n\n“The person has easy access to a wide range of feelings and memories, positive and negative. Has a balanced view of parents and has worked through hurt and anger from the past. Has developed a strong sense of self and empathy for others.”","options":[{"text":"Dismissive/Avoidant Attachment","correct":false,"belongsTo":"attachment"},{"text":"Secure Attachment","correct":true,"belongsTo":"attachment"},{"text":"Preoccupied/Anxious Attachment","correct":false,"belongsTo":"attachment"},{"text":"Fearful/Avoidant Attachment (Disorganized)","correct":false,"belongsTo":"attachment"}],"rationale":"The packet distinguishes these explicitly (Attachment styles).","sourceLine":"Secure Attachment: The person has easy access to a wide range of feelings and memories, positive and negative. Has a balanced view of parents and has worked through hurt and anger from the past. Has developed a strong sense of self and empathy for others."},{"id":"t2_coll_gestalt_nonjudgmentalsta","tier":2,"type":"T2_collision","models":["gestalt","attachment","client-centered","existential"],"stem":"Gestalt Therapy share the marker “nonjudgmental stance” with Attachment-Based Therapy (Bowlby), Client Centered Therapy, Existential Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Gestalt Therapy?","options":[{"text":"Top dog / underdog dialogue","correct":true,"belongsTo":"gestalt"},{"text":"Focus on moment to moment","correct":false,"belongsTo":"existential"},{"text":"Dismissive/Avoidant Attachment","correct":false,"belongsTo":"attachment"},{"text":"Repair","correct":false,"belongsTo":"attachment"}],"rationale":"“nonjudgmental stance” is claimed by Attachment-Based Therapy (Bowlby), Client Centered Therapy, Existential Therapy, Gestalt Therapy, so it discriminates nothing. Top dog / underdog dialogue is unique to Gestalt Therapy.","sourceLine":"Top dog / underdog dialogue"},{"id":"t2_coll_existential_holdingenvironme","tier":2,"type":"T2_collision","models":["existential","object-relations","self-psychology"],"stem":"Existential Therapy share the marker “holding environment” with Object Relations, Self Psychology, so that marker cannot tell them apart. Which of these IS distinctive of Existential Therapy?","options":[{"text":"Confront resistance and primitive defenses","correct":false,"belongsTo":"object-relations"},{"text":"Focus on transference/countertransference","correct":false,"belongsTo":"object-relations"},{"text":"Interpretation","correct":false,"belongsTo":"object-relations"},{"text":"Imaginal death","correct":true,"belongsTo":"existential"}],"rationale":"“holding environment” is claimed by Existential Therapy, Object Relations, Self Psychology, so it discriminates nothing. Imaginal death is unique to Existential Therapy.","sourceLine":"“Imaginal death” exercises: Envisioning one's death to reflect on what truly matters. Brings clarity, gratitude, and urgency for authentic living."},{"id":"t2_coll_experiential_roleplay","tier":2,"type":"T2_collision","models":["experiential","cbt"],"stem":"Experiential / Symbolic Therapy (Whitaker) share the marker “role-play” with CBT (interventions), so that marker cannot tell them apart. Which of these IS distinctive of Experiential / Symbolic Therapy (Whitaker)?","options":[{"text":"Systematic Desensitization","correct":false,"belongsTo":"cbt"},{"text":"Communication Skills Training","correct":false,"belongsTo":"cbt"},{"text":"Psychoeducation on the negative triad","correct":false,"belongsTo":"cbt"},{"text":"Battle for Structure","correct":true,"belongsTo":"experiential"}],"rationale":"“role-play” is claimed by CBT (interventions), Experiential / Symbolic Therapy (Whitaker), so it discriminates nothing. Battle for Structure is unique to Experiential / Symbolic Therapy (Whitaker).","sourceLine":"Battle for Structure: Therapist establishes the rules and working atmosphere of treatment. Includes the need for the entire family to be in therapy (a mother and child come in for therapy and there is a question for the initial intervention an experiential therapist would use: the therapist discusses with mom the need to include entire family in therapy would be the correct answer."},{"id":"e_cbt_be_vs_exposure_fear","tier":2,"type":"T2_examtip","models":["cbt"],"stem":"A client who fears blushing is repeatedly exposed to blushing in order to reduce the fear of blushing itself.\n\nThe packet says this is:","options":[{"text":"Successive Approximation","correct":false,"belongsTo":"cbt"},{"text":"Exposure","correct":true,"belongsTo":"cbt"},{"text":"Opposite Action","correct":false,"belongsTo":"cbt"},{"text":"Behavioral Experiments","correct":false,"belongsTo":"cbt"}],"rationale":"Same disambiguation, opposite intention: reducing the fear itself is exposure therapy.","sourceLine":"If the client is trying to reduce their fear of blushing itself by repeated exposure it's Exposure Therapy."},{"id":"t2_coll_bowen_takingresponsibi","tier":2,"type":"T2_collision","models":["bowen","existential","satir"],"stem":"Bowen Family Systems share the marker “taking responsibility” with Existential Therapy, Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Bowen Family Systems?","options":[{"text":"Distracter","correct":false,"belongsTo":"satir"},{"text":"Givens in life","correct":false,"belongsTo":"existential"},{"text":"Holding","correct":false,"belongsTo":"existential"},{"text":"Multigenerational Transmission Process","correct":true,"belongsTo":"bowen"}],"rationale":"“taking responsibility” is claimed by Bowen Family Systems, Existential Therapy, Satir Communications Therapy, so it discriminates nothing. Multigenerational Transmission Process is unique to Bowen Family Systems.","sourceLine":"Multigenerational Transmission Process: The concept of the multigenerational transmission process describes how small differences in the levels of differentiation between parents and their offspring lead over many generations to marked differences in differentiation among the members of a multigenerational family."},{"id":"t2_coll_structural_coalitionsalignm","tier":2,"type":"T2_collision","models":["structural","experiential"],"stem":"Structural Family Therapy share the marker “coalitions / alignments” with Experiential / Symbolic Therapy (Whitaker), so that marker cannot tell them apart. Which of these IS distinctive of Structural Family Therapy?","options":[{"text":"Disengaged Boundaries","correct":true,"belongsTo":"structural"},{"text":"Activating Constructive Anxiety","correct":false,"belongsTo":"experiential"},{"text":"Battle for Structure","correct":false,"belongsTo":"experiential"},{"text":"Play, Humor, and “Craziness”","correct":false,"belongsTo":"experiential"}],"rationale":"“coalitions / alignments” is claimed by Experiential / Symbolic Therapy (Whitaker), Structural Family Therapy, so it discriminates nothing. Disengaged Boundaries is unique to Structural Family Therapy.","sourceLine":"Disengaged Boundaries: Where family members are isolated from each other. Can lead to AOD use and is a result of rigid boundaries."},{"id":"v_satir_blamer","tier":2,"type":"V_vignette","models":["satir"],"stem":"In a family session one member consistently attacks the others, finds fault, and speaks like a boss or dictator.\n\nIn Satir's terms this communication stance is:","options":[{"text":"Placater","correct":false,"belongsTo":"satir"},{"text":"Blamer","correct":true,"belongsTo":"satir"},{"text":"Computer","correct":false,"belongsTo":"satir"},{"text":"Distracter","correct":false,"belongsTo":"satir"}],"rationale":"Satir's five communication stances. Blamer: attacking others, fault finder, dictator, boss.","sourceLine":"Blamer: Attacking others, fault finder, dictator, boss."},{"id":"t2_conf_object-relations_projection","tier":2,"type":"T2_collision","models":["object-relations"],"stem":"Within Object Relations: which term matches this description?\n\n“Involves projecting undesirable feelings or emotions onto someone else, rather than admitting to or dealing with the unwanted feelings.”","options":[{"text":"Identification","correct":false,"belongsTo":"object-relations"},{"text":"Projection","correct":true,"belongsTo":"object-relations"},{"text":"Projective Identification","correct":false,"belongsTo":"object-relations"},{"text":"Introjection","correct":false,"belongsTo":"object-relations"}],"rationale":"The packet distinguishes these explicitly (Psychodynamic four-way (flagged in packet)).","sourceLine":"Projection: Involves projecting undesirable feelings or emotions onto someone else, rather than admitting to or dealing with the unwanted feelings."},{"id":"t2_conf_self-psychology_idealizingtransfer","tier":2,"type":"T2_collision","models":["self-psychology"],"stem":"Within Self Psychology: which term matches this description?\n\n“The patient looks up to and admires the therapist”","options":[{"text":"Twinship Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Adversarial Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Mirroring Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Idealizing Transference","correct":true,"belongsTo":"self-psychology"}],"rationale":"The packet distinguishes these explicitly (Self-object transference types).","sourceLine":"Idealizing Transference: The patient looks up to and admires the therapist"},{"id":"t2_conf_attachment_fearfulavoidantatt","tier":2,"type":"T2_collision","models":["attachment"],"stem":"Within Attachment-Based Therapy (Bowlby): which term matches this description?\n\n“The person usually has a history of trauma and or loss. Similar to Dismissive/Avoidant, they dismiss the importance of love and connection but usually out of fear or a belief that they are unworthy of love. They have difficulty trusting others and may feel uncomfortable with emotional closeness.”","options":[{"text":"Secure Attachment","correct":false,"belongsTo":"attachment"},{"text":"Preoccupied/Anxious Attachment","correct":false,"belongsTo":"attachment"},{"text":"Dismissive/Avoidant Attachment","correct":false,"belongsTo":"attachment"},{"text":"Fearful/Avoidant Attachment (Disorganized)","correct":true,"belongsTo":"attachment"}],"rationale":"The packet distinguishes these explicitly (Attachment styles).","sourceLine":"Fearful/Avoidant Attachment (Disorganized): The person usually has a history of trauma and or loss. Similar to Dismissive/Avoidant, they dismiss the importance of love and connection but usually out of fear or a belief that they are unworthy of love. They have difficulty trusting others and may feel uncomfortable with emotional closeness."},{"id":"t2_coll_gestalt_hereandnowpresen","tier":2,"type":"T2_collision","models":["gestalt","client-centered","existential"],"stem":"Gestalt Therapy share the marker “here and now / present moment” with Client Centered Therapy, Existential Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Gestalt Therapy?","options":[{"text":"Holding","correct":false,"belongsTo":"existential"},{"text":"Focus on moment to moment","correct":false,"belongsTo":"existential"},{"text":"Phenomenological description","correct":true,"belongsTo":"gestalt"},{"text":"Imaginal death","correct":false,"belongsTo":"existential"}],"rationale":"“here and now / present moment” is claimed by Client Centered Therapy, Existential Therapy, Gestalt Therapy, so it discriminates nothing. Phenomenological description is unique to Gestalt Therapy.","sourceLine":"Explaining experience of the client by using description instead of interpretation. Client is crying in session. Interpretation “you seem sad.” For Gestalt phenomenological method: “I see you tearing up, I’m wondering what you’re experiencing right now.” This allows for more expanded of what the client is experiencing. You’re asking them to really describe what they are experiencing in the moment."},{"id":"t2_coll_existential_processnotconten","tier":2,"type":"T2_collision","models":["existential","gestalt"],"stem":"Existential Therapy share the marker “process not content” with Gestalt Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Existential Therapy?","options":[{"text":"Present experience while discussing the past","correct":false,"belongsTo":"gestalt"},{"text":"Focus on process","correct":false,"belongsTo":"gestalt"},{"text":"Mastering emotional pain","correct":true,"belongsTo":"existential"},{"text":"Top dog / underdog dialogue","correct":false,"belongsTo":"gestalt"}],"rationale":"“process not content” is claimed by Existential Therapy, Gestalt Therapy, so it discriminates nothing. Mastering emotional pain is unique to Existential Therapy.","sourceLine":"Mastering emotional pain: unique healing activities. Relating to pain as something that you have endured and has shaped who you are, so that the painful experience has meaning and significance. Being able to share your deepest wounds with a present nonjudgemental person – T is there with C in their suffering."},{"id":"t2_coll_experiential_boundarywork","tier":2,"type":"T2_collision","models":["experiential","structural"],"stem":"Experiential / Symbolic Therapy (Whitaker) share the marker “boundary work” with Structural Family Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Experiential / Symbolic Therapy (Whitaker)?","options":[{"text":"Enactment","correct":false,"belongsTo":"structural"},{"text":"Joining","correct":false,"belongsTo":"structural"},{"text":"Unbalancing","correct":false,"belongsTo":"structural"},{"text":"Play, Humor, and “Craziness”","correct":true,"belongsTo":"experiential"}],"rationale":"“boundary work” is claimed by Experiential / Symbolic Therapy (Whitaker), Structural Family Therapy, so it discriminates nothing. Play, Humor, and “Craziness” is unique to Experiential / Symbolic Therapy (Whitaker).","sourceLine":"Play, Humor, and “Craziness:” Tapping irrational side. Finding solutions in creative interactions."},{"id":"e_cbt_thought_record_next","tier":2,"type":"T2_examtip","models":["cbt"],"stem":"Which CBT technique expands the three-column technique by adding columns for an alternative response and the resulting emotional outcome?","options":[{"text":"Finding Alternatives","correct":false,"belongsTo":"cbt"},{"text":"Three-Column Technique","correct":false,"belongsTo":"cbt"},{"text":"Labeling Distortions","correct":false,"belongsTo":"cbt"},{"text":"Thought Record","correct":true,"belongsTo":"cbt"}],"rationale":"The packet calls the thought record the next step after the three-column technique.","sourceLine":"Thought Record: Expands on the three-column technique, with columns to record alternative responses to the automatic thought and behavioral or emotional outcomes of changing the thought. Add a column for an alternate response and pay attention to the resulting emotional outcome. Next step of three-column technique."},{"id":"t2_coll_bowen_homeworkbetweens","tier":2,"type":"T2_collision","models":["bowen","cbt","solution-focused","strategic"],"stem":"Bowen Family Systems share the marker “homework / between-session task” with CBT (interventions), Solution-Focused Therapy, Strategic Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Bowen Family Systems?","options":[{"text":"Assertiveness Training","correct":false,"belongsTo":"cbt"},{"text":"Systematic Desensitization","correct":false,"belongsTo":"cbt"},{"text":"Prescribing the Symptom","correct":false,"belongsTo":"strategic"},{"text":"Family Projection Process","correct":true,"belongsTo":"bowen"}],"rationale":"“homework / between-session task” is claimed by Bowen Family Systems, CBT (interventions), Solution-Focused Therapy, Strategic Therapy, so it discriminates nothing. Family Projection Process is unique to Bowen Family Systems.","sourceLine":"Family Projection Process: The family projection process describes the primary way parents transmit their emotional problems to a child. The projection process can impair the functioning of one or more children and increase their vulnerability to clinical symptoms. Example: parents show no conflict or are too argumentative in front of kids"},{"id":"t2_coll_structural_enactment","tier":2,"type":"T2_collision","models":["structural","self-psychology"],"stem":"Structural Family Therapy share the marker “enactment” with Self Psychology, so that marker cannot tell them apart. Which of these IS distinctive of Structural Family Therapy?","options":[{"text":"Mourning loss of selfobjects","correct":false,"belongsTo":"self-psychology"},{"text":"Mirroring","correct":false,"belongsTo":"self-psychology"},{"text":"Experience-Near Empathy","correct":false,"belongsTo":"self-psychology"},{"text":"Enmeshed Boundaries","correct":true,"belongsTo":"structural"}],"rationale":"“enactment” is claimed by Self Psychology, Structural Family Therapy, so it discriminates nothing. Enmeshed Boundaries is unique to Structural Family Therapy.","sourceLine":"Enmeshed Boundaries: Family members are overly dependent and too closely involved and reactive to other family members. Can lead to incest."},{"id":"t2_coll_satir_investigatordete","tier":2,"type":"T2_collision","models":["satir","bowen","narrative"],"stem":"Satir Communications Therapy share the marker “investigator / detective stance” with Bowen Family Systems, Narrative Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Satir Communications Therapy?","options":[{"text":"Opening Cutoff Relationships","correct":false,"belongsTo":"bowen"},{"text":"Models","correct":false,"belongsTo":"bowen"},{"text":"Thick Story","correct":false,"belongsTo":"narrative"},{"text":"Transforming Rules","correct":true,"belongsTo":"satir"}],"rationale":"“investigator / detective stance” is claimed by Bowen Family Systems, Narrative Therapy, Satir Communications Therapy, so it discriminates nothing. Transforming Rules is unique to Satir Communications Therapy.","sourceLine":"Transforming Rules: Assisting clients to create more functional, less rigid guidelines."},{"id":"t2_conf_object-relations_introjection","tier":2,"type":"T2_collision","models":["object-relations"],"stem":"Within Object Relations: which term matches this description?\n\n“Where the subject replicates in themselves behaviors, attributes, or other fragments of the surrounding world, especially of other people. An unconscious taking in of another person’s traits, behaviors, or attitudes as if they were one’s own.”","options":[{"text":"Introjection","correct":true,"belongsTo":"object-relations"},{"text":"Projection","correct":false,"belongsTo":"object-relations"},{"text":"Projective Identification","correct":false,"belongsTo":"object-relations"},{"text":"Identification","correct":false,"belongsTo":"object-relations"}],"rationale":"The packet distinguishes these explicitly (Psychodynamic four-way (flagged in packet)).","sourceLine":"Introjection: Where the subject replicates in themselves behaviors, attributes, or other fragments of the surrounding world, especially of other people. An unconscious taking in of another person’s traits, behaviors, or attitudes as if they were one’s own."},{"id":"t2_conf_self-psychology_adversarialtransfe","tier":2,"type":"T2_collision","models":["self-psychology"],"stem":"Within Self Psychology: which term matches this description?\n\n“The need for a supportive relationship that the patient can oppose in order to grow. The therapist can be a person who cares about them, but C is also allowed to disagree and push back, and this could be an important way of healing for a client who felt differential their entire life.”","options":[{"text":"Idealizing Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Twinship Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Mirroring Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Adversarial Transference","correct":true,"belongsTo":"self-psychology"}],"rationale":"The packet distinguishes these explicitly (Self-object transference types).","sourceLine":"Adversarial Transference: The need for a supportive relationship that the patient can oppose in order to grow. The therapist can be a person who cares about them, but C is also allowed to disagree and push back, and this could be an important way of healing for a client who felt differential their entire life."},{"id":"t2_conf_attachment_dismissiveavoidant","tier":2,"type":"T2_collision","models":["attachment"],"stem":"Within Attachment-Based Therapy (Bowlby): which term matches this description?\n\n“The person dismisses the importance of love and connection – and the value of emotions in general. Often idealizes parents, but actual memories don’t corroborate. They dislike looking inward and often have a shallow, if any, self-reflection. They often are very independent, dismissive of their own emotionality, and have difficulty tolerating the heightened emotions of others.”","options":[{"text":"Preoccupied/Anxious Attachment","correct":false,"belongsTo":"attachment"},{"text":"Dismissive/Avoidant Attachment","correct":true,"belongsTo":"attachment"},{"text":"Fearful/Avoidant Attachment (Disorganized)","correct":false,"belongsTo":"attachment"},{"text":"Secure Attachment","correct":false,"belongsTo":"attachment"}],"rationale":"The packet distinguishes these explicitly (Attachment styles).","sourceLine":"Dismissive/Avoidant Attachment: The person dismisses the importance of love and connection – and the value of emotions in general. Often idealizes parents, but actual memories don’t corroborate. They dislike looking inward and often have a shallow, if any, self-reflection. They often are very independent, dismissive of their own emotionality, and have difficulty tolerating the heightened emotions of others."},{"id":"t2_coll_gestalt_processnotconten","tier":2,"type":"T2_collision","models":["gestalt","existential"],"stem":"Gestalt Therapy share the marker “process not content” with Existential Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Gestalt Therapy?","options":[{"text":"Focus on moment to moment","correct":false,"belongsTo":"existential"},{"text":"Mastering emotional pain","correct":false,"belongsTo":"existential"},{"text":"Present experience while discussing the past","correct":true,"belongsTo":"gestalt"},{"text":"Imaginal death","correct":false,"belongsTo":"existential"}],"rationale":"“process not content” is claimed by Existential Therapy, Gestalt Therapy, so it discriminates nothing. Present experience while discussing the past is unique to Gestalt Therapy.","sourceLine":"Paying to client’s present experience as they’re discussing the past: right now, what are experiencing as you think about that past relationship?"},{"id":"t2_coll_experiential_coalitionsalignm","tier":2,"type":"T2_collision","models":["experiential","structural"],"stem":"Experiential / Symbolic Therapy (Whitaker) share the marker “coalitions / alignments” with Structural Family Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Experiential / Symbolic Therapy (Whitaker)?","options":[{"text":"Alliances","correct":false,"belongsTo":"structural"},{"text":"Enactment","correct":false,"belongsTo":"structural"},{"text":"Joining","correct":false,"belongsTo":"structural"},{"text":"Play, Humor, and “Craziness”","correct":true,"belongsTo":"experiential"}],"rationale":"“coalitions / alignments” is claimed by Experiential / Symbolic Therapy (Whitaker), Structural Family Therapy, so it discriminates nothing. Play, Humor, and “Craziness” is unique to Experiential / Symbolic Therapy (Whitaker).","sourceLine":"Play, Humor, and “Craziness:” Tapping irrational side. Finding solutions in creative interactions."},{"id":"e_cbt_relaxation_initial","tier":2,"type":"T2_examtip","models":["cbt"],"stem":"The packet flags one CBT technique with the note “select this on test” for questions about the initial phase of treatment.\n\nWhich technique belongs to the initial phase, alongside psychoeducation and thought patterns?","options":[{"text":"Thought Record","correct":false,"belongsTo":"cbt"},{"text":"Opposite Action","correct":false,"belongsTo":"cbt"},{"text":"Relaxation Training","correct":true,"belongsTo":"cbt"},{"text":"Mastery/Pleasure Ratings","correct":false,"belongsTo":"cbt"}],"rationale":"The packet marks relaxation training as initial phase and says: select this on test.","sourceLine":"Relaxation Training: Teaches the client to relax muscles to condition a relaxation response to counter tension. Uses imagery, music, and other stimuli to assist in acquiring response. Initial phase of treatment, including psychoeducation and thought patterns, select this on test. Taking some control over the relaxation of their bodies. For trauma interventions for example."},{"id":"t2_coll_bowen_psychoeducationt","tier":2,"type":"T2_collision","models":["bowen","cbt"],"stem":"Bowen Family Systems share the marker “psychoeducation / teaching” with CBT (interventions), so that marker cannot tell them apart. Which of these IS distinctive of Bowen Family Systems?","options":[{"text":"Problem-Solving Training","correct":false,"belongsTo":"cbt"},{"text":"Increasing Differentiation","correct":true,"belongsTo":"bowen"},{"text":"Behavioral Activation","correct":false,"belongsTo":"cbt"},{"text":"Mastery/Pleasure Ratings","correct":false,"belongsTo":"cbt"}],"rationale":"“psychoeducation / teaching” is claimed by Bowen Family Systems, CBT (interventions), so it discriminates nothing. Increasing Differentiation is unique to Bowen Family Systems.","sourceLine":"Increasing Differentiation: By forming supportive relationship with family members to explore the origins and effects of their families beliefs and behaviors."},{"id":"t2_coll_satir_familyhistorymap","tier":2,"type":"T2_collision","models":["satir","bowen","experiential","structural"],"stem":"Satir Communications Therapy share the marker “family history mapping (function)” with Bowen Family Systems, Experiential / Symbolic Therapy (Whitaker), Structural Family Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Satir Communications Therapy?","options":[{"text":"Styles of Communication","correct":true,"belongsTo":"satir"},{"text":"Tracking","correct":false,"belongsTo":"structural"},{"text":"Family Map","correct":false,"belongsTo":"structural"},{"text":"Mimesis","correct":false,"belongsTo":"structural"}],"rationale":"“family history mapping (function)” is claimed by Bowen Family Systems, Experiential / Symbolic Therapy (Whitaker), Satir Communications Therapy, Structural Family Therapy, so it discriminates nothing. Styles of Communication is unique to Satir Communications Therapy.","sourceLine":"Styles of Communication: The rules that govern family interaction function as a method of ensuring the maintenance and preservation of the family’s current functioning level."},{"id":"t2_coll_object-relations_holdingenvironme","tier":2,"type":"T2_collision","models":["object-relations","existential","self-psychology"],"stem":"Object Relations share the marker “holding environment” with Existential Therapy, Self Psychology, so that marker cannot tell them apart. Which of these IS distinctive of Object Relations?","options":[{"text":"Identify alternative self-objects","correct":false,"belongsTo":"self-psychology"},{"text":"Demonstrate containment","correct":false,"belongsTo":"self-psychology"},{"text":"Mirroring Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Identification","correct":true,"belongsTo":"object-relations"}],"rationale":"“holding environment” is claimed by Existential Therapy, Object Relations, Self Psychology, so it discriminates nothing. Identification is unique to Object Relations.","sourceLine":"Identification occurs when a person not only takes on a belief or voice of another person, but also begins to identify with that individual. In this case, the husband has not merely taken on the idea that women should do the housework; rather, he sees himself as the head of his household, like his father. He is identifying with his father. Because of this identification, he expects to be treated like his father, with his wife respecting him and treating him as his mom treated his dad."},{"id":"t2_coll_self-psychology_terminationwork","tier":2,"type":"T2_collision","models":["self-psychology","object-relations"],"stem":"Self Psychology share the marker “termination work” with Object Relations, so that marker cannot tell them apart. Which of these IS distinctive of Self Psychology?","options":[{"text":"Focus on transference/countertransference","correct":false,"belongsTo":"object-relations"},{"text":"Identification","correct":false,"belongsTo":"object-relations"},{"text":"Self- and Object-Representations","correct":false,"belongsTo":"object-relations"},{"text":"Idealizing Transference","correct":true,"belongsTo":"self-psychology"}],"rationale":"“termination work” is claimed by Object Relations, Self Psychology, so it discriminates nothing. Idealizing Transference is unique to Self Psychology.","sourceLine":"Idealizing Transference: The patient looks up to and admires the therapist"},{"id":"t2_coll_attachment_nonjudgmentalsta","tier":2,"type":"T2_collision","models":["attachment","client-centered","existential","gestalt"],"stem":"Attachment-Based Therapy (Bowlby) share the marker “nonjudgmental stance” with Client Centered Therapy, Existential Therapy, Gestalt Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Attachment-Based Therapy (Bowlby)?","options":[{"text":"Phenomenological description","correct":false,"belongsTo":"gestalt"},{"text":"Standing up while speaking","correct":false,"belongsTo":"gestalt"},{"text":"Body awareness","correct":false,"belongsTo":"gestalt"},{"text":"Collaboratively identifying attachment style","correct":true,"belongsTo":"attachment"}],"rationale":"“nonjudgmental stance” is claimed by Attachment-Based Therapy (Bowlby), Client Centered Therapy, Existential Therapy, Gestalt Therapy, so it discriminates nothing. Collaboratively identifying attachment style is unique to Attachment-Based Therapy (Bowlby).","sourceLine":"Collaboratively identifying client’s “attachment style,\" that is, problematic behavioral and emotional patterns, formed in early childhood as attempts to maintain attachment to primary caregivers."},{"id":"e_cbt_be_vs_exposure_belief","tier":2,"type":"T2_examtip","models":["cbt"],"stem":"A client who fears blushing in public is asked to test the belief “people will laugh if I blush in public.”\n\nThe packet says this is:","options":[{"text":"Behavioral Experiments","correct":true,"belongsTo":"cbt"},{"text":"Exposure","correct":false,"belongsTo":"cbt"},{"text":"Systematic Desensitization","correct":false,"belongsTo":"cbt"},{"text":"Anxiety Management Training","correct":false,"belongsTo":"cbt"}],"rationale":"The packet disambiguates by intention: testing a belief is a behavioural experiment.","sourceLine":"If the client is testing a belief (\"People will laugh if I blush in public\") it’s a Behavioral Experiment."},{"id":"t2_coll_bowen_modeling","tier":2,"type":"T2_collision","models":["bowen","client-centered","satir"],"stem":"Bowen Family Systems share the marker “modeling” with Client Centered Therapy, Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Bowen Family Systems?","options":[{"text":"Blamer","correct":false,"belongsTo":"satir"},{"text":"Family Sculpting","correct":false,"belongsTo":"satir"},{"text":"Opening Cutoff Relationships","correct":true,"belongsTo":"bowen"},{"text":"Leveler","correct":false,"belongsTo":"satir"}],"rationale":"“modeling” is claimed by Bowen Family Systems, Client Centered Therapy, Satir Communications Therapy, so it discriminates nothing. Opening Cutoff Relationships is unique to Bowen Family Systems.","sourceLine":"Opening Cutoff Relationships: Encouraging and supporting clients to re-engage with estranged family members."},{"id":"t2_coll_satir_strengthsandreso","tier":2,"type":"T2_collision","models":["satir","narrative","solution-focused"],"stem":"Satir Communications Therapy share the marker “strengths and resources” with Narrative Therapy, Solution-Focused Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Satir Communications Therapy?","options":[{"text":"Mapping the Influence","correct":false,"belongsTo":"narrative"},{"text":"Externalizing the Problem","correct":false,"belongsTo":"narrative"},{"text":"Distracter","correct":true,"belongsTo":"satir"},{"text":"Formula First Session Task (FFST)","correct":false,"belongsTo":"solution-focused"}],"rationale":"“strengths and resources” is claimed by Narrative Therapy, Satir Communications Therapy, Solution-Focused Therapy, so it discriminates nothing. Distracter is unique to Satir Communications Therapy.","sourceLine":"Distracter: Seeking approval by acting out, irrelevant."},{"id":"t2_conf_object-relations_identification","tier":2,"type":"T2_collision","models":["object-relations"],"stem":"Within Object Relations: which term matches this description?\n\n“Identification occurs when a person not only takes on a belief or voice of another person, but also begins to identify with that individual. In this case, the husband has not merely taken on the idea that women should do the housework; rather, he sees himself as the head of his household, like his father. He is identifying with his father. Because of this identification, he expects to be treated like his father, with his wife respecting him and treating him as his mom treated his dad.”","options":[{"text":"Identification","correct":true,"belongsTo":"object-relations"},{"text":"Introjection","correct":false,"belongsTo":"object-relations"},{"text":"Projective Identification","correct":false,"belongsTo":"object-relations"},{"text":"Projection","correct":false,"belongsTo":"object-relations"}],"rationale":"The packet distinguishes these explicitly (Psychodynamic four-way (flagged in packet)).","sourceLine":"Identification occurs when a person not only takes on a belief or voice of another person, but also begins to identify with that individual. In this case, the husband has not merely taken on the idea that women should do the housework; rather, he sees himself as the head of his household, like his father. He is identifying with his father. Because of this identification, he expects to be treated like his father, with his wife respecting him and treating him as his mom treated his dad."},{"id":"t2_coll_self-psychology_holdingenvironme","tier":2,"type":"T2_collision","models":["self-psychology","existential","object-relations"],"stem":"Self Psychology share the marker “holding environment” with Existential Therapy, Object Relations, so that marker cannot tell them apart. Which of these IS distinctive of Self Psychology?","options":[{"text":"Confront resistance and primitive defenses","correct":false,"belongsTo":"object-relations"},{"text":"Ego","correct":false,"belongsTo":"object-relations"},{"text":"Identification","correct":false,"belongsTo":"object-relations"},{"text":"Demonstrate containment","correct":true,"belongsTo":"self-psychology"}],"rationale":"“holding environment” is claimed by Existential Therapy, Object Relations, Self Psychology, so it discriminates nothing. Demonstrate containment is unique to Self Psychology.","sourceLine":"Demonstrate that the therapist is able to provide containment: client is getting emotional, and the T can be a warm open presence without judgement and having client feel they are able to share this information and they will not be rejected. The therapist is able to hear what client is saying without becoming overwhelmed themselves."},{"id":"t2_conf_attachment_preoccupiedanxious","tier":2,"type":"T2_collision","models":["attachment"],"stem":"Within Attachment-Based Therapy (Bowlby): which term matches this description?\n\n“The person is still embroiled with anger and hurt at parents. They sometimes value intimacy to such an extent that they become overly dependent on the attachment figure both past and present. They often recall role reversal in childhood and have a hard time seeing their own responsibility in relationships. They dread abandonment.”","options":[{"text":"Preoccupied/Anxious Attachment","correct":true,"belongsTo":"attachment"},{"text":"Secure Attachment","correct":false,"belongsTo":"attachment"},{"text":"Fearful/Avoidant Attachment (Disorganized)","correct":false,"belongsTo":"attachment"},{"text":"Dismissive/Avoidant Attachment","correct":false,"belongsTo":"attachment"}],"rationale":"The packet distinguishes these explicitly (Attachment styles).","sourceLine":"Preoccupied/Anxious Attachment: The person is still embroiled with anger and hurt at parents. They sometimes value intimacy to such an extent that they become overly dependent on the attachment figure both past and present. They often recall role reversal in childhood and have a hard time seeing their own responsibility in relationships. They dread abandonment."},{"id":"e_cbt_three_column_first","tier":2,"type":"T2_examtip","models":["cbt"],"stem":"Which CBT technique does the packet describe as the initial homework assignment, collecting the situation, the automatic thought, and the associated feelings?","options":[{"text":"Three-Column Technique","correct":true,"belongsTo":"cbt"},{"text":"Mastery/Pleasure Ratings","correct":false,"belongsTo":"cbt"},{"text":"Thought Record","correct":false,"belongsTo":"cbt"},{"text":"Self-Monitoring","correct":false,"belongsTo":"cbt"}],"rationale":"Three columns: situation, automatic thought, feelings. The packet calls it the initial thing somebody would do for homework.","sourceLine":"Three-Column Technique: Client collects automatic thoughts and lists: the situation in which the thought occurred, the automatic thought, and the associated feelings. Initial thing that somebody would do for homework."},{"id":"t2_coll_bowen_investigatordete","tier":2,"type":"T2_collision","models":["bowen","narrative","satir"],"stem":"Bowen Family Systems share the marker “investigator / detective stance” with Narrative Therapy, Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Bowen Family Systems?","options":[{"text":"Mapping the Influence","correct":false,"belongsTo":"narrative"},{"text":"Opening Cutoff Relationships","correct":true,"belongsTo":"bowen"},{"text":"Placater","correct":false,"belongsTo":"satir"},{"text":"Leveler","correct":false,"belongsTo":"satir"}],"rationale":"“investigator / detective stance” is claimed by Bowen Family Systems, Narrative Therapy, Satir Communications Therapy, so it discriminates nothing. Opening Cutoff Relationships is unique to Bowen Family Systems.","sourceLine":"Opening Cutoff Relationships: Encouraging and supporting clients to re-engage with estranged family members."},{"id":"t2_conf_satir_placater","tier":2,"type":"T2_collision","models":["satir"],"stem":"Within Satir Communications Therapy: which term matches this description?\n\n“Apologizing, never disagreeing, trying to please.”","options":[{"text":"Placater","correct":true,"belongsTo":"satir"},{"text":"Blamer","correct":false,"belongsTo":"satir"},{"text":"Computer","correct":false,"belongsTo":"satir"},{"text":"Distracter","correct":false,"belongsTo":"satir"}],"rationale":"The packet distinguishes these explicitly (Satir communication stances).","sourceLine":"Placater: Apologizing, never disagreeing, trying to please."},{"id":"t2_coll_object-relations_neutralstance","tier":2,"type":"T2_collision","models":["object-relations","bowen"],"stem":"Object Relations share the marker “neutral stance” with Bowen Family Systems, so that marker cannot tell them apart. Which of these IS distinctive of Object Relations?","options":[{"text":"Models","correct":false,"belongsTo":"bowen"},{"text":"Interpretation","correct":true,"belongsTo":"object-relations"},{"text":"Emotional Cutoff","correct":false,"belongsTo":"bowen"},{"text":"Multigenerational Transmission Process","correct":false,"belongsTo":"bowen"}],"rationale":"“neutral stance” is claimed by Bowen Family Systems, Object Relations, so it discriminates nothing. Interpretation is unique to Object Relations.","sourceLine":"Promote insight and growth through interpretation."},{"id":"t2_conf_self-psychology_twinshiptransferen","tier":2,"type":"T2_collision","models":["self-psychology"],"stem":"Within Self Psychology: which term matches this description?\n\n“The patient experiences the therapist as someone like himself, “that person is like me.”””","options":[{"text":"Idealizing Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Twinship Transference","correct":true,"belongsTo":"self-psychology"},{"text":"Mirroring Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Adversarial Transference","correct":false,"belongsTo":"self-psychology"}],"rationale":"The packet distinguishes these explicitly (Self-object transference types).","sourceLine":"Twinship Transference: The patient experiences the therapist as someone like himself, “that person is like me.”"},{"id":"v_cbt_downward_arrow","tier":2,"type":"V_vignette","models":["cbt"],"stem":"A client says people did not like them at a party. The therapist asks what that meant to them; the client says they were not important. The therapist asks what that means about them; the client says they are worthless.\n\nWhich CBT technique is the therapist using?","options":[{"text":"Downward Arrow","correct":true,"belongsTo":"cbt"},{"text":"Socratic Questioning","correct":false,"belongsTo":"cbt"},{"text":"Finding Alternatives","correct":false,"belongsTo":"cbt"},{"text":"Labeling Distortions","correct":false,"belongsTo":"cbt"}],"rationale":"Downward arrow moves down to the core belief the person holds. The packet's own party example.","sourceLine":"Downward Arrow: Used to uncover underlying assumptions. “If this is true, what does it mean about you and your life?” Therapist moved downwards – people didn’t like me at the party. What was the evidence for that? What did that mean to you? I wasn’t important, and what does that mean about yourself? I am worthless. If that’s true, what does that mean about you and your life. Moves down to core belief person has."},{"id":"t2_coll_bowen_familyhistorymap","tier":2,"type":"T2_collision","models":["bowen","experiential","satir","structural"],"stem":"Bowen Family Systems share the marker “family history mapping (function)” with Experiential / Symbolic Therapy (Whitaker), Satir Communications Therapy, Structural Family Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Bowen Family Systems?","options":[{"text":"Joining","correct":false,"belongsTo":"structural"},{"text":"Triangles (Triangulation)","correct":true,"belongsTo":"bowen"},{"text":"Disengaged Boundaries","correct":false,"belongsTo":"structural"},{"text":"Subsystems","correct":false,"belongsTo":"structural"}],"rationale":"“family history mapping (function)” is claimed by Bowen Family Systems, Experiential / Symbolic Therapy (Whitaker), Satir Communications Therapy, Structural Family Therapy, so it discriminates nothing. Triangles (Triangulation) is unique to Bowen Family Systems.","sourceLine":"Triangles (Triangulation): A triangle is a three-person relationship system. It is considered the building block or “molecule” of larger emotional systems because a triangle is the smallest stable relationship system. It could be work, or a substance, not just another person."},{"id":"t2_conf_satir_blamer","tier":2,"type":"T2_collision","models":["satir"],"stem":"Within Satir Communications Therapy: which term matches this description?\n\n“Attacking others, fault finder, dictator, boss.”","options":[{"text":"Distracter","correct":false,"belongsTo":"satir"},{"text":"Computer","correct":false,"belongsTo":"satir"},{"text":"Placater","correct":false,"belongsTo":"satir"},{"text":"Blamer","correct":true,"belongsTo":"satir"}],"rationale":"The packet distinguishes these explicitly (Satir communication stances).","sourceLine":"Blamer: Attacking others, fault finder, dictator, boss."},{"id":"t3_attachment_preoccupiedanxiousat","tier":3,"type":"T3_concept","models":["attachment"],"stem":"Which term does the packet define this way?\n\n“The person is still embroiled with anger and hurt at parents. They sometimes value intimacy to such an extent that they become overly dependent on the attachment figure both past and present. They often recall role reversal in childhood and have a hard time seeing their own responsibility in relationships. They dread abandonment.”","options":[{"text":"Splitting","correct":false,"belongsTo":"object-relations"},{"text":"Fearful/Avoidant Attachment (Disorganized)","correct":false,"belongsTo":"attachment"},{"text":"Internalization","correct":false,"belongsTo":"object-relations"},{"text":"Preoccupied/Anxious Attachment","correct":true,"belongsTo":"attachment"}],"rationale":"","sourceLine":"Preoccupied/Anxious Attachment: The person is still embroiled with anger and hurt at parents. They sometimes value intimacy to such an extent that they become overly dependent on the attachment figure both past and present. They often recall role reversal in childhood and have a hard time seeing their own responsibility in relationships. They dread abandonment."},{"id":"t3_object-relations_objects","tier":3,"type":"T3_concept","models":["object-relations"],"stem":"Which term does the packet define this way?\n\n“Refers to persons in the external world. Individuals seek objects (others) from birth. We are inherently object seeking, wanting to connect to others.”","options":[{"text":"Twinship Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Self-Objects","correct":false,"belongsTo":"self-psychology"},{"text":"Adversarial Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Objects","correct":true,"belongsTo":"object-relations"}],"rationale":"","sourceLine":"Objects: Refers to persons in the external world. Individuals seek objects (others) from birth. We are inherently object seeking, wanting to connect to others."},{"id":"t3_self-psychology_experiencenearempath","tier":3,"type":"T3_concept","models":["self-psychology"],"stem":"Which term does the packet define this way?\n\n“When therapist steps into client’s shoes and imagines what it is like to be the client. The therapist really wants to step into the emotional experience, body sensations, and communicate that with the client to flesh out that experience. Taking the idea of mirroring to the extreme, that the therapist is really understanding their experience.”","options":[{"text":"Establish a holding environment","correct":false,"belongsTo":"object-relations"},{"text":"Self-Object Needs","correct":false,"belongsTo":"self-psychology"},{"text":"Optimal Frustration","correct":false,"belongsTo":"self-psychology"},{"text":"Experience-Near Empathy","correct":true,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Experience-Near Empathy: When therapist steps into client’s shoes and imagines what it is like to be the client. The therapist really wants to step into the emotional experience, body sensations, and communicate that with the client to flesh out that experience. Taking the idea of mirroring to the extreme, that the therapist is really understanding their experience."},{"id":"t3_cbt_exposure","tier":3,"type":"T3_concept","models":["cbt"],"stem":"Which term does the packet define this way?\n\n“Client faces fear stimuli without resorting to escape or avoidance maneuvers. Can be done in real life or with imagery”","options":[{"text":"Reduce emotional reactivity","correct":false,"belongsTo":"bowen"},{"text":"Opposite Action","correct":false,"belongsTo":"cbt"},{"text":"Formula First Session Task (FFST)","correct":false,"belongsTo":"solution-focused"},{"text":"Exposure","correct":true,"belongsTo":"cbt"}],"rationale":"","sourceLine":"Exposure: Client faces fear stimuli without resorting to escape or avoidance maneuvers. Can be done in real life or with imagery"},{"id":"t3_bowen_increasingdifferenti","tier":3,"type":"T3_concept","models":["bowen"],"stem":"Which term does the packet define this way?\n\n“By forming supportive relationship with family members to explore the origins and effects of their families beliefs and behaviors.”","options":[{"text":"Disengaged Boundaries","correct":false,"belongsTo":"structural"},{"text":"Multigenerational Transmission Process","correct":false,"belongsTo":"bowen"},{"text":"Increasing Differentiation","correct":true,"belongsTo":"bowen"},{"text":"Triangles (Triangulation)","correct":false,"belongsTo":"bowen"}],"rationale":"","sourceLine":"Increasing Differentiation: By forming supportive relationship with family members to explore the origins and effects of their families beliefs and behaviors."},{"id":"t3_existential_holding","tier":3,"type":"T3_concept","models":["existential"],"stem":"Which term does the packet define this way?\n\n“Concept of holding: process of looking at the problem, and really holding that, remembering that in the presence of the empathetic other. Our goal is to be with them in their pain, sitting there with them. Naming that emotional pain allows that mutual encounter, the experience is not shared, person is able to now process that situation with increased support.”","options":[{"text":"Phenomenological description","correct":false,"belongsTo":"gestalt"},{"text":"“Imaginal death” exercises","correct":false,"belongsTo":"existential"},{"text":"Repeating words or exaggerating gestures","correct":false,"belongsTo":"gestalt"},{"text":"Holding","correct":true,"belongsTo":"existential"}],"rationale":"","sourceLine":"Concept of holding: process of looking at the problem, and really holding that, remembering that in the presence of the empathetic other. Our goal is to be with them in their pain, sitting there with them. Naming that emotional pain allows that mutual encounter, the experience is not shared, person is able to now process that situation with increased support."},{"id":"t3_experiential_activatingconstructi","tier":3,"type":"T3_concept","models":["experiential"],"stem":"Which term does the packet define this way?\n\n“Reframing anxiety in the family as efforts toward competence (fear of failing to accomplish what one is capable of). Enhancing motivation, if you identify the positive thing they were afraid wouldn’t happen.”","options":[{"text":"Battle for Structure","correct":false,"belongsTo":"experiential"},{"text":"“Imaginal death” exercises","correct":false,"belongsTo":"existential"},{"text":"Givens in life","correct":false,"belongsTo":"existential"},{"text":"Activating Constructive Anxiety","correct":true,"belongsTo":"experiential"}],"rationale":"","sourceLine":"Activating Constructive Anxiety: Reframing anxiety in the family as efforts toward competence (fear of failing to accomplish what one is capable of). Enhancing motivation, if you identify the positive thing they were afraid wouldn’t happen."},{"id":"t3_gestalt_bodyawareness","tier":3,"type":"T3_concept","models":["gestalt"],"stem":"Which term does the packet define this way?\n\n“Gestalt focuses on body awareness: what are you noticing in your body. Getting in touch with the sensations and associated emotions with the sensations.”","options":[{"text":"Trial of Labor","correct":false,"belongsTo":"experiential"},{"text":"Activating Constructive Anxiety","correct":false,"belongsTo":"experiential"},{"text":"Body awareness","correct":true,"belongsTo":"gestalt"},{"text":"Standing up while speaking","correct":false,"belongsTo":"gestalt"}],"rationale":"","sourceLine":"Gestalt focuses on body awareness: what are you noticing in your body. Getting in touch with the sensations and associated emotions with the sensations."},{"id":"g_bowen_fwd_0","tier":2,"type":"T2_group","models":["bowen"],"stem":"Which of these are Bowen Family Systems interventions?","options":[{"text":"Opening Cutoff Relationships · Models · Genogram · Interacts with Family","correct":true,"belongsTo":"bowen"},{"text":"Prescribing the Symptom · Homework · Paradoxical Directives · Positioning","correct":false,"belongsTo":"strategic"},{"text":"Modeling Communication · Transforming Rules · Family Life Chronology · Take Responsibil
