<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14181f">
<title>LMFT Theory</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#161a21; --dim:#5d6673; --line:#e2e6ec;
  --accent:#2f5fd0; --accent-ink:#fff; --ok:#1c7a4a; --okbg:#e6f5ec;
  --bad:#b3261e; --badbg:#fdeceb; --warn:#8a5a00; --warnbg:#fdf3e0;
  --src:#f2f4f8; --radius:14px; --wrap:760px;
}
/* Dark tokens live in a named block so both the system preference and an
   explicit choice can pull from the same place. The media query is guarded so
   choosing Light beats a dark OS; the [data-theme] rule after it means
   choosing Dark beats a light OS. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --card:#171d26; --ink:#e8ecf2; --dim:#98a2b1; --line:#28313d;
    --accent:#6f9bff; --accent-ink:#0f1319; --ok:#6ddb9f; --okbg:#122e20;
    --bad:#ff9b93; --badbg:#38191a; --warn:#f0c274; --warnbg:#33280f;
    --src:#111721;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1319; --card:#171d26; --ink:#e8ecf2; --dim:#98a2b1; --line:#28313d;
  --accent:#6f9bff; --accent-ink:#0f1319; --ok:#6ddb9f; --okbg:#122e20;
  --bad:#ff9b93; --badbg:#38191a; --warn:#f0c274; --warnbg:#33280f;
  --src:#111721;
}
.theme{margin-left:10px;background:none;border:1px solid var(--line);
  color:var(--dim);font:inherit;font-size:12px;line-height:1;cursor:pointer;
  padding:6px 9px;border-radius:999px;white-space:nowrap}
.theme:hover{color:var(--ink);border-color:var(--dim)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:var(--wrap);margin:0 auto;padding:12px 14px 90px}
/* Reading views keep a short measure; the grid and dashboard get the window.
   Header, nav and content share one knob so they never fall out of line. */
body[data-wide] .wrap,body[data-wide] .hrow,body[data-wide] nav,body[data-wide] .frow{--wrap:1500px}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
h2{font-size:20px;margin:0 0 10px;letter-spacing:-.02em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:18px 0 7px}
p{margin:0 0 10px}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-top));
  padding-top:calc(10px + env(safe-area-inset-top));
}
.hrow{max-width:var(--wrap);margin:0 auto;display:flex;align-items:center;gap:10px}
.days{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
nav{max-width:var(--wrap);margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{
  flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--dim);
  padding:7px 13px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
}
nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav button:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
button.opt{
  display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
  user-select:text;-webkit-user-select:text;
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;
  font:inherit;cursor:pointer;line-height:1.45;
}
button.opt:active{transform:scale(.995)}
button.opt.correct{border-color:var(--ok);background:var(--okbg)}
button.opt.wrong{border-color:var(--bad);background:var(--badbg)}
button.opt.done{cursor:default}
.btn{
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;
  padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:9px;flex-wrap:wrap}
.stem{font-size:17px;line-height:1.5;white-space:pre-wrap;margin-bottom:14px}
.tag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim);border:1px solid var(--line);
  border-radius:6px;padding:2px 7px;margin-bottom:10px;
}
.src{
  background:var(--src);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:11px 13px;font-size:14px;line-height:1.55;color:var(--ink);margin-top:10px;
}
.src b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:5px;font-weight:700}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 2px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.grid14{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.tile{
  background:var(--card);border:1px solid var(--line);border-left-width:4px;
  border-radius:11px;padding:11px 12px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);
}
.tile b{display:block;font-size:14.5px;line-height:1.3;margin-bottom:4px}
.tile span{font-size:12px;color:var(--dim)}
.s-new{border-left-color:var(--line)}
.s-learning{border-left-color:var(--warn)}
.s-shaky{border-left-color:var(--bad)}
.s-solid{border-left-color:var(--ok)}
.note{font-size:13.5px;color:var(--dim);line-height:1.55}
.banner{border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.55;margin-bottom:12px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.bad{background:var(--badbg);color:var(--bad)}
table.grid{border-collapse:collapse;font-size:11.5px;width:100%;table-layout:fixed}
table.grid th,table.grid td{border:1px solid var(--line);padding:6px 7px;vertical-align:top;text-align:left}
table.grid th{background:var(--src);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
table.grid td:first-child,table.grid th:first-child{font-weight:700;width:11%}
table.grid td{line-height:1.5}
table.grid td:first-child{white-space:normal}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kv{font-size:14.5px;line-height:1.6}
.kv li{margin-bottom:5px}
ul{margin:0 0 10px;padding-left:20px}
.dim{color:var(--dim)}
.null{color:var(--warn);font-style:italic}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}
.frow{max-width:var(--wrap);margin:0 auto;display:flex;gap:9px;align-items:center}
.frow .note{flex:1;min-width:0}
/* first-run welcome */
.overlay{position:fixed;inset:0;background:rgba(8,11,16,.62);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:22px 14px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;
  max-width:560px;width:100%;padding:26px 24px 22px;margin:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.28)}
.hey{font-size:16.5px;line-height:1.7;white-space:pre-wrap;
  background:var(--src);border-radius:13px;padding:18px 19px;margin:0 0 6px}
.sig{text-align:right;font-size:15px;color:var(--dim);margin:0 0 20px;padding-right:4px}
.modal h2{font-size:21px;margin:0 0 4px}
.modal .lede{font-size:14px;color:var(--dim);margin:0 0 18px}
.pt{margin:0 0 15px;font-size:14.5px;line-height:1.6}
.pt b{display:block;margin-bottom:3px;font-size:15px;color:var(--ink)}
.byline{font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);
  padding-top:13px;margin-top:19px;line-height:1.6}
#again2{width:100%;margin-top:6px;padding:14px}
.sz{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;
  font-size:12px;cursor:pointer;padding:3px 9px;border-radius:999px;margin-left:5px}
.sz.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.reopen{background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;
  text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>LMFT Theory</h1>
    <span class="days" id="days"></span>
    <button class="theme" id="theme" title="Light, dark, or follow your Mac"></button>
  </div>
  <nav id="nav"></nav>
</header>
<div class="wrap" id="view"></div>
<footer id="foot" hidden><div class="frow" id="frow"></div></footer>

<script>
/* ---------- data (inlined at build time: single file, works offline) ---------- */
const THEORIES = {"models":[{"id":"bowen","name":"Bowen Family Systems","family":["systems"],"sourceDoc":"Systems Theories Review","changeMechanism":{"text":"Change occurs by understanding multigenerational dynamics and increasing differentiation. The only therapy that is concerned with the past three generations of the family. People’s issues are transmitted through the family.","sourceLine":"Change occurs by understanding multigenerational dynamics and increasing differentiation. The only therapy that is concerned with the past three generations of the family. People’s issues are transmitted through the family."},"therapistRoles":[{"text":"Coach/educator"},{"text":"Supervisor"},{"text":"Investigator"},{"text":"Neutral"}],"goals":[{"text":"Reduce anxiety and emotional turmoil in family system"},{"text":"Self-differentiation within the context of family"},{"text":"Decrease emotional fusion"},{"text":"Improve communication skills, teaching I statements."},{"text":"Decrease recurrence of dysfunctional patterns"},{"text":"Reduce emotional reactivity"},{"text":"Facilitate de-triangulation"}],"concepts":[{"term":"Triangles (Triangulation)","definition":"A triangle is a three-person relationship system. It is considered the building block or “molecule” of larger emotional systems because a triangle is the smallest stable relationship system. It could be work, or a substance, not just another person."},{"term":"Differentiation of Self","definition":"Families and other social groups tremendously affect how people think, feel, and act, but individuals vary in their susceptibility to a “group think” and groups vary in the amount of pressure they exert for conformity. These differences between individuals and between groups reflect differences in people’s levels of differentiation of self. Differentiation of Self refers to a person’s ability to maintain their sense of self while remaining emotionally connected to others. It reflects how well someone can balance thinking vs. feeling, and autonomy vs. intimacy, especially under stress."},{"term":"Nuclear Family Emotional System","definition":"The concept of the nuclear family emotional system describes four basic relationship patterns that govern where problems develop in a family. Effects overall differentiation. Emotional distance, dysfunction in parent or impairment in child, conflict."},{"term":"Family Projection Process","definition":"The family projection process describes the primary way parents transmit their emotional problems to a child. The projection process can impair the functioning of one or more children and increase their vulnerability to clinical symptoms. Example: parents show no conflict or are too argumentative in front of kids"},{"term":"Multigenerational Transmission Process","definition":"The concept of the multigenerational transmission process describes how small differences in the levels of differentiation between parents and their offspring lead over many generations to marked differences in differentiation among the members of a multigenerational family."},{"term":"Emotional Cutoff","definition":"The concept of emotional cutoff describes people managing their unresolved emotional issues with parents, siblings, and other family members by reducing or totally cutting off emotional contact with them."},{"term":"Genogram","definition":"Extensive study of family’s history. Acts both as an assessment and treatment tool."}],"interventions":[{"term":"Reduce emotional reactivity","definition":"Reduce emotional reactivity by having family members talk to the therapist."},{"term":"Reframing","definition":"The presenting problem as a multigenerational problem that is caused by factors beyond the individual. Reframing issues as multigenerational issue."},{"term":"Genogram","definition":"Create a multigenerational map of family emotional system."},{"term":"De-triangulation","definition":"Therapist becomes part of a \"healthy triangle\" where the therapist teaches the couple to manage their own anxiety, distance, and closeness in healthy ways. Therapist will be very conscious to not take sides, and supporting communication between family members."},{"term":"Increasing Differentiation","definition":"By forming supportive relationship with family members to explore the origins and effects of their families beliefs and behaviors."},{"term":"Teaching “I” Statements","definition":"Increases differentiation and improves communication."},{"term":"Opening Cutoff Relationships","definition":"Encouraging and supporting clients to re-engage with estranged family members."},{"term":"Interacts with Family","definition":"Interrupts arguments – open conflict is prohibited as it raises anxiety."},{"term":"Models","definition":"Demonstrates new ways to interact and communicate."},{"term":"Bibliotherapy","definition":"Assigning reading material."}],"phases":{"beginning":[{"text":"Create a family diagram of multigenerational emotional connections, genogram"},{"text":"Assess individuals’ levels of differentiation and triangulation"},{"text":"identify dysfunctional patterns that have been passed along through the generations."}],"middle":[{"text":"Teach and model differentiation through communication skill building, I-statements, teaching differences between thoughts and feelings, as well as differentiate their feelings from other people."},{"text":"De-triangulation, identifying the triangles, and exploring how that has been something that has been passed down. De-pathologizing the individual and looking at it through a family systems lens."},{"text":"encourage reunification from cutoff family members"},{"text":"teach the family how to take responsibility for their feelings and thoughts."}],"end":[{"text":"Review new skills and knowledge gained in therapy."}]},"examTips":[{"sourceLine":"Change occurs by understanding multigenerational dynamics and increasing differentiation. The only therapy that is concerned with the past three generations of the family. People’s issues are transmitted through the family."}]},{"id":"strategic","name":"Strategic Therapy","family":["systems"],"sourceDoc":"Systems Theories Review","changeMechanism":{"text":"Change occurs through action-oriented directives and paradoxical interventions. Very focused on specific problems.","sourceLine":"Change occurs through action-oriented directives and paradoxical interventions. Very focused on specific problems."},"therapistRoles":[{"text":"Therapist delivers directives that facilitate change, particularly around patterns of communication."},{"text":"Focuses on solving problem/eliminating symptoms"},{"text":"Designs a specific approach for each person’s presenting problem"}],"goals":[{"text":"Solve the presenting problems"},{"text":"Change dysfunctional patterns of interaction"}],"concepts":[],"interventions":[{"term":"Paradoxical Directives","definition":"Maneuvers that are in apparent contradiction to the goals of therapy, yet are actually designed to achieve them; paradoxical interventions help avoid confrontation with therapist’s instructions; undermines resistance by keeping clients in charge."},{"term":"Positioning","definition":"Therapist takes a more exaggerated and extreme view of the problem and the family is obligated to rebel. That leads to them seeing the ways in which they have Competency. (T says your family is completely hopeless w hopes they’d say no its not)"},{"term":"Homework","definition":"Assignments or directives that take place outside of therapy are essential to the therapy having a successful outcome. The underlying goal of the homework is to try to change the way the family dynamics function around the presenting problem that was identified in session."},{"term":"Prescribing the Symptom","definition":"A strategy in which the therapist encourages or instructs the client to engage in or practice the symptom. ie schedule a fight or schedule a worry time."},{"term":"Restraining","definition":"The therapist will discourage change or changing too quickly in an effort to elicit the desire to change from the client."},{"term":"Ordeals","definition":"Particular type of symptom prescription in which clients are encouraged to carry out harmless but unpleasant tasks whenever symptoms occur; example: having to get up and clean the basement every time the client cannot sleep."}],"phases":{"beginning":[{"text":"Define the problem"},{"text":"determine how the client understands the problem"},{"text":"assess family’s destructive patterns of relating and communicating the continued problem"},{"text":"state goals– what behaviors need to change and what would be the signs of change."}],"middle":[{"text":"Review attempted solutions"},{"text":"assign ordeals; prescribe the problem; relabel behavior"},{"text":"instruct client to respond to the problem in a new way."}],"end":[{"text":"Plan for maintenance of new behavior"},{"text":"plan for future challenges"},{"text":"emphasize positive changes made."}]},"examTips":[]},{"id":"structural","name":"Structural Family Therapy","family":["systems"],"sourceDoc":"Systems Theories Review","changeMechanism":{"text":"Change occurs through restructuring the family’s organization. Very focused on entire organization of the whole family system. Looking at bigger picture of the family interactions.","sourceLine":"Change occurs through restructuring the family’s organization. Very focused on entire organization of the whole family system. Looking at bigger picture of the family interactions."},"therapistRoles":[{"text":"Therapist is active and involved. (friendly uncle? lol)"},{"text":"The therapist helps the family understand how family structure (relationships and hierarchies) can be changed, the impact of rituals and rules, and how new patterns of interaction can be integrated into the family."},{"text":"Therapist role is to actively challenge the family's patterns of interaction, sometimes uses harsh criticism, unbalancing, therapist directs behaviors of family members in session during enactments, and instructions being followed leads to restructuring. Highlights positive behaviors. Therapist acts like a dramatic theater director."}],"goals":[{"text":"Restructure family system to allow for symptom relief and constructive problem solving."},{"text":"Change dysfunctional transactional patterns and create new ways of relating."},{"text":"Help create flexible boundaries."}],"concepts":[{"term":"Alliances","definition":"Subgroups based on gender, generation, developmental tasks."},{"term":"Coalitions","definition":"Alignments where 2 or more family members join together to form a bond against another family member."},{"term":"Power Hierarchy","definition":"Leadership and direction must be provided by the adults, typically parents. Sometimes when parents are intimidated or insecure, the power is upside down and it leads to chaos."},{"term":"Subsystems","definition":"Families organize themselves by generation, relationship, and necessity. Examples: marital subsystem – spouses; parental subsystem: parents; executive subsystem: people who run the family; sibling subsystem – kids."},{"term":"Family Map","definition":"A tool the therapist will use to depict the relationship dynamics in the family including sub-systems, alliances, coalitions and boundaries. This tool is used to conceptualize the case outside of the actual therapy. It is not used or shared with the family."},{"term":"Disengaged Boundaries","definition":"Where family members are isolated from each other. Can lead to AOD use and is a result of rigid boundaries."},{"term":"Enmeshed Boundaries","definition":"Family members are overly dependent and too closely involved and reactive to other family members. Can lead to incest."}],"interventions":[{"term":"Joining","definition":"Therapist’s first task; involves blending in with the family, adapting the family’s affect, style, and language."},{"term":"Tracking","definition":"The therapist pays close attention to family members and how they relate to one another during an enactment or spontaneous behavioral sequence, noticing boundaries, coalitions, roles, rules, etc."},{"term":"Mimesis","definition":"The therapist tracks the family’s style of communication and uses it."},{"term":"Unbalancing","definition":"Supporting someone who is in a one-down position, thus changing hierarchical position."},{"term":"Reframe","definition":"Putting the presenting problem in a perspective that is both different from what the family brings and more workable."},{"term":"Enactment","definition":"The actualization of transactional patterns under the control of the therapist. It allows the therapist to observe how family members mutually regulate their behaviors, and to determine the place of the problem behavior within the sequence of transactions."},{"term":"Boundary Making","definition":"Special case of enactment, in which the therapist defines areas of interaction that he rules open to certain members but closed to others. Example: a son is asked to leave his chair (in between his parents) and go to another chair on the opposite side of the room, so that he is not “caught in the middle”"}],"phases":{"beginning":[{"text":"Join with family"},{"text":"both accommodate to and challenge rules of family system"},{"text":"assessment/mapping of hierarchy alignments, and boundaries"},{"text":"reframing of problem to include whole system."}],"middle":[{"text":"Highlight and modify interactions"},{"text":"utilize enactments of issues to challenge participants and unbalance the system."}],"end":[{"text":"Review progress made"},{"text":"reinforce structural change"},{"text":"provide tools for future."}]},"examTips":[]},{"id":"satir","name":"Satir Communications Therapy","family":["systems","humanistic"],"sourceDoc":"Systems Theories Review","changeMechanism":{"text":"Change happens through self-awareness and improved communication. Humanistic approach.","sourceLine":"Change happens through self-awareness and improved communication. Humanistic approach."},"therapistRoles":[{"text":"Active facilitator"},{"text":"Resource detective"},{"text":"Therapist is genuine and warm"},{"text":"Honest and direct"}],"goals":[{"text":"The goal is for clients to increase congruent communication, improve self-esteem/confidence and personal growth."}],"concepts":[{"term":"Incongruent Communication","definition":"Discrepancies between verbal and non-verbal cues."},{"term":"Styles of Communication","definition":"The rules that govern family interaction function as a method of ensuring the maintenance and preservation of the family’s current functioning level."},{"term":"Placater","definition":"Apologizing, never disagreeing, trying to please."},{"term":"Blamer","definition":"Attacking others, fault finder, dictator, boss."},{"term":"Computer","definition":"Super reasonable, intellectual, distant, always correct."},{"term":"Distracter","definition":"Seeking approval by acting out, irrelevant."},{"term":"Leveler","definition":"Congruent in their beliefs about self and others."}],"interventions":[{"term":"Modeling Communication","definition":"Therapist uses “I” messages; expresses thoughts and feelings directly; avoids statements about what others are thinking or feeling; is honest."},{"term":"Family Life Chronology","definition":"Gathering history as far back as possible. Include: ideology, values, rules, disruptions, moves, and major events. What the family has been through and how those events impact the family. How past events and unresolved issues are carried out presently."},{"term":"Family Sculpting","definition":"Put people into a spatial metaphor – a physical representation of family members characterizations."},{"term":"Take Responsibility","definition":"Encouraging clients to take responsibility for how they felt, what they experienced, what meaning they made, what feelings they had about their feelings."},{"term":"Metaphors and Storytelling","definition":"Used to help clients understand their roles."},{"term":"Transforming Rules","definition":"Assisting clients to create more functional, less rigid guidelines."}],"phases":{"beginning":[{"text":"Establish rapport, a sense of equality and hope"},{"text":"Assess communication patterns, stances, and concerns."},{"text":"Identify treatment focus and goals."}],"middle":[{"text":"Increase the family’s congruent communication"},{"text":"Support and strengthen each individual’s sense of uniqueness and self-esteem."}],"end":[{"text":"Help family practice implement and integrate changes and increase awareness of larger familial patterns."}]},"examTips":[]},{"id":"narrative","name":"Narrative Therapy","family":["postmodern"],"sourceDoc":"Post Modern Therapies Review","changeMechanism":{"text":"Change occurs by separating the person from the problem and by creating a new narrative which emphasizes the individual’s competencies and strengths.","sourceLine":"Change occurs by separating the person from the problem and by creating a new narrative which emphasizes the individual’s competencies and strengths."},"therapistRoles":[{"text":"Collaborator"},{"text":"Investigator"},{"text":"Views client as expert of their own life, maintains curious stance"},{"text":"Co-author of client’s new narrative"}],"goals":[{"text":"Understand the problem-saturated story and externalize the problem"},{"text":"Deconstruct problem-saturated stories in order to create healthier narratives"},{"text":"Bring greater awareness to client's strengths and competencies"},{"text":"Increase client’s sense of control over the direction of their life"}],"concepts":[{"term":"Problem-Saturated Stories","definition":"The dominant and unhealthy stories an individual tells themselves. These are often the stories that bring people to therapy."},{"term":"Alternate Stories","definition":"The new and preferred or healthier stories an individual develops."},{"term":"Thick Story","definition":"The dominant narrative that the person maintains. This story has been repeated over time and is very detailed and usually problem-saturated."},{"term":"Thin Story","definition":"The alternate story being developed, which has minimal details. A goal is to build on this story and make it thicker."}],"interventions":[{"term":"Externalizing the Problem","definition":"This is a type of intervention. The therapist asks questions that are designed to separate the person from the problem."},{"term":"Deconstructive Questions","definition":"This is a type of intervention. Once the problem is externalized, the therapist will ask various questions designed to pull apart or dismantle the client’s problem-saturated stories."},{"term":"Mapping the Influence","definition":"This is a type of intervention. The therapist asks a series of questions to understand the effects of the problem in the client’s life."},{"term":"Unique Outcomes","definition":"This is a type of intervention. The therapist asks questions to highlight times in the client’s life when they were able to resist the effects of the problem. This is a prerequisite for re-authoring the client’s story."},{"term":"Enlisting a Witness","definition":"This is a type of intervention. The client invites someone in their life to hear them share the new narrative. This person bears witness to the client’s telling of the new story and becomes an ally to strengthen or thicken this new story."},{"term":"Written Artifact","definition":"This is a type of intervention. It is some form or written documentation that reinforces the client’s new story."},{"term":"Re-authoring the story","definition":"Assist client in reauthoring their story"}],"phases":{"beginning":[{"text":"Beginning: Client is invited to tell their problem-saturated stories."}],"middle":[{"text":"The problem is externalized"},{"text":"mapping the influence/effects of the problem"},{"text":"identify/explore unique outcomes"},{"text":"re-author story"},{"text":"enlist a witness."}],"end":[{"text":"Create written artifacts"},{"text":"document and support new narrative"},{"text":"write letters to self and others"}]},"examTips":[]},{"id":"solution-focused","name":"Solution-Focused Therapy","family":["postmodern"],"sourceDoc":"Post Modern Therapies Review","changeMechanism":{"text":"Change occurs through accessing client’s strengths and resources. Emphasizes finding solutions to a problem, not on discovering the cause or origins of the problem.","sourceLine":"Change occurs through accessing client’s strengths and resources. Emphasizes finding solutions to a problem, not on discovering the cause or origins of the problem."},"therapistRoles":[{"text":"Therapist is a consultant, coach"}],"goals":[{"text":"Client implements small and large changes to achieve their preferred future"},{"text":"Client builds on current strengths and resources"}],"concepts":[],"interventions":[{"term":"Exception Questioning","definition":"The therapist asks the client to think of a time in their life when the particular problem did not exist and what the client did differently during this time. The goal here is to focus on what has worked in the past to provide the client with a positive perspective. Example: “Tell me about the times when you don’t get angry.”"},{"term":"Formula First Session Task (FFST)","definition":"A homework task to observe what’s already working “Between now and our next meeting, observe what happens in your life that you’d like to continue.”"},{"term":"Miracle Questioning","definition":"The therapist asks the client to envision how the future will be when the problem no longer exists and what their life looks like then. Example: “Imagine that tomorrow morning you wake up and a miracle has happened. What would be different that will tell you a miracle has happened and your problem has been solved?”"},{"term":"Scaling Questions","definition":"The therapist asks the client to think of a scale ranging from the worst things could be to the best. The client then rates their current position on the scale and is asked to identify how they could move up or down the scale. The client is also encouraged to identify what point on the scale would be good enough or where their “perfect future” is. Example: “You said that things are between a 4 and a 5. What would need to happen so that things were between a 5 and 6?”"},{"term":"Presupposing Change","definition":"Rather than focusing on the problem that brought the client in, the therapist can ask the client questions to focus on the positive changes that have been occurring. Example: “What’s different or better since the last time we met?”"},{"term":"Coping Questions","definition":"If a client has trouble identifying positive change, coping questions are asked by the therapist in order to illustrate resources that the client already has. This can include validating the client’s difficulties while also showing that they are still able to get up in the morning, go to school, etc. This highlights the client’s strengths without undermining their view of reality. These questions are supportive while also challenging the client and shifting the focus away from problem-focused narratives. Example: “How do you keep going each day even when it feels like there is no hope?”"},{"term":"Affirmations/Compliments","definition":"Regularly acknowledge progress, strengths, and resources. Example: Tell the client, \"I am impressed you are sitting in that chair again after what you just went through.\""}],"phases":{"beginning":[{"text":"Join with client competencies"},{"text":"envision preferred future"},{"text":"begin to identify client’s strengths"},{"text":"use solution-oriented language"},{"text":"come up with achievable goals."}],"middle":[{"text":"Identify strengths resources, and traits client already has used to deal with problem"},{"text":"utilize solution-talk"},{"text":"identify exceptions to problems"},{"text":"utilize scaling questions to reflect on the nature of change the client has experienced feedback to clients that include compliments and tasks"},{"text":"catch and highlight small changes"},{"text":"compliments/cheerleading."}],"end":[{"text":"Assist the client to identify things they can do to continue the changes they have made identify hurdles or perceived barriers that could get in the way of the changes they made."}]},"examTips":[]},{"id":"object-relations","name":"Object Relations","family":["psychodynamic"],"sourceDoc":"Psychodynamic","changeMechanism":{"text":"Change occurs through both reparative experiences within the treatment relationship (relationship with therapist) insight into and modification of entrenched object relations pathology.","sourceLine":"Change occurs through both reparative experiences within the treatment relationship (relationship with therapist) insight into and modification of entrenched object relations pathology."},"therapistRoles":[{"text":"Neutral"},{"text":"Emphasis on transference and countertransference, paying attention to that"},{"text":"Therapist as a new and good object"}],"goals":[{"text":"Providing reparative experiences and building new internal structures (new internal structures is the idea that person would have views of self that would allow for them to be able to rely on their own self talk and self soothing that is more positive and more resilient)."},{"text":"Gaining insight into how past relationships impact client’s functioning, how feelings and experiences are continued to be connected to their past."},{"text":"Improving relationships with self and others"}],"concepts":[{"term":"Objects","definition":"Refers to persons in the external world. Individuals seek objects (others) from birth. We are inherently object seeking, wanting to connect to others."},{"term":"Internalization","definition":"Early infant-caretaker interactions lead to the person internalizing basic attitudes toward self and other, characteristic relational patterns, and a repertoire of defenses and internal capacities. If mom is warm and caring towards infant, then infant and child takes in that attitude about themselves and the world. A child who grew up with angry parents, the world is hostile, and the world is hostile to me, so I must be bad."},{"term":"Self- and Object-Representations","definition":"Infants form images of themselves and others. Once formed, they are fundamental internal structures that affect the ways in which individuals view themselves and others. These are created from the internalization process. Can create a false self disconnected from the true self."},{"term":"Ego","definition":"The structure responsible for dealing with the world, for instituting defense Mechanisms (ie projection), for internalizing external objects, and for integrating and synthesizing self-and object-representations."},{"term":"Splitting","definition":"When two contradictory states, such as love and hate, are compartmentalized and not integrated. Somebody is either all good, or all bad. Very extreme views of people, and it can switch quickly. Therapist will want to bring these two contradictions together: your friend did something hurtful, and there are things about them you really like. Are people allowed to make mistakes, and can we recover from that? Wanting to put these two extremes together."},{"term":"Projection","definition":"Involves projecting undesirable feelings or emotions onto someone else, rather than admitting to or dealing with the unwanted feelings."},{"term":"Projective Identification","definition":"Projective Identification (specific to object relations): Refers to a psychological process in which a person will project a thought or belief that they have onto a second person. Then, in most common definitions of projective identification, there is another action in which the second person is changed by the projection and begins to behave as though they are, in fact, actually characterized by those thoughts or beliefs that have been projected. The client is projecting onto the therapist a feeling of annoyance. What happens is the therapist realizes they feel annoyed. The therapist takes on the feeling themselves, they begin to identify with the feeling, the therapist finds themselves feeling annoyed. That’s the unconscious manipulation of the client putting those feelings onto the therapist. Sexual attraction: Therapist would say it’s really the client having those unconscious feelings towards the therapist."},{"term":"Introjection","definition":"Where the subject replicates in themselves behaviors, attributes, or other fragments of the surrounding world, especially of other people. An unconscious taking in of another person’s traits, behaviors, or attitudes as if they were one’s own."},{"term":"Identification","definition":"Identification occurs when a person not only takes on a belief or voice of another person, but also begins to identify with that individual. In this case, the husband has not merely taken on the idea that women should do the housework; rather, he sees himself as the head of his household, like his father. He is identifying with his father. Because of this identification, he expects to be treated like his father, with his wife respecting him and treating him as his mom treated his dad."}],"interventions":[{"term":"Establish a holding environment","definition":"Establish a holding environment"},{"term":"Interpretation","definition":"Promote insight and growth through interpretation."},{"term":"Confront resistance and primitive defenses","definition":"Confront (aka bringing the issues to attention: I notice when I bring this up, you quickly change the subject) resistance and primitive defense mechanisms."},{"term":"Focus on transference/countertransference","definition":"Focus on transference/countertransference dynamic."},{"term":"Identify and process projective identification","definition":"Identify and process projective identification (T is aware of feeling so and do about the client, how would object relations therapist handle this situation, look for this term)."}],"phases":{"beginning":[{"text":"Establish a holding environment"},{"text":"Build rapport and therapeutic alliance through listening"},{"text":"exploration of client’s experience, empathy, and maintaining neutrality: low self disclosure"}],"middle":[{"text":"Promote insight and growth through interpretation."},{"text":"Confront (aka bringing the issues to attention: I notice when I bring this up, you quickly change the subject) resistance and primitive defense mechanisms."},{"text":"Focus on transference/countertransference dynamic."},{"text":"Identify and process projective identification (T is aware of feeling so and do about the client, how would object relations therapist handle this situation, look for this term)."}],"end":[{"text":"Work through termination and abandonment issues."},{"text":"Consolidate interpretations."},{"text":"Review insights gained in therapy."}]},"examTips":[{"sourceLine":"Identify and process projective identification (T is aware of feeling so and do about the client, how would object relations therapist handle this situation, look for this term)."}]},{"id":"self-psychology","name":"Self Psychology","family":["psychodynamic"],"sourceDoc":"Psychodynamic","changeMechanism":{"text":"Change occurs through empathetic attunement and strengthening the self-structures through optimal responsiveness. Shift away from interpretation.","sourceLine":"Change occurs through empathetic attunement and strengthening the self-structures through optimal responsiveness. Shift away from interpretation."},"therapistRoles":[{"text":"Emphasis on empathetic understanding and optimal responsiveness: reparenting the client"},{"text":"Allows emergence of self-object transferences and the repair of disruptions"},{"text":"Repairing any disruptions"}],"goals":[{"text":"Developing self-cohesion and self-esteem, client connects to true self"},{"text":"Locating better self objects"}],"concepts":[{"term":"Self-Objects","definition":"Early self-objects are those empathetic or attuned caretakers who perform vital functions for the infant that it cannot carry out itself"},{"term":"Self-Object Needs","definition":"Mirroring, idealization of others, twin/alter ego. Child needs these."},{"term":"Mirroring","definition":"Approving and confirming responses."},{"term":"Optimal Frustration","definition":"When a self-object is needed, but not accessible, this will create a potential problem for the self, referred to as a \"frustration.” Healthy window where child doesn’t get needs met all the time (otherwise it results in entitlement of sorts)"},{"term":"Mirroring Transference","definition":"The patient seeks acceptance and confirmation of the self from the therapist."},{"term":"Twinship Transference","definition":"The patient experiences the therapist as someone like himself, “that person is like me.”"},{"term":"Idealizing Transference","definition":"The patient looks up to and admires the therapist"},{"term":"Adversarial Transference","definition":"The need for a supportive relationship that the patient can oppose in order to grow. The therapist can be a person who cares about them, but C is also allowed to disagree and push back, and this could be an important way of healing for a client who felt differential their entire life."},{"term":"Experience-Near Empathy","definition":"When therapist steps into client’s shoes and imagines what it is like to be the client. The therapist really wants to step into the emotional experience, body sensations, and communicate that with the client to flesh out that experience. Taking the idea of mirroring to the extreme, that the therapist is really understanding their experience."}],"interventions":[{"term":"Establish a therapeutic holding environment","definition":"Establish a therapeutic holding environment"},{"term":"Demonstrate containment","definition":"Demonstrate that the therapist is able to provide containment: client is getting emotional, and the T can be a warm open presence without judgement and having client feel they are able to share this information and they will not be rejected. The therapist is able to hear what client is saying without becoming overwhelmed themselves."},{"term":"Provide “experience-near” empathy","definition":"Provide “experience-near” empathy"},{"term":"Repair disruptions of the self-object transference","definition":"Repair disruptions of the self-object transference"},{"term":"Addressing enactments","definition":"Addressing enactments: situations in the therapy may have played out in the past, or outside in the client’s life. Being able to talk about in session together. “It sounds like what’s going on with your partner is similar to what happened with your father.”"},{"term":"Mourning loss of selfobjects","definition":"Mourning the mother they may have never had. They can grieve these losses. An acceptance of that loss, a sadness that is allowed to happen over it. Cry for their younger selves, inner child."},{"term":"Mourning ambitions and fantasies","definition":"Mourning ambitions and fantasies. If person had ideas that their life was going to turn out a certain way, mourning those losses of those fantasies."},{"term":"Identify alternative self-objects","definition":"Identify alternative self-objects: people they did have had positive relationship with them. Through their relationship with T they learn about different positive selfobjects, and can start to identify healthy selfobjects for themselves."}],"phases":{"beginning":[{"text":"Establish a therapeutic holding environment"},{"text":"Demonstrate that the therapist is able to provide containment: client is getting emotional, and the T can be a warm open presence without judgement and having client feel they are able to share this information and they will not be rejected. The therapist is able to hear what client is saying without becoming overwhelmed themselves."},{"text":"Provide “experience-near” empathy"},{"text":"Explore the client's problem and history, including relationship history."}],"middle":[{"text":"Repair disruptions of the self-object transference"},{"text":"Addressing enactments: situations in the therapy may have played out in the past, or outside in the client’s life. Being able to talk about in session together. “It sounds like what’s going on with your partner is similar to what happened with your father.”"},{"text":"Empathizing with losses and blows to self."},{"text":"Mourning loss of selfobjects Mourning the mother they may have never had. They can grieve these losses. An acceptance of that loss, a sadness that is allowed to happen over it. Cry for their younger selves, inner child."},{"text":"Mourning ambitions and fantasies. If person had ideas that their life was going to turn out a certain way, mourning those losses of those fantasies."},{"text":"Identify alternative self-objects: people they did have had positive relationship with them. Through their relationship with T they learn about different positive selfobjects, and can start to identify healthy selfobjects for themselves."}],"end":[{"text":"Reflect on the treatment process"},{"text":"Acknowledge and process issues related to termination."}]},"examTips":[]},{"id":"attachment","name":"Attachment-Based Therapy (Bowlby)","family":["psychodynamic"],"sourceDoc":"Psychodynamic","changeMechanism":{"text":"Change occurs through exploration of past and current relational attachments and trauma in the environment of a healing, secure, and reliable relationship.","sourceLine":"Change occurs through exploration of past and current relational attachments and trauma in the environment of a healing, secure, and reliable relationship."},"therapistRoles":[{"text":"Therapist is a sufficiently secure base to enable a person to explore emotional experiences of the past and the present."},{"text":"Create a secure, accepting, caring, non-judgmental, and reliable environment where the patient can feel comfortable sharing their most traumatic experiences and exploring the nature of the client’s attachment pattern."}],"goals":[{"text":"Raise awareness of client’s problematic behavioral and emotional patterns, formed in early childhood as attempts to maintain attachment to primary caregivers."},{"text":"Repair the capacity to regulate affects."},{"text":"Resolve any emotional or social disruptions within the patient’s life."},{"text":"Improve quality of attachment with others."}],"concepts":[{"term":"Attachment Behavior System","definition":"The process in which infants and caregivers have an organized pattern of signals and responses that leads to the development of a protecting and trusting relationship. The emotional bond that develops between adult romantic partners is partly a function of the same motivational system - the attachment behavioral system. Relational system. Emotional bond that happens later in life repeats the behavioral systems of our childhood."},{"term":"Secure Attachment","definition":"The person has easy access to a wide range of feelings and memories, positive and negative. Has a balanced view of parents and has worked through hurt and anger from the past. Has developed a strong sense of self and empathy for others."},{"term":"Preoccupied/Anxious Attachment","definition":"The person is still embroiled with anger and hurt at parents. They sometimes value intimacy to such an extent that they become overly dependent on the attachment figure both past and present. They often recall role reversal in childhood and have a hard time seeing their own responsibility in relationships. They dread abandonment."},{"term":"Dismissive/Avoidant Attachment","definition":"The person dismisses the importance of love and connection – and the value of emotions in general. Often idealizes parents, but actual memories don’t corroborate. They dislike looking inward and often have a shallow, if any, self-reflection. They often are very independent, dismissive of their own emotionality, and have difficulty tolerating the heightened emotions of others."},{"term":"Fearful/Avoidant Attachment (Disorganized)","definition":"The person usually has a history of trauma and or loss. Similar to Dismissive/Avoidant, they dismiss the importance of love and connection but usually out of fear or a belief that they are unworthy of love. They have difficulty trusting others and may feel uncomfortable with emotional closeness."}],"interventions":[{"term":"Attunement","definition":"Attunement is the key intervention in the early stage and consists of forging a personal relationship between the therapist and the patient."},{"term":"Provide a secure base","definition":"The therapist provides a secure base by reliably demonstrating empathy and care."},{"term":"Collaboratively identifying attachment style","definition":"Collaboratively identifying client’s “attachment style,\" that is, problematic behavioral and emotional patterns, formed in early childhood as attempts to maintain attachment to primary caregivers."},{"term":"Explore disruptions","definition":"Disruptions are explored in the middle phase. Disruptions include those in the early life of the client as well as those in current relationships, including the relationship with the therapist. Where they are having conflicts, where there is pain, disruptions in attunement. Can even apply to what happens in the therapy room, between client and the therapist."},{"term":"Support affect regulation","definition":"Support client’s ability to regulate and express emotions in relationally difficult Situations teaching clients to have a reflective stance toward themselves."},{"term":"Repair","definition":"Repair occurs during the late middle phase and the end of treatment."},{"term":"Repair stage","definition":"Repair stage of the therapy aims to alter the patient’s current reactions to the events that cause them emotional distress by sharing their own interpretations of the event. By sharing their own subjective interpretation, the therapist helps create a new reality of the painful events for the patient in order to get rid of unwanted emotions and reactions."}],"phases":{"beginning":[{"text":"Attunement is the key intervention in the early stage and consists of forging a personal relationship between the therapist and the patient."},{"text":"The therapist provides a secure base by reliably demonstrating empathy and care."},{"text":"Collaboratively identifying client’s “attachment style,\" that is, problematic behavioral and emotional patterns, formed in early childhood as attempts to maintain attachment to primary caregivers."}],"middle":[{"text":"Disruptions are explored in the middle phase. Disruptions include those in the early life of the client as well as those in current relationships, including the relationship with the therapist. Where they are having conflicts, where there is pain, disruptions in attunement. Can even apply to what happens in the therapy room, between client and the therapist."},{"text":"Support client’s ability to regulate and express emotions in relationally difficult Situations teaching clients to have a reflective stance toward themselves."}],"end":[{"text":"Repair occurs during the late middle phase and the end of treatment."},{"text":"Repair stage of the therapy aims to alter the patient’s current reactions to the events that cause them emotional distress by sharing their own interpretations of the event. By sharing their own subjective interpretation, the therapist helps create a new reality of the painful events for the patient in order to get rid of unwanted emotions and reactions."}]},"examTips":[{"sourceLine":"On the exam, attachment therapist is specifically focused on how that person attaches in their relationships, and how they are able to regulate their own emotions. Explore history of their interactions looked like with their early caregiver."}]},{"id":"client-centered","name":"Client Centered Therapy","family":["humanistic"],"sourceDoc":"Humanistic-Existential Review","changeMechanism":{"text":"Views people are always growing and inherently good. Avoids diagnosis, avoid strict adherence to what the ideal person should be. Role of therapist is nondirective, not steering client in any one direction (unlike CBT or systems theory). Driven by what the client wants to talk about. T is a facilitator who is helping the person to grow and change. This occurs by creating unconditional positive regard. Client determines the goals of therapy. Up to the client to decide how many sessions they would like as well, a lot of support for client self-determination.","sourceLine":"Views people are always growing and inherently good. Avoids diagnosis, avoid strict adherence to what the ideal person should be. Role of therapist is nondirective, not steering client in any one direction (unlike CBT or systems theory). Driven by what the client wants to talk about. T is a facilitator who is helping the person to grow and change. This occurs by creating unconditional positive regard. Client determines the goals of therapy. Up to the client to decide how many sessions they would like as well, a lot of support for client self-determination."},"therapistRoles":[{"text":"is authentic"},{"text":"models authenticity"},{"text":"non acceptance"},{"text":"nondirective"},{"text":"non judgmental approach"},{"text":"empathy is essential, through experiencing this empathy, people are able to dive deeper into self understanding and who they are."},{"text":"Locus of control, client can have more self-awareness about their choices, their experience, having their experience make sense to them. When T is non-judgmental about their experiences, clients can make more sense of their feelings and emotional reactions. More capable of making decisions about how they want to respond."}],"goals":[{"text":"self-acceptance and self-actualization (Self-actualization is the process of realizing and expressing your true potential, becoming who you genuinely are, and living in alignment with your values, desires, and inner truth)."},{"text":"congruence between idealized self and actual self (living more authentically)"},{"text":"increased self-understanding, which can lead to self-acceptance"},{"text":"decreased level of defensiveness, insecurity and guilt."},{"text":"more positive relationships and increased comfort with others"},{"text":"experience and express feelings of the here and now, improved self-awareness skills."}],"concepts":[],"interventions":[],"phases":null,"examTips":[{"sourceLine":"No clear phases of treatment, T does not really have an agenda, due to it going against the concept of client centered. For the exam, you could have a question that asks you for initial or middle stages with client centered approach. Looking for answers that involved unconditional positive regard, client empathy, T express congruence with their reaction to the client, promotion of self-acceptance (the T can give support for self-acceptance ie when client feels shame), and congruence."}]},{"id":"gestalt","name":"Gestalt Therapy","family":["humanistic"],"sourceDoc":"Humanistic-Existential Review","changeMechanism":{"text":"The idea is that change occurs through increased awareness of here and now experience and dialogic relationship between T and client. Dialogic refers to a therapeutic stance where the therapist and client engage as two authentic human beings — fully present with each other, co-creating the therapeutic process. Heavily influenced by Martin Buber’s “I-Thou” philosophy, where the therapist meets the client as a fellow human, not an object to be treated.","sourceLine":"The idea is that change occurs through increased awareness of here and now experience and dialogic relationship between T and client. Dialogic refers to a therapeutic stance where the therapist and client engage as two authentic human beings — fully present with each other, co-creating the therapeutic process. Heavily influenced by Martin Buber’s “I-Thou” philosophy, where the therapist meets the client as a fellow human, not an object to be treated."},"therapistRoles":[{"text":"Authentic present other, showing up as a real person"},{"text":"Nondirective"},{"text":"Nonjudgemental"},{"text":"Therapist presence as a real person allows the other client to become more present – that dialogic relationship. Therapist is open to client experience, back and forth dialogical experience, each person is a real person, genuine curiousity."}],"goals":[{"text":"Client will become more aware of what they’re doing, how they are doing it, how they can change themselves, while learning to accept and value themselves."}],"concepts":[{"term":"Present moment awareness","definition":"Present moment awareness."},{"term":"Phenomenological description","definition":"Explaining experience of the client by using description instead of interpretation. Client is crying in session. Interpretation “you seem sad.” For Gestalt phenomenological method: “I see you tearing up, I’m wondering what you’re experiencing right now.” This allows for more expanded of what the client is experiencing. You’re asking them to really describe what they are experiencing in the moment."},{"term":"Body awareness","definition":"Gestalt focuses on body awareness: what are you noticing in your body. Getting in touch with the sensations and associated emotions with the sensations."},{"term":"Focus on process","definition":"Focuses on the process: how things are being sad, how the therapy is unfolding, the tons of voice, body language, the energy of the therapy, paying attention to what’s going on in the moment."}],"interventions":[{"term":"Experiments","definition":"Experiments in Gestalt: T can make suggestions of client trying something new."},{"term":"Repeating statement","definition":"Repeating statement: “I’m disappointed in my partner.” T: sit up in your chair, say it a little bit louder. Check in with them about their experience. Client can say no and T can also see how they respond to the suggestion."},{"term":"Present experience while discussing the past","definition":"Paying to client’s present experience as they’re discussing the past: right now, what are experiencing as you think about that past relationship?"},{"term":"Empty chair","definition":"Empty chair"},{"term":"Top dog / underdog dialogue","definition":"Top dog / underdog dialogue"},{"term":"Repeating words or exaggerating gestures","definition":"Repeating words of overexaggerating gestures"},{"term":"Standing up while speaking","definition":"Somebody stands up while saying something"}],"phases":null,"examTips":[]},{"id":"existential","name":"Existential Therapy","family":["humanistic"],"sourceDoc":"Humanistic-Existential Review","changeMechanism":{"text":"Change occurs through finding meaning, living authentically and responsibly. The idea that the person can respond, make choices, emphasizes personal choice about how clients want to live their lives. Core question: how do I exist? Inherent meaninglessness to life and existence.","sourceLine":"Change occurs through finding meaning, living authentically and responsibly. The idea that the person can respond, make choices, emphasizes personal choice about how clients want to live their lives. Core question: how do I exist? Inherent meaninglessness to life and existence."},"therapistRoles":[{"text":"To be real and authentic other"}],"goals":[{"text":"Goals: client discovers their own life meaning, what does life mean to them, confront anxiety inherent in living. Anxiety is a part of the human condition, being able to deal with it effectively instead of getting rid of it. Agency: making their own choices in life, responsibility in the construction of their life. Emphasizes empowerment of the client. Self-awareness. Freedom. Each person has unique identity that can only be known through genuine relationships with others. It’s not until you encounter someone else that you can truly know yourself – this is why T must be a true other. Client experiences their own uniqueness through that. Each person must continually recreate themselves, life is always moving forward, existence is not fixed and we are always changing."}],"concepts":[{"term":"Focus on moment to moment","definition":"Focus on moment to moment during therapy, process not content."},{"term":"Holding","definition":"Concept of holding: process of looking at the problem, and really holding that, remembering that in the presence of the empathetic other. Our goal is to be with them in their pain, sitting there with them. Naming that emotional pain allows that mutual encounter, the experience is not shared, person is able to now process that situation with increased support."},{"term":"Mastering emotional pain","definition":"Mastering emotional pain: unique healing activities. Relating to pain as something that you have endured and has shaped who you are, so that the painful experience has meaning and significance. Being able to share your deepest wounds with a present nonjudgemental person – T is there with C in their suffering."},{"term":"Givens in life","definition":"Givens in life: death, freedom, meaningless, isolation. Encourages honesty about life’s conditions."},{"term":"Imaginal death","definition":"“Imaginal death” exercises: Envisioning one's death to reflect on what truly matters. Brings clarity, gratitude, and urgency for authentic living."}],"interventions":[{"term":"“Imaginal death” exercises","definition":"Envisioning one's death to reflect on what truly matters. Brings clarity, gratitude, and urgency for authentic living."}],"phases":null,"examTips":[]},{"id":"experiential","name":"Experiential / Symbolic Therapy (Whitaker)","family":["humanistic","systems"],"sourceDoc":"Humanistic-Existential Review","changeMechanism":{"text":"Change happens through the existential encounter – the authentic meeting of the therapist and the client in the present moment and by expanding the client’s range of experience. Very influenced by Gestalt therapy. Generally used with families, started by Carl Whittaker.","sourceLine":"Change happens through the existential encounter – the authentic meeting of the therapist and the client in the present moment and by expanding the client’s range of experience. Very influenced by Gestalt therapy. Generally used with families, started by Carl Whittaker."},"therapistRoles":[{"text":"Authentically being with client"},{"text":"Playful, creative"}],"goals":[{"text":"The goal is for growth and increased flexibility (people have fixed ways of bring in the world, people can expand their own way of reacting, views of things, interactions)."}],"concepts":[{"term":"Battle for Structure","definition":"Therapist establishes the rules and working atmosphere of treatment. Includes the need for the entire family to be in therapy (a mother and child come in for therapy and there is a question for the initial intervention an experiential therapist would use: the therapist discusses with mom the need to include entire family in therapy would be the correct answer."},{"term":"Battle for Initiative","definition":"Motivation for change must come from family. Includes having a family state the agenda for each session, waiting silently for family to take initiative, allowing family to determine how change is going to happen. The therapist should not be working harder than the family. A family comes in, and nobody is speaking. What would experiential therapist do? The right answer would be the therapist would wait silently for the family to take initiative."},{"term":"Trial of Labor","definition":"Understanding the roles, boundaries, beliefs, history, and levels of conflict within the family. Assessment. Family dynamic."},{"term":"Activating Constructive Anxiety","definition":"Reframing anxiety in the family as efforts toward competence (fear of failing to accomplish what one is capable of). Enhancing motivation, if you identify the positive thing they were afraid wouldn’t happen."},{"term":"Play, Humor, and “Craziness”","definition":"Play, Humor, and “Craziness:” Tapping irrational side. Finding solutions in creative interactions."}],"interventions":[{"term":"Battle for Structure","definition":"Therapist establishes the rules and working atmosphere of treatment. Includes the need for the entire family to be in therapy (a mother and child come in for therapy and there is a question for the initial intervention an experiential therapist would use: the therapist discusses with mom the need to include entire family in therapy would be the correct answer."},{"term":"Battle for Initiative","definition":"Motivation for change must come from family. Includes having a family state the agenda for each session, waiting silently for family to take initiative, allowing family to determine how change is going to happen. The therapist should not be working harder than the family. A family comes in, and nobody is speaking. What would experiential therapist do? The right answer would be the therapist would wait silently for the family to take initiative."},{"term":"Trial of Labor","definition":"Understanding the roles, boundaries, beliefs, history, and levels of conflict within the family. Assessment. Family dynamic."},{"term":"Activating Constructive Anxiety","definition":"Reframing anxiety in the family as efforts toward competence (fear of failing to accomplish what one is capable of). Enhancing motivation, if you identify the positive thing they were afraid wouldn’t happen."},{"term":"Play, Humor, and “Craziness”","definition":"Play, Humor, and “Craziness:” Tapping irrational side. Finding solutions in creative interactions."}],"phases":{"beginning":[{"text":"Beginning: Engage family as authentic people. Battle for structure. Encourage all members to attend. Family wins battle of initiative. Gather information about boundaries, coalitions, roles, and level of conflict."}],"middle":[{"text":"Middle: Develop sense of cohesion. Create alternative interactions. Highlight inappropriate boundaries (highlighting when family member pushes their world view on others for example). Role-play situations. Use play and “craziness.”"}],"end":[{"text":"End: Highlight accomplishments and reflect on growth. Identify possible blocks to future growth. Role-play future scenarios. Each member expresses feelings about their experience of therapy."}]},"examTips":[{"sourceLine":"Battle for Structure: Therapist establishes the rules and working atmosphere of treatment. Includes the need for the entire family to be in therapy (a mother and child come in for therapy and there is a question for the initial intervention an experiential therapist would use: the therapist discusses with mom the need to include entire family in therapy would be the correct answer."},{"sourceLine":"Battle for Initiative: Motivation for change must come from family. Includes having a family state the agenda for each session, waiting silently for family to take initiative, allowing family to determine how change is going to happen. The therapist should not be working harder than the family. A family comes in, and nobody is speaking. What would experiential therapist do? The right answer would be the therapist would wait silently for the family to take initiative."}]},{"id":"cbt","name":"CBT (interventions)","family":["cognitive-behavioral"],"sourceDoc":"CBT interventions notes","changeMechanism":null,"therapistRoles":null,"goals":null,"concepts":[],"interventions":[{"term":"Psychoeducation on the negative triad","definition":"Teach the client about negative triad, done in first session as well as psychoeducation about how CBT works."},{"term":"Socratic Questioning","definition":"Questioning allows the therapist to stimulate the client’s self-awareness, focus on the problem definition, expose the client’s belief system, and challenge irrational beliefs while revealing the client’s cognitive processes. Questions that dive below surface to collect evidence for someone’s thinking. What evidence led you to believe this? Are there alternate ways of thinking about the situation? How did you get to this answer, what is the evidence that led you there?"},{"term":"Reframing","definition":"Thinking differently by “reframing” negative or untrue assumptions and thoughts into ones that promote adaptive behavior and lessen anxiety and depression. A way of thinking differently about certain assumptions that allows people to think about and feel differently and less in their anxiety and depression. “no one likes me. I must be boring or weird” vs “maybe people were shy too or didn't know what to say.\""},{"term":"Cognitive Restructuring","definition":"Teaches the client to identify irrational, distorted, or maladaptive beliefs, question the evidence for the belief, and generate alternative responses. Teach client to identify their beliefs, question their beliefs, and generate alternative responses."},{"term":"Homework","definition":"To assist with cognitive restructuring, clients are often assigned homework. Typical CBT homework assignments may include activities in behavioral activation, monitoring automatic thoughts, reviewing the previous therapy session, and preparing for the next therapy session."},{"term":"Self-Monitoring","definition":"Also called diary work, self-monitoring is used to record the amount and degree of thoughts and behaviors. This provides the client and therapist information regarding the degree of a client’s negative affirmations. Teaching client how to do self-monitoring, thought record."},{"term":"Behavioral Experiments","definition":"The experiment process includes experiencing, observing, reflecting, and planning. These steps are conducted through thought testing, discovery, activity, and/or observation. People can test out their assumptions about certain things. Some behavioral experiments include exposure (e.g., testing a fear by facing it), but the intention differs:"},{"term":"Systematic Desensitization","definition":"Systematic desensitization pairs relaxation with exposure to something stressful. Clients are taught to relax in anxiety producing situations. People taught how to relax, exposed to stressful situation, then exposed and use those techniques can be real life or imagery. A type of Counterconditioning: replacing fear with relaxation. - Create fear hierarchy - Relaxation training - Gradual exposure (in imagination or real life) Systematic Desensitization = “Let’s gradually face your fear, while staying relaxed, until it no longer feels threatening.”"},{"term":"Anxiety Management Training","definition":"Teaches skills for specific situations using imagery. The client practices relaxation until anxiety is reduced then continues with imagery. Uses a lot of imagery and practicing relaxation skills. Teaches general coping skills. - Diaphragmatic breathing - Progressive muscle relaxation - Cognitive reframing - Coping self-statements - Thought-stopping - Self-monitoring of anxiety - Coping self-statements - Problem-solving training Skill acquisition, done early in therapy. Anxiety Management Training = “Learn how to calm your mind and body when anxiety hits — anytime, anywhere.”"},{"term":"Assertiveness Training","definition":"Teaches the client to specify desires and needs using minimally effective responses to assert their position. Used with unassertive or overly aggressive clients. Intervention for both overly aggressive or unassertive people. Express thoughts, feelings, needs, and boundaries in a direct but respectful way, reduce anxiety, guilt, or fear associated with self-expression, challenge maladaptive beliefs (e.g., \"If I say no, they’ll hate me\"), replace passive, aggressive, or passive-aggressive communication styles with assertive behavior. Teaches people to specify their needs, the least they need to do in order to convey their needs and wants, minimally effective responses to assert their position. I-statements being clear about thoughts and desires involves a lot of role-playing with client."},{"term":"Behavioral Activation","definition":"Increases activity for depressed or passive clients by using activity scheduling and incentives. Incentives planned for activities that are difficult for people to accomplish."},{"term":"Communication Skills Training","definition":"Used in couples therapy to help couples talk about feelings and problems. CBT therapist working with couples. Managing conflict. I-statements, assertiveness training, teaching people how to listen, teaching people how to listen and not jump in with problem solving, teaching people how to identify when they are getting overly aroused so that they know when to take time-outs."},{"term":"Downward Arrow","definition":"Used to uncover underlying assumptions. “If this is true, what does it mean about you and your life?” Therapist moved downwards – people didn’t like me at the party. What was the evidence for that? What did that mean to you? I wasn’t important, and what does that mean about yourself? I am worthless. If that’s true, what does that mean about you and your life. Moves down to core belief person has."},{"term":"Exposure","definition":"Client faces fear stimuli without resorting to escape or avoidance maneuvers. Can be done in real life or with imagery"},{"term":"Finding Alternatives","definition":"Clients review all possible options and alternatives for either interpreting a situation or resolving a problem."},{"term":"Labeling Distortions","definition":"Teaches the client to recognize and label particular distortions in thinking that can lead to problems with interpretations of events."},{"term":"Mastery/Pleasure Ratings","definition":"Clients use activity chart and rate mastery or pleasure that they derive from activity. Clients use an activity chart and rate the mastery or pleasure they derive from a particular activity. How good or comfortable they are at the activity; how much pleasure they will get out of that."},{"term":"Opposite Action","definition":"Client is encouraged to engage in behavior that is counterintuitive or opposite to what they may feel at the time (e.g., when feeling very angry, say something kind or decent)."},{"term":"Problem-Solving Training","definition":"Teaches a step approach of orienting to the problem, problem definition, generation of alternatives, decision making and solution implementation, and verification of results. Step by step technique, define the problem they’re experiencing, generate alternatives and options, making decisions about the best solution they want to try, implementing the solution, verifying the results. Not an assumption the solution is always going to work. Ongoing process of trying things out. Part of the process is being able to reflect on the outcome of the implementations of the different solutions."},{"term":"Relaxation Training","definition":"Teaches the client to relax muscles to condition a relaxation response to counter tension. Uses imagery, music, and other stimuli to assist in acquiring response. Initial phase of treatment, including psychoeducation and thought patterns, select this on test. Taking some control over the relaxation of their bodies. For trauma interventions for example."},{"term":"Successive Approximation","definition":"Client and therapist collaborate in developing a plan for the client to engage in steps that approximate an ultimate goal to allow the client to have success at each step along the way to the goal. You want to have clients experience successes along the way. Break down things into smaller goals. IE let’s first learn relaxation techniques, client understands that is initial goal, they’re not expected to deal with the bigger issues first right away."},{"term":"Three-Column Technique","definition":"Client collects automatic thoughts and lists: the situation in which the thought occurred, the automatic thought, and the associated feelings. Initial thing that somebody would do for homework."},{"term":"Thought Record","definition":"Expands on the three-column technique, with columns to record alternative responses to the automatic thought and behavioral or emotional outcomes of changing the thought. Add a column for an alternate response and pay attention to the resulting emotional outcome. Next step of three-column technique."}],"phases":{"beginning":[{"text":"Establish safe and supportive therapeutic relationship"},{"text":"Complete a functional analysis to assess and define the problem and negative thought patterns, where in all their areas of their life are they having problems, explore all areas of life (work, school, relationships, etc)."},{"text":"Educate negative thought triad and explain CBT"},{"text":"Set collaborative goals."},{"text":"Person and therapist can also see where client is already dealing well with issue in one context and figure out how to apply it to other life areas (ie they are assertive at work but not in their relationship, exploring what skills they can transfer)."}],"middle":[{"text":"Identify negative thought patterns"},{"text":"uncover negative schemas"},{"text":"assign homework to self-monitor thoughts, moods, and behaviors"},{"text":"label cognitive distortions"},{"text":"reframe thoughts"},{"text":"learn and practice new skills and behaviors."},{"text":"teaching of skill building and coping"}],"end":[{"text":"Review gains"},{"text":"identify skills learned"},{"text":"rehearse for new situations and anticipate future struggles."}]},"examTips":[{"sourceLine":"Relaxation Training: Teaches the client to relax muscles to condition a relaxation response to counter tension. Uses imagery, music, and other stimuli to assist in acquiring response. Initial phase of treatment, including psychoeducation and thought patterns, select this on test. Taking some control over the relaxation of their bodies. For trauma interventions for example."},{"sourceLine":"If the client is testing a belief (\"People will laugh if I blush in public\") it’s a Behavioral Experiment."},{"sourceLine":"If the client is trying to reduce their fear of blushing itself by repeated exposure it's Exposure Therapy."},{"sourceLine":"Three-Column Technique: Client collects automatic thoughts and lists: the situation in which the thought occurred, the automatic thought, and the associated feelings. Initial thing that somebody would do for homework."},{"sourceLine":"Thought Record: Expands on the three-column technique, with columns to record alternative responses to the automatic thought and behavioral or emotional outcomes of changing the thought. Add a column for an alternate response and pay attention to the resulting emotional outcome. Next step of three-column technique."},{"sourceLine":"Skill acquisition, done early in therapy."},{"sourceLine":"Teach the client about negative triad, done in first session as well as psychoeducation about how CBT works."}]}]};
