const ITEMS    = [{"id":"t1_bowen_phase_middle_1","tier":1,"type":"T1_phase","models":["bowen"],"stem":"In the middle phase of treatment, what would a Bowen Family Systems therapist do?","options":[{"text":"De-triangulation, identifying the triangles, and exploring how that has been something that has been passed down. De-pathologizing the individual and looking at it through a family systems lens.","correct":true,"belongsTo":"bowen"},{"text":"assign ordeals; prescribe the problem; relabel behavior","correct":false,"belongsTo":"strategic"},{"text":"Highlight and modify interactions","correct":false,"belongsTo":"structural"},{"text":"Increase the family’s congruent communication","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"De-triangulation, identifying the triangles, and exploring how that has been something that has been passed down. De-pathologizing the individual and looking at it through a family systems lens."},{"id":"t1_strategic_phase_beginning_0","tier":1,"type":"T1_phase","models":["strategic"],"stem":"In the beginning phase of treatment, what would a Strategic Therapy therapist do?","options":[{"text":"Define the problem","correct":true,"belongsTo":"strategic"},{"text":"Establish rapport, a sense of equality and hope","correct":false,"belongsTo":"satir"},{"text":"reframing of problem to include whole system.","correct":false,"belongsTo":"structural"},{"text":"both accommodate to and challenge rules of family system","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Define the problem"},{"id":"t1_structural_phase_end_1","tier":1,"type":"T1_phase","models":["structural"],"stem":"In the end phase of treatment, what would a Structural Family Therapy therapist do?","options":[{"text":"Help family practice implement and integrate changes and increase awareness of larger familial patterns.","correct":false,"belongsTo":"satir"},{"text":"Plan for maintenance of new behavior","correct":false,"belongsTo":"strategic"},{"text":"reinforce structural change","correct":true,"belongsTo":"structural"},{"text":"emphasize positive changes made.","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"reinforce structural change"},{"id":"t1_satir_phase_beginning_0","tier":1,"type":"T1_phase","models":["satir"],"stem":"In the beginning phase of treatment, what would a Satir Communications Therapy therapist do?","options":[{"text":"assess family’s destructive patterns of relating and communicating the continued problem","correct":false,"belongsTo":"strategic"},{"text":"Establish rapport, a sense of equality and hope","correct":true,"belongsTo":"satir"},{"text":"reframing of problem to include whole system.","correct":false,"belongsTo":"structural"},{"text":"Create a family diagram of multigenerational emotional connections, genogram","correct":false,"belongsTo":"bowen"}],"rationale":"","sourceLine":"Establish rapport, a sense of equality and hope"},{"id":"t1_narrative_phase_middle_0","tier":1,"type":"T1_phase","models":["narrative"],"stem":"In the middle phase of treatment, what would a Narrative Therapy therapist do?","options":[{"text":"identify exceptions to problems","correct":false,"belongsTo":"solution-focused"},{"text":"The problem is externalized","correct":true,"belongsTo":"narrative"},{"text":"utilize solution-talk","correct":false,"belongsTo":"solution-focused"},{"text":"Increase the family’s congruent communication","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"The problem is externalized"},{"id":"t1_solution-focused_phase_beginning_1","tier":1,"type":"T1_phase","models":["solution-focused"],"stem":"In the beginning phase of treatment, what would a Solution-Focused Therapy therapist do?","options":[{"text":"Educate negative thought triad and explain CBT","correct":false,"belongsTo":"cbt"},{"text":"Establish rapport, a sense of equality and hope","correct":false,"belongsTo":"satir"},{"text":"Person and therapist can also see where client is already dealing well with issue in one context and figure out how to apply it to other life areas (ie they are assertive at work but not in their relationship, exploring what skills they can transfer).","correct":false,"belongsTo":"cbt"},{"text":"envision preferred future","correct":true,"belongsTo":"solution-focused"}],"rationale":"","sourceLine":"envision preferred future"},{"id":"t1_object-relations_phase_end_1","tier":1,"type":"T1_phase","models":["object-relations"],"stem":"In the end phase of treatment, what would a Object Relations therapist do?","options":[{"text":"Repair occurs during the late middle phase and the end of treatment.","correct":false,"belongsTo":"attachment"},{"text":"Consolidate interpretations.","correct":true,"belongsTo":"object-relations"},{"text":"Acknowledge and process issues related to termination.","correct":false,"belongsTo":"self-psychology"},{"text":"Reflect on the treatment process","correct":false,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Consolidate interpretations."},{"id":"t1_self-psychology_phase_end_1","tier":1,"type":"T1_phase","models":["self-psychology"],"stem":"In the end phase of treatment, what would a Self Psychology therapist do?","options":[{"text":"Consolidate interpretations.","correct":false,"belongsTo":"object-relations"},{"text":"Repair stage of the therapy aims to alter the patient’s current reactions to the events that cause them emotional distress by sharing their own interpretations of the event. By sharing their own subjective interpretation, the therapist helps create a new reality of the painful events for the patient in order to get rid of unwanted emotions and reactions.","correct":false,"belongsTo":"attachment"},{"text":"Repair occurs during the late middle phase and the end of treatment.","correct":false,"belongsTo":"attachment"},{"text":"Acknowledge and process issues related to termination.","correct":true,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Acknowledge and process issues related to termination."},{"id":"t1_attachment_phase_middle_1","tier":1,"type":"T1_phase","models":["attachment"],"stem":"In the middle phase of treatment, what would a Attachment-Based Therapy (Bowlby) therapist do?","options":[{"text":"Support client’s ability to regulate and express emotions in relationally difficult Situations teaching clients to have a reflective stance toward themselves.","correct":true,"belongsTo":"attachment"},{"text":"Identify and process projective identification (T is aware of feeling so and do about the client, how would object relations therapist handle this situation, look for this term).","correct":false,"belongsTo":"object-relations"},{"text":"Mourning loss of selfobjects Mourning the mother they may have never had. They can grieve these losses. An acceptance of that loss, a sadness that is allowed to happen over it. Cry for their younger selves, inner child.","correct":false,"belongsTo":"self-psychology"},{"text":"Identify alternative self-objects: people they did have had positive relationship with them. Through their relationship with T they learn about different positive selfobjects, and can start to identify healthy selfobjects for themselves.","correct":false,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Support client’s ability to regulate and express emotions in relationally difficult Situations teaching clients to have a reflective stance toward themselves."},{"id":"t1_client-centered_change_fwd","tier":1,"type":"T1_change","models":["client-centered"],"stem":"According to Client Centered Therapy, how does change occur?","options":[{"text":"Views people are always growing and inherently good. Avoids diagnosis, avoid strict adherence to what the ideal person should be. Role of therapist is nondirective, not steering client in any one direction (unlike CBT or systems theory). Driven by what the client wants to talk about. T is a facilitator who is helping the person to grow and change. This occurs by creating unconditional positive regard. Client determines the goals of therapy. Up to the client to decide how many sessions they would like as well, a lot of support for client self-determination.","correct":true,"belongsTo":"client-centered"},{"text":"Change happens through the existential encounter – the authentic meeting of the therapist and the client in the present moment and by expanding the client’s range of experience. Very influenced by Gestalt therapy. Generally used with families, started by Carl Whittaker.","correct":false,"belongsTo":"experiential"},{"text":"Change occurs through finding meaning, living authentically and responsibly. The idea that the person can respond, make choices, emphasizes personal choice about how clients want to live their lives. Core question: how do I exist? Inherent meaninglessness to life and existence.","correct":false,"belongsTo":"existential"},{"text":"The idea is that change occurs through increased awareness of here and now experience and dialogic relationship between T and client. Dialogic refers to a therapeutic stance where the therapist and client engage as two authentic human beings — fully present with each other, co-creating the therapeutic process. Heavily influenced by Martin Buber’s “I-Thou” philosophy, where the therapist meets the client as a fellow human, not an object to be treated.","correct":false,"belongsTo":"gestalt"}],"rationale":"","sourceLine":"Views people are always growing and inherently good. Avoids diagnosis, avoid strict adherence to what the ideal person should be. Role of therapist is nondirective, not steering client in any one direction (unlike CBT or systems theory). Driven by what the client wants to talk about. T is a facilitator who is helping the person to grow and change. This occurs by creating unconditional positive regard. Client determines the goals of therapy. Up to the client to decide how many sessions they would like as well, a lot of support for client self-determination."},{"id":"t1_gestalt_change_inv","tier":1,"type":"T1_change","models":["gestalt"],"stem":"Which model holds that change occurs in this way?\n\n“The idea is that change occurs through increased awareness of here and now experience and dialogic relationship between T and client. Dialogic refers to a therapeutic stance where the therapist and client engage as two authentic human beings — fully present with each other, co-creating the therapeutic process. Heavily influenced by Martin Buber’s “I-Thou” philosophy, where the therapist meets the client as a fellow human, not an object to be treated.”","options":[{"text":"Existential Therapy","correct":false,"belongsTo":"existential"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"},{"text":"Client Centered Therapy","correct":false,"belongsTo":"client-centered"},{"text":"Gestalt Therapy","correct":true,"belongsTo":"gestalt"}],"rationale":"","sourceLine":"The idea is that change occurs through increased awareness of here and now experience and dialogic relationship between T and client. Dialogic refers to a therapeutic stance where the therapist and client engage as two authentic human beings — fully present with each other, co-creating the therapeutic process. Heavily influenced by Martin Buber’s “I-Thou” philosophy, where the therapist meets the client as a fellow human, not an object to be treated."},{"id":"t1_existential_change_inv","tier":1,"type":"T1_change","models":["existential"],"stem":"Which model holds that change occurs in this way?\n\n“Change occurs through finding meaning, living authentically and responsibly. The idea that the person can respond, make choices, emphasizes personal choice about how clients want to live their lives. Core question: how do I exist? Inherent meaninglessness to life and existence.”","options":[{"text":"Client Centered Therapy","correct":false,"belongsTo":"client-centered"},{"text":"Gestalt Therapy","correct":false,"belongsTo":"gestalt"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"},{"text":"Existential Therapy","correct":true,"belongsTo":"existential"}],"rationale":"","sourceLine":"Change occurs through finding meaning, living authentically and responsibly. The idea that the person can respond, make choices, emphasizes personal choice about how clients want to live their lives. Core question: how do I exist? Inherent meaninglessness to life and existence."},{"id":"t1_experiential_phase_beginning_0","tier":1,"type":"T1_phase","models":["experiential"],"stem":"In the beginning phase of treatment, what would a Experiential / Symbolic Therapy (Whitaker) therapist do?","options":[{"text":"Join with family","correct":false,"belongsTo":"structural"},{"text":"Engage family as authentic people. Battle for structure. Encourage all members to attend. Family wins battle of initiative. Gather information about boundaries, coalitions, roles, and level of conflict.","correct":true,"belongsTo":"experiential"},{"text":"both accommodate to and challenge rules of family system","correct":false,"belongsTo":"structural"},{"text":"assessment/mapping of hierarchy alignments, and boundaries","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Beginning: Engage family as authentic people. Battle for structure. Encourage all members to attend. Family wins battle of initiative. Gather information about boundaries, coalitions, roles, and level of conflict."},{"id":"t1_cbt_phase_middle_1","tier":1,"type":"T1_phase","models":["cbt"],"stem":"In the middle phase of treatment, what would a CBT (interventions) therapist do?","options":[{"text":"utilize solution-talk","correct":false,"belongsTo":"solution-focused"},{"text":"uncover negative schemas","correct":true,"belongsTo":"cbt"},{"text":"teach the family how to take responsibility for their feelings and thoughts.","correct":false,"belongsTo":"bowen"},{"text":"Review attempted solutions","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"uncover negative schemas"},{"id":"t1_bowen_phase_end_0","tier":1,"type":"T1_phase","models":["bowen"],"stem":"In the end phase of treatment, what would a Bowen Family Systems therapist do?","options":[{"text":"Review progress made","correct":false,"belongsTo":"structural"},{"text":"Review new skills and knowledge gained in therapy.","correct":true,"belongsTo":"bowen"},{"text":"Plan for maintenance of new behavior","correct":false,"belongsTo":"strategic"},{"text":"emphasize positive changes made.","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Review new skills and knowledge gained in therapy."},{"id":"t1_strategic_phase_middle_0","tier":1,"type":"T1_phase","models":["strategic"],"stem":"In the middle phase of treatment, what would a Strategic Therapy therapist do?","options":[{"text":"De-triangulation, identifying the triangles, and exploring how that has been something that has been passed down. De-pathologizing the individual and looking at it through a family systems lens.","correct":false,"belongsTo":"bowen"},{"text":"Highlight and modify interactions","correct":false,"belongsTo":"structural"},{"text":"Review attempted solutions","correct":true,"belongsTo":"strategic"},{"text":"Increase the family’s congruent communication","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"Review attempted solutions"},{"id":"t1_structural_phase_end_0","tier":1,"type":"T1_phase","models":["structural"],"stem":"In the end phase of treatment, what would a Structural Family Therapy therapist do?","options":[{"text":"Review progress made","correct":true,"belongsTo":"structural"},{"text":"plan for future challenges","correct":false,"belongsTo":"strategic"},{"text":"Plan for maintenance of new behavior","correct":false,"belongsTo":"strategic"},{"text":"Help family practice implement and integrate changes and increase awareness of larger familial patterns.","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"Review progress made"},{"id":"t1_satir_phase_middle_0","tier":1,"type":"T1_phase","models":["satir"],"stem":"In the middle phase of treatment, what would a Satir Communications Therapy therapist do?","options":[{"text":"Increase the family’s congruent communication","correct":true,"belongsTo":"satir"},{"text":"Review attempted solutions","correct":false,"belongsTo":"strategic"},{"text":"assign ordeals; prescribe the problem; relabel behavior","correct":false,"belongsTo":"strategic"},{"text":"utilize enactments of issues to challenge participants and unbalance the system.","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Increase the family’s congruent communication"},{"id":"t1_narrative_phase_beginning_0","tier":1,"type":"T1_phase","models":["narrative"],"stem":"In the beginning phase of treatment, what would a Narrative Therapy therapist do?","options":[{"text":"begin to identify client’s strengths","correct":false,"belongsTo":"solution-focused"},{"text":"come up with achievable goals.","correct":false,"belongsTo":"solution-focused"},{"text":"Identify treatment focus and goals.","correct":false,"belongsTo":"satir"},{"text":"Client is invited to tell their problem-saturated stories.","correct":true,"belongsTo":"narrative"}],"rationale":"","sourceLine":"Beginning: Client is invited to tell their problem-saturated stories."},{"id":"t1_solution-focused_phase_middle_0","tier":1,"type":"T1_phase","models":["solution-focused"],"stem":"In the middle phase of treatment, what would a Solution-Focused Therapy therapist do?","options":[{"text":"The problem is externalized","correct":false,"belongsTo":"narrative"},{"text":"uncover negative schemas","correct":false,"belongsTo":"cbt"},{"text":"Identify negative thought patterns","correct":false,"belongsTo":"cbt"},{"text":"Identify strengths resources, and traits client already has used to deal with problem","correct":true,"belongsTo":"solution-focused"}],"rationale":"","sourceLine":"Identify strengths resources, and traits client already has used to deal with problem"},{"id":"t1_object-relations_phase_end_0","tier":1,"type":"T1_phase","models":["object-relations"],"stem":"In the end phase of treatment, what would a Object Relations therapist do?","options":[{"text":"Repair occurs during the late middle phase and the end of treatment.","correct":false,"belongsTo":"attachment"},{"text":"Acknowledge and process issues related to termination.","correct":false,"belongsTo":"self-psychology"},{"text":"Reflect on the treatment process","correct":false,"belongsTo":"self-psychology"},{"text":"Work through termination and abandonment issues.","correct":true,"belongsTo":"object-relations"}],"rationale":"","sourceLine":"Work through termination and abandonment issues."},{"id":"t1_self-psychology_phase_beginning_0","tier":1,"type":"T1_phase","models":["self-psychology"],"stem":"In the beginning phase of treatment, what would a Self Psychology therapist do?","options":[{"text":"Establish a therapeutic holding environment","correct":true,"belongsTo":"self-psychology"},{"text":"Build rapport and therapeutic alliance through listening","correct":false,"belongsTo":"object-relations"},{"text":"Attunement is the key intervention in the early stage and consists of forging a personal relationship between the therapist and the patient.","correct":false,"belongsTo":"attachment"},{"text":"exploration of client’s experience, empathy, and maintaining neutrality: low self disclosure","correct":false,"belongsTo":"object-relations"}],"rationale":"","sourceLine":"Establish a therapeutic holding environment"},{"id":"t1_attachment_phase_beginning_1","tier":1,"type":"T1_phase","models":["attachment"],"stem":"In the beginning phase of treatment, what would a Attachment-Based Therapy (Bowlby) therapist do?","options":[{"text":"Demonstrate that the therapist is able to provide containment: client is getting emotional, and the T can be a warm open presence without judgement and having client feel they are able to share this information and they will not be rejected. The therapist is able to hear what client is saying without becoming overwhelmed themselves.","correct":false,"belongsTo":"self-psychology"},{"text":"The therapist provides a secure base by reliably demonstrating empathy and care.","correct":true,"belongsTo":"attachment"},{"text":"Provide “experience-near” empathy","correct":false,"belongsTo":"self-psychology"},{"text":"Explore the client's problem and history, including relationship history.","correct":false,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"The therapist provides a secure base by reliably demonstrating empathy and care."},{"id":"t1_client-centered_change_inv","tier":1,"type":"T1_change","models":["client-centered"],"stem":"Which model holds that change occurs in this way?\n\n“Views people are always growing and inherently good. Avoids diagnosis, avoid strict adherence to what the ideal person should be. Role of therapist is nondirective, not steering client in any one direction (unlike CBT or systems theory). Driven by what the client wants to talk about. T is a facilitator who is helping the person to grow and change. This occurs by creating unconditional positive regard. Client determines the goals of therapy. Up to the client to decide how many sessions they would like as well, a lot of support for client self-determination.”","options":[{"text":"Existential Therapy","correct":false,"belongsTo":"existential"},{"text":"Client Centered Therapy","correct":true,"belongsTo":"client-centered"},{"text":"Gestalt Therapy","correct":false,"belongsTo":"gestalt"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"}],"rationale":"","sourceLine":"Views people are always growing and inherently good. Avoids diagnosis, avoid strict adherence to what the ideal person should be. Role of therapist is nondirective, not steering client in any one direction (unlike CBT or systems theory). Driven by what the client wants to talk about. T is a facilitator who is helping the person to grow and change. This occurs by creating unconditional positive regard. Client determines the goals of therapy. Up to the client to decide how many sessions they would like as well, a lot of support for client self-determination."},{"id":"t1_gestalt_change_fwd","tier":1,"type":"T1_change","models":["gestalt"],"stem":"According to Gestalt Therapy, how does change occur?","options":[{"text":"Change occurs through finding meaning, living authentically and responsibly. The idea that the person can respond, make choices, emphasizes personal choice about how clients want to live their lives. Core question: how do I exist? Inherent meaninglessness to life and existence.","correct":false,"belongsTo":"existential"},{"text":"The idea is that change occurs through increased awareness of here and now experience and dialogic relationship between T and client. Dialogic refers to a therapeutic stance where the therapist and client engage as two authentic human beings — fully present with each other, co-creating the therapeutic process. Heavily influenced by Martin Buber’s “I-Thou” philosophy, where the therapist meets the client as a fellow human, not an object to be treated.","correct":true,"belongsTo":"gestalt"},{"text":"Views people are always growing and inherently good. Avoids diagnosis, avoid strict adherence to what the ideal person should be. Role of therapist is nondirective, not steering client in any one direction (unlike CBT or systems theory). Driven by what the client wants to talk about. T is a facilitator who is helping the person to grow and change. This occurs by creating unconditional positive regard. Client determines the goals of therapy. Up to the client to decide how many sessions they would like as well, a lot of support for client self-determination.","correct":false,"belongsTo":"client-centered"},{"text":"Change happens through the existential encounter – the authentic meeting of the therapist and the client in the present moment and by expanding the client’s range of experience. Very influenced by Gestalt therapy. Generally used with families, started by Carl Whittaker.","correct":false,"belongsTo":"experiential"}],"rationale":"","sourceLine":"The idea is that change occurs through increased awareness of here and now experience and dialogic relationship between T and client. Dialogic refers to a therapeutic stance where the therapist and client engage as two authentic human beings — fully present with each other, co-creating the therapeutic process. Heavily influenced by Martin Buber’s “I-Thou” philosophy, where the therapist meets the client as a fellow human, not an object to be treated."},{"id":"t1_existential_change_fwd","tier":1,"type":"T1_change","models":["existential"],"stem":"According to Existential Therapy, how does change occur?","options":[{"text":"Change occurs through finding meaning, living authentically and responsibly. The idea that the person can respond, make choices, emphasizes personal choice about how clients want to live their lives. Core question: how do I exist? Inherent meaninglessness to life and existence.","correct":true,"belongsTo":"existential"},{"text":"The idea is that change occurs through increased awareness of here and now experience and dialogic relationship between T and client. Dialogic refers to a therapeutic stance where the therapist and client engage as two authentic human beings — fully present with each other, co-creating the therapeutic process. Heavily influenced by Martin Buber’s “I-Thou” philosophy, where the therapist meets the client as a fellow human, not an object to be treated.","correct":false,"belongsTo":"gestalt"},{"text":"Change happens through the existential encounter – the authentic meeting of the therapist and the client in the present moment and by expanding the client’s range of experience. Very influenced by Gestalt therapy. Generally used with families, started by Carl Whittaker.","correct":false,"belongsTo":"experiential"},{"text":"Views people are always growing and inherently good. Avoids diagnosis, avoid strict adherence to what the ideal person should be. Role of therapist is nondirective, not steering client in any one direction (unlike CBT or systems theory). Driven by what the client wants to talk about. T is a facilitator who is helping the person to grow and change. This occurs by creating unconditional positive regard. Client determines the goals of therapy. Up to the client to decide how many sessions they would like as well, a lot of support for client self-determination.","correct":false,"belongsTo":"client-centered"}],"rationale":"","sourceLine":"Change occurs through finding meaning, living authentically and responsibly. The idea that the person can respond, make choices, emphasizes personal choice about how clients want to live their lives. Core question: how do I exist? Inherent meaninglessness to life and existence."},{"id":"t1_experiential_phase_end_0","tier":1,"type":"T1_phase","models":["experiential"],"stem":"In the end phase of treatment, what would a Experiential / Symbolic Therapy (Whitaker) therapist do?","options":[{"text":"provide tools for future.","correct":false,"belongsTo":"structural"},{"text":"Help family practice implement and integrate changes and increase awareness of larger familial patterns.","correct":false,"belongsTo":"satir"},{"text":"Highlight accomplishments and reflect on growth. Identify possible blocks to future growth. Role-play future scenarios. Each member expresses feelings about their experience of therapy.","correct":true,"belongsTo":"experiential"},{"text":"reinforce structural change","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"End: Highlight accomplishments and reflect on growth. Identify possible blocks to future growth. Role-play future scenarios. Each member expresses feelings about their experience of therapy."},{"id":"t1_cbt_phase_end_1","tier":1,"type":"T1_phase","models":["cbt"],"stem":"In the end phase of treatment, what would a CBT (interventions) therapist do?","options":[{"text":"Assist the client to identify things they can do to continue the changes they have made identify hurdles or perceived barriers that could get in the way of the changes they made.","correct":false,"belongsTo":"solution-focused"},{"text":"identify skills learned","correct":true,"belongsTo":"cbt"},{"text":"Plan for maintenance of new behavior","correct":false,"belongsTo":"strategic"},{"text":"emphasize positive changes made.","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"identify skills learned"},{"id":"t1_bowen_phase_middle_0","tier":1,"type":"T1_phase","models":["bowen"],"stem":"In the middle phase of treatment, what would a Bowen Family Systems therapist do?","options":[{"text":"Teach and model differentiation through communication skill building, I-statements, teaching differences between thoughts and feelings, as well as differentiate their feelings from other people.","correct":true,"belongsTo":"bowen"},{"text":"Support and strengthen each individual’s sense of uniqueness and self-esteem.","correct":false,"belongsTo":"satir"},{"text":"utilize enactments of issues to challenge participants and unbalance the system.","correct":false,"belongsTo":"structural"},{"text":"Highlight and modify interactions","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Teach and model differentiation through communication skill building, I-statements, teaching differences between thoughts and feelings, as well as differentiate their feelings from other people."},{"id":"t1_strategic_phase_beginning_1","tier":1,"type":"T1_phase","models":["strategic"],"stem":"In the beginning phase of treatment, what would a Strategic Therapy therapist do?","options":[{"text":"Join with family","correct":false,"belongsTo":"structural"},{"text":"determine how the client understands the problem","correct":true,"belongsTo":"strategic"},{"text":"reframing of problem to include whole system.","correct":false,"belongsTo":"structural"},{"text":"Assess communication patterns, stances, and concerns.","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"determine how the client understands the problem"},{"id":"t1_structural_phase_middle_0","tier":1,"type":"T1_phase","models":["structural"],"stem":"In the middle phase of treatment, what would a Structural Family Therapy therapist do?","options":[{"text":"teach the family how to take responsibility for their feelings and thoughts.","correct":false,"belongsTo":"bowen"},{"text":"instruct client to respond to the problem in a new way.","correct":false,"belongsTo":"strategic"},{"text":"Highlight and modify interactions","correct":true,"belongsTo":"structural"},{"text":"assign ordeals; prescribe the problem; relabel behavior","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Highlight and modify interactions"},{"id":"t1_satir_phase_beginning_1","tier":1,"type":"T1_phase","models":["satir"],"stem":"In the beginning phase of treatment, what would a Satir Communications Therapy therapist do?","options":[{"text":"Assess communication patterns, stances, and concerns.","correct":true,"belongsTo":"satir"},{"text":"Define the problem","correct":false,"belongsTo":"strategic"},{"text":"state goals– what behaviors need to change and what would be the signs of change.","correct":false,"belongsTo":"strategic"},{"text":"determine how the client understands the problem","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Assess communication patterns, stances, and concerns."},{"id":"t1_narrative_phase_middle_1","tier":1,"type":"T1_phase","models":["narrative"],"stem":"In the middle phase of treatment, what would a Narrative Therapy therapist do?","options":[{"text":"mapping the influence/effects of the problem","correct":true,"belongsTo":"narrative"},{"text":"Identify strengths resources, and traits client already has used to deal with problem","correct":false,"belongsTo":"solution-focused"},{"text":"catch and highlight small changes","correct":false,"belongsTo":"solution-focused"},{"text":"utilize solution-talk","correct":false,"belongsTo":"solution-focused"}],"rationale":"","sourceLine":"mapping the influence/effects of the problem"},{"id":"t1_solution-focused_phase_end_0","tier":1,"type":"T1_phase","models":["solution-focused"],"stem":"In the end phase of treatment, what would a Solution-Focused Therapy therapist do?","options":[{"text":"Help family practice implement and integrate changes and increase awareness of larger familial patterns.","correct":false,"belongsTo":"satir"},{"text":"document and support new narrative","correct":false,"belongsTo":"narrative"},{"text":"Create written artifacts","correct":false,"belongsTo":"narrative"},{"text":"Assist the client to identify things they can do to continue the changes they have made identify hurdles or perceived barriers that could get in the way of the changes they made.","correct":true,"belongsTo":"solution-focused"}],"rationale":"","sourceLine":"Assist the client to identify things they can do to continue the changes they have made identify hurdles or perceived barriers that could get in the way of the changes they made."},{"id":"t1_object-relations_phase_beginning_0","tier":1,"type":"T1_phase","models":["object-relations"],"stem":"In the beginning phase of treatment, what would a Object Relations therapist do?","options":[{"text":"Establish a holding environment","correct":true,"belongsTo":"object-relations"},{"text":"Attunement is the key intervention in the early stage and consists of forging a personal relationship between the therapist and the patient.","correct":false,"belongsTo":"attachment"},{"text":"Provide “experience-near” empathy","correct":false,"belongsTo":"self-psychology"},{"text":"Collaboratively identifying client’s “attachment style,\" that is, problematic behavioral and emotional patterns, formed in early childhood as attempts to maintain attachment to primary caregivers.","correct":false,"belongsTo":"attachment"}],"rationale":"","sourceLine":"Establish a holding environment"},{"id":"t1_self-psychology_phase_beginning_1","tier":1,"type":"T1_phase","models":["self-psychology"],"stem":"In the beginning phase of treatment, what would a Self Psychology therapist do?","options":[{"text":"exploration of client’s experience, empathy, and maintaining neutrality: low self disclosure","correct":false,"belongsTo":"object-relations"},{"text":"The therapist provides a secure base by reliably demonstrating empathy and care.","correct":false,"belongsTo":"attachment"},{"text":"Demonstrate that the therapist is able to provide containment: client is getting emotional, and the T can be a warm open presence without judgement and having client feel they are able to share this information and they will not be rejected. The therapist is able to hear what client is saying without becoming overwhelmed themselves.","correct":true,"belongsTo":"self-psychology"},{"text":"Build rapport and therapeutic alliance through listening","correct":false,"belongsTo":"object-relations"}],"rationale":"","sourceLine":"Demonstrate that the therapist is able to provide containment: client is getting emotional, and the T can be a warm open presence without judgement and having client feel they are able to share this information and they will not be rejected. The therapist is able to hear what client is saying without becoming overwhelmed themselves."},{"id":"t1_attachment_phase_end_0","tier":1,"type":"T1_phase","models":["attachment"],"stem":"In the end phase of treatment, what would a Attachment-Based Therapy (Bowlby) therapist do?","options":[{"text":"Consolidate interpretations.","correct":false,"belongsTo":"object-relations"},{"text":"Work through termination and abandonment issues.","correct":false,"belongsTo":"object-relations"},{"text":"Review insights gained in therapy.","correct":false,"belongsTo":"object-relations"},{"text":"Repair occurs during the late middle phase and the end of treatment.","correct":true,"belongsTo":"attachment"}],"rationale":"","sourceLine":"Repair occurs during the late middle phase and the end of treatment."},{"id":"t1_gestalt_marker_presentexperiencew","tier":1,"type":"T1_marker","models":["gestalt"],"stem":"“Present experience while discussing the past” is a signature term of which model?","options":[{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"},{"text":"Client Centered Therapy","correct":false,"belongsTo":"client-centered"},{"text":"Gestalt Therapy","correct":true,"belongsTo":"gestalt"},{"text":"Existential Therapy","correct":false,"belongsTo":"existential"}],"rationale":"No other model in the packet claims it.","sourceLine":"Paying to client’s present experience as they’re discussing the past: right now, what are experiencing as you think about that past relationship?"},{"id":"t1_existential_marker_imaginaldeath","tier":1,"type":"T1_marker","models":["existential"],"stem":"“Imaginal death” is a signature term of which model?","options":[{"text":"Existential Therapy","correct":true,"belongsTo":"existential"},{"text":"Gestalt Therapy","correct":false,"belongsTo":"gestalt"},{"text":"Client Centered Therapy","correct":false,"belongsTo":"client-centered"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"}],"rationale":"No other model in the packet claims it.","sourceLine":"“Imaginal death” exercises: Envisioning one's death to reflect on what truly matters. Brings clarity, gratitude, and urgency for authentic living."},{"id":"t1_experiential_phase_middle_0","tier":1,"type":"T1_phase","models":["experiential"],"stem":"In the middle phase of treatment, what would a Experiential / Symbolic Therapy (Whitaker) therapist do?","options":[{"text":"Support and strengthen each individual’s sense of uniqueness and self-esteem.","correct":false,"belongsTo":"satir"},{"text":"Increase the family’s congruent communication","correct":false,"belongsTo":"satir"},{"text":"utilize enactments of issues to challenge participants and unbalance the system.","correct":false,"belongsTo":"structural"},{"text":"Develop sense of cohesion. Create alternative interactions. Highlight inappropriate boundaries (highlighting when family member pushes their world view on others for example). Role-play situations. Use play and “craziness.”","correct":true,"belongsTo":"experiential"}],"rationale":"","sourceLine":"Middle: Develop sense of cohesion. Create alternative interactions. Highlight inappropriate boundaries (highlighting when family member pushes their world view on others for example). Role-play situations. Use play and “craziness.”"},{"id":"t1_cbt_phase_middle_0","tier":1,"type":"T1_phase","models":["cbt"],"stem":"In the middle phase of treatment, what would a CBT (interventions) therapist do?","options":[{"text":"Identify negative thought patterns","correct":true,"belongsTo":"cbt"},{"text":"encourage reunification from cutoff family members","correct":false,"belongsTo":"bowen"},{"text":"teach the family how to take responsibility for their feelings and thoughts.","correct":false,"belongsTo":"bowen"},{"text":"Review attempted solutions","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Identify negative thought patterns"},{"id":"t1_bowen_phase_beginning_0","tier":1,"type":"T1_phase","models":["bowen"],"stem":"In the beginning phase of treatment, what would a Bowen Family Systems therapist do?","options":[{"text":"Create a family diagram of multigenerational emotional connections, genogram","correct":true,"belongsTo":"bowen"},{"text":"Assess communication patterns, stances, and concerns.","correct":false,"belongsTo":"satir"},{"text":"Establish rapport, a sense of equality and hope","correct":false,"belongsTo":"satir"},{"text":"both accommodate to and challenge rules of family system","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Create a family diagram of multigenerational emotional connections, genogram"},{"id":"t1_strategic_phase_end_1","tier":1,"type":"T1_phase","models":["strategic"],"stem":"In the end phase of treatment, what would a Strategic Therapy therapist do?","options":[{"text":"Review new skills and knowledge gained in therapy.","correct":false,"belongsTo":"bowen"},{"text":"Review progress made","correct":false,"belongsTo":"structural"},{"text":"Help family practice implement and integrate changes and increase awareness of larger familial patterns.","correct":false,"belongsTo":"satir"},{"text":"plan for future challenges","correct":true,"belongsTo":"strategic"}],"rationale":"","sourceLine":"plan for future challenges"},{"id":"t1_structural_phase_middle_1","tier":1,"type":"T1_phase","models":["structural"],"stem":"In the middle phase of treatment, what would a Structural Family Therapy therapist do?","options":[{"text":"Teach and model differentiation through communication skill building, I-statements, teaching differences between thoughts and feelings, as well as differentiate their feelings from other people.","correct":false,"belongsTo":"bowen"},{"text":"encourage reunification from cutoff family members","correct":false,"belongsTo":"bowen"},{"text":"instruct client to respond to the problem in a new way.","correct":false,"belongsTo":"strategic"},{"text":"utilize enactments of issues to challenge participants and unbalance the system.","correct":true,"belongsTo":"structural"}],"rationale":"","sourceLine":"utilize enactments of issues to challenge participants and unbalance the system."},{"id":"t1_satir_phase_end_0","tier":1,"type":"T1_phase","models":["satir"],"stem":"In the end phase of treatment, what would a Satir Communications Therapy therapist do?","options":[{"text":"Review new skills and knowledge gained in therapy.","correct":false,"belongsTo":"bowen"},{"text":"provide tools for future.","correct":false,"belongsTo":"structural"},{"text":"Help family practice implement and integrate changes and increase awareness of larger familial patterns.","correct":true,"belongsTo":"satir"},{"text":"Plan for maintenance of new behavior","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Help family practice implement and integrate changes and increase awareness of larger familial patterns."},{"id":"t1_narrative_change_fwd","tier":1,"type":"T1_change","models":["narrative"],"stem":"According to Narrative Therapy, how does change occur?","options":[{"text":"Change occurs through accessing client’s strengths and resources. Emphasizes finding solutions to a problem, not on discovering the cause or origins of the problem.","correct":false,"belongsTo":"solution-focused"},{"text":"Change happens through self-awareness and improved communication. Humanistic approach.","correct":false,"belongsTo":"satir"},{"text":"Views people are always growing and inherently good. Avoids diagnosis, avoid strict adherence to what the ideal person should be. Role of therapist is nondirective, not steering client in any one direction (unlike CBT or systems theory). Driven by what the client wants to talk about. T is a facilitator who is helping the person to grow and change. This occurs by creating unconditional positive regard. Client determines the goals of therapy. Up to the client to decide how many sessions they would like as well, a lot of support for client self-determination.","correct":false,"belongsTo":"client-centered"},{"text":"Change occurs by separating the person from the problem and by creating a new narrative which emphasizes the individual’s competencies and strengths.","correct":true,"belongsTo":"narrative"}],"rationale":"","sourceLine":"Change occurs by separating the person from the problem and by creating a new narrative which emphasizes the individual’s competencies and strengths."},{"id":"t1_solution-focused_phase_middle_1","tier":1,"type":"T1_phase","models":["solution-focused"],"stem":"In the middle phase of treatment, what would a Solution-Focused Therapy therapist do?","options":[{"text":"utilize solution-talk","correct":true,"belongsTo":"solution-focused"},{"text":"Identify negative thought patterns","correct":false,"belongsTo":"cbt"},{"text":"teaching of skill building and coping","correct":false,"belongsTo":"cbt"},{"text":"re-author story","correct":false,"belongsTo":"narrative"}],"rationale":"","sourceLine":"utilize solution-talk"},{"id":"t1_object-relations_phase_middle_0","tier":1,"type":"T1_phase","models":["object-relations"],"stem":"In the middle phase of treatment, what would a Object Relations therapist do?","options":[{"text":"Addressing enactments: situations in the therapy may have played out in the past, or outside in the client’s life. Being able to talk about in session together. “It sounds like what’s going on with your partner is similar to what happened with your father.”","correct":false,"belongsTo":"self-psychology"},{"text":"Empathizing with losses and blows to self.","correct":false,"belongsTo":"self-psychology"},{"text":"Promote insight and growth through interpretation.","correct":true,"belongsTo":"object-relations"},{"text":"Identify alternative self-objects: people they did have had positive relationship with them. Through their relationship with T they learn about different positive selfobjects, and can start to identify healthy selfobjects for themselves.","correct":false,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Promote insight and growth through interpretation."},{"id":"t1_self-psychology_phase_middle_0","tier":1,"type":"T1_phase","models":["self-psychology"],"stem":"In the middle phase of treatment, what would a Self Psychology therapist do?","options":[{"text":"Confront (aka bringing the issues to attention: I notice when I bring this up, you quickly change the subject) resistance and primitive defense mechanisms.","correct":false,"belongsTo":"object-relations"},{"text":"Support client’s ability to regulate and express emotions in relationally difficult Situations teaching clients to have a reflective stance toward themselves.","correct":false,"belongsTo":"attachment"},{"text":"Promote insight and growth through interpretation.","correct":false,"belongsTo":"object-relations"},{"text":"Repair disruptions of the self-object transference","correct":true,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Repair disruptions of the self-object transference"},{"id":"t1_attachment_phase_beginning_0","tier":1,"type":"T1_phase","models":["attachment"],"stem":"In the beginning phase of treatment, what would a Attachment-Based Therapy (Bowlby) therapist do?","options":[{"text":"Explore the client's problem and history, including relationship history.","correct":false,"belongsTo":"self-psychology"},{"text":"Establish a holding environment","correct":false,"belongsTo":"object-relations"},{"text":"Attunement is the key intervention in the early stage and consists of forging a personal relationship between the therapist and the patient.","correct":true,"belongsTo":"attachment"},{"text":"Establish a therapeutic holding environment","correct":false,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Attunement is the key intervention in the early stage and consists of forging a personal relationship between the therapist and the patient."},{"id":"t1_gestalt_marker_experiments","tier":1,"type":"T1_marker","models":["gestalt"],"stem":"“Experiments in Gestalt: T can make suggestions of client trying something new.” is a signature term of which model?","options":[{"text":"Existential Therapy","correct":false,"belongsTo":"existential"},{"text":"Gestalt Therapy","correct":true,"belongsTo":"gestalt"},{"text":"Client Centered Therapy","correct":false,"belongsTo":"client-centered"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"}],"rationale":"No other model in the packet claims it.","sourceLine":"Experiments in Gestalt: T can make suggestions of client trying something new."},{"id":"t1_existential_marker_givensinlife","tier":1,"type":"T1_marker","models":["existential"],"stem":"“Givens in life: death, freedom, meaningless, isolation. Encourages honesty about life’s conditions.” is a signature term of which model?","options":[{"text":"Client Centered Therapy","correct":false,"belongsTo":"client-centered"},{"text":"Existential Therapy","correct":true,"belongsTo":"existential"},{"text":"Gestalt Therapy","correct":false,"belongsTo":"gestalt"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"}],"rationale":"No other model in the packet claims it.","sourceLine":"Givens in life: death, freedom, meaningless, isolation. Encourages honesty about life’s conditions."},{"id":"t1_experiential_change_fwd","tier":1,"type":"T1_change","models":["experiential"],"stem":"According to Experiential / Symbolic Therapy (Whitaker), how does change occur?","options":[{"text":"Change happens through the existential encounter – the authentic meeting of the therapist and the client in the present moment and by expanding the client’s range of experience. Very influenced by Gestalt therapy. Generally used with families, started by Carl Whittaker.","correct":true,"belongsTo":"experiential"},{"text":"Change occurs through restructuring the family’s organization. Very focused on entire organization of the whole family system. Looking at bigger picture of the family interactions.","correct":false,"belongsTo":"structural"},{"text":"The idea is that change occurs through increased awareness of here and now experience and dialogic relationship between T and client. Dialogic refers to a therapeutic stance where the therapist and client engage as two authentic human beings — fully present with each other, co-creating the therapeutic process. Heavily influenced by Martin Buber’s “I-Thou” philosophy, where the therapist meets the client as a fellow human, not an object to be treated.","correct":false,"belongsTo":"gestalt"},{"text":"Change happens through self-awareness and improved communication. Humanistic approach.","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"Change happens through the existential encounter – the authentic meeting of the therapist and the client in the present moment and by expanding the client’s range of experience. Very influenced by Gestalt therapy. Generally used with families, started by Carl Whittaker."},{"id":"t1_cbt_phase_beginning_1","tier":1,"type":"T1_phase","models":["cbt"],"stem":"In the beginning phase of treatment, what would a CBT (interventions) therapist do?","options":[{"text":"identify dysfunctional patterns that have been passed along through the generations.","correct":false,"belongsTo":"bowen"},{"text":"envision preferred future","correct":false,"belongsTo":"solution-focused"},{"text":"determine how the client understands the problem","correct":false,"belongsTo":"strategic"},{"text":"Complete a functional analysis to assess and define the problem and negative thought patterns, where in all their areas of their life are they having problems, explore all areas of life (work, school, relationships, etc).","correct":true,"belongsTo":"cbt"}],"rationale":"","sourceLine":"Complete a functional analysis to assess and define the problem and negative thought patterns, where in all their areas of their life are they having problems, explore all areas of life (work, school, relationships, etc)."},{"id":"t1_bowen_phase_beginning_1","tier":1,"type":"T1_phase","models":["bowen"],"stem":"In the beginning phase of treatment, what would a Bowen Family Systems therapist do?","options":[{"text":"Assess individuals’ levels of differentiation and triangulation","correct":true,"belongsTo":"bowen"},{"text":"assess family’s destructive patterns of relating and communicating the continued problem","correct":false,"belongsTo":"strategic"},{"text":"Define the problem","correct":false,"belongsTo":"strategic"},{"text":"Establish rapport, a sense of equality and hope","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"Assess individuals’ levels of differentiation and triangulation"},{"id":"t1_strategic_phase_middle_1","tier":1,"type":"T1_phase","models":["strategic"],"stem":"In the middle phase of treatment, what would a Strategic Therapy therapist do?","options":[{"text":"assign ordeals; prescribe the problem; relabel behavior","correct":true,"belongsTo":"strategic"},{"text":"Support and strengthen each individual’s sense of uniqueness and self-esteem.","correct":false,"belongsTo":"satir"},{"text":"utilize enactments of issues to challenge participants and unbalance the system.","correct":false,"belongsTo":"structural"},{"text":"Highlight and modify interactions","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"assign ordeals; prescribe the problem; relabel behavior"},{"id":"t1_structural_phase_beginning_1","tier":1,"type":"T1_phase","models":["structural"],"stem":"In the beginning phase of treatment, what would a Structural Family Therapy therapist do?","options":[{"text":"identify dysfunctional patterns that have been passed along through the generations.","correct":false,"belongsTo":"bowen"},{"text":"assess family’s destructive patterns of relating and communicating the continued problem","correct":false,"belongsTo":"strategic"},{"text":"Define the problem","correct":false,"belongsTo":"strategic"},{"text":"both accommodate to and challenge rules of family system","correct":true,"belongsTo":"structural"}],"rationale":"","sourceLine":"both accommodate to and challenge rules of family system"},{"id":"t1_satir_phase_middle_1","tier":1,"type":"T1_phase","models":["satir"],"stem":"In the middle phase of treatment, what would a Satir Communications Therapy therapist do?","options":[{"text":"Support and strengthen each individual’s sense of uniqueness and self-esteem.","correct":true,"belongsTo":"satir"},{"text":"teach the family how to take responsibility for their feelings and thoughts.","correct":false,"belongsTo":"bowen"},{"text":"encourage reunification from cutoff family members","correct":false,"belongsTo":"bowen"},{"text":"utilize enactments of issues to challenge participants and unbalance the system.","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Support and strengthen each individual’s sense of uniqueness and self-esteem."},{"id":"t1_narrative_change_inv","tier":1,"type":"T1_change","models":["narrative"],"stem":"Which model holds that change occurs in this way?\n\n“Change occurs by separating the person from the problem and by creating a new narrative which emphasizes the individual’s competencies and strengths.”","options":[{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"},{"text":"Narrative Therapy","correct":true,"belongsTo":"narrative"},{"text":"Client Centered Therapy","correct":false,"belongsTo":"client-centered"},{"text":"Solution-Focused Therapy","correct":false,"belongsTo":"solution-focused"}],"rationale":"","sourceLine":"Change occurs by separating the person from the problem and by creating a new narrative which emphasizes the individual’s competencies and strengths."},{"id":"t1_solution-focused_marker_formulafirstsessio","tier":1,"type":"T1_marker","models":["solution-focused"],"stem":"“Formula First Session Task (FFST)” is a signature term of which model?","options":[{"text":"Narrative Therapy","correct":false,"belongsTo":"narrative"},{"text":"Solution-Focused Therapy","correct":true,"belongsTo":"solution-focused"},{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"},{"text":"CBT (interventions)","correct":false,"belongsTo":"cbt"}],"rationale":"No other model in the packet claims it.","sourceLine":"Formula First Session Task (FFST) A homework task to observe what’s already working “Between now and our next meeting, observe what happens in your life that you’d like to continue.”"},{"id":"t2_coll_bowen_istatements","tier":2,"type":"T2_collision","models":["bowen","cbt","satir"],"stem":"Bowen Family Systems share the marker “I-statements” with CBT (interventions), Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Bowen Family Systems?","options":[{"text":"Thought Record","correct":false,"belongsTo":"cbt"},{"text":"Assertiveness Training","correct":false,"belongsTo":"cbt"},{"text":"Triangles (Triangulation)","correct":true,"belongsTo":"bowen"},{"text":"Distracter","correct":false,"belongsTo":"satir"}],"rationale":"“I-statements” is claimed by Bowen Family Systems, CBT (interventions), Satir Communications Therapy, so it discriminates nothing. Triangles (Triangulation) is unique to Bowen Family Systems.","sourceLine":"Triangles (Triangulation): A triangle is a three-person relationship system. It is considered the building block or “molecule” of larger emotional systems because a triangle is the smallest stable relationship system. It could be work, or a substance, not just another person."},{"id":"t2_coll_strategic_activedirectivet","tier":2,"type":"T2_collision","models":["strategic","satir","structural"],"stem":"Strategic Therapy share the marker “active / directive therapist” with Satir Communications Therapy, Structural Family Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Strategic Therapy?","options":[{"text":"Transforming Rules","correct":false,"belongsTo":"satir"},{"text":"Positioning","correct":true,"belongsTo":"strategic"},{"text":"Blamer","correct":false,"belongsTo":"satir"},{"text":"Computer","correct":false,"belongsTo":"satir"}],"rationale":"“active / directive therapist” is claimed by Satir Communications Therapy, Strategic Therapy, Structural Family Therapy, so it discriminates nothing. Positioning is unique to Strategic Therapy.","sourceLine":"Positioning: Therapist takes a more exaggerated and extreme view of the problem and the family is obligated to rebel. That leads to them seeing the ways in which they have Competency. (T says your family is completely hopeless w hopes they’d say no its not)"},{"id":"t2_coll_structural_activedirectivet","tier":2,"type":"T2_collision","models":["structural","satir","strategic"],"stem":"Structural Family Therapy share the marker “active / directive therapist” with Satir Communications Therapy, Strategic Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Structural Family Therapy?","options":[{"text":"Joining","correct":true,"belongsTo":"structural"},{"text":"Metaphors and Storytelling","correct":false,"belongsTo":"satir"},{"text":"Restraining","correct":false,"belongsTo":"strategic"},{"text":"Distracter","correct":false,"belongsTo":"satir"}],"rationale":"“active / directive therapist” is claimed by Satir Communications Therapy, Strategic Therapy, Structural Family Therapy, so it discriminates nothing. Joining is unique to Structural Family Therapy.","sourceLine":"Joining: Therapist’s first task; involves blending in with the family, adapting the family’s affect, style, and language."},{"id":"t2_coll_satir_istatements","tier":2,"type":"T2_collision","models":["satir","bowen","cbt"],"stem":"Satir Communications Therapy share the marker “I-statements” with Bowen Family Systems, CBT (interventions), so that marker cannot tell them apart. Which of these IS distinctive of Satir Communications Therapy?","options":[{"text":"Three-Column Technique","correct":false,"belongsTo":"cbt"},{"text":"Metaphors and Storytelling","correct":true,"belongsTo":"satir"},{"text":"Increasing Differentiation","correct":false,"belongsTo":"bowen"},{"text":"Labeling Distortions","correct":false,"belongsTo":"cbt"}],"rationale":"“I-statements” is claimed by Bowen Family Systems, CBT (interventions), Satir Communications Therapy, so it discriminates nothing. Metaphors and Storytelling is unique to Satir Communications Therapy.","sourceLine":"Metaphors and Storytelling: Used to help clients understand their roles."},{"id":"v_narrative_externalize","tier":2,"type":"V_vignette","models":["narrative","solution-focused","satir","client-centered"],"stem":"A therapist asks a series of questions designed to separate the person from the problem, so the client stops experiencing the problem as who they are.\n\nIn Narrative therapy this is:","options":[{"text":"Transforming Rules","correct":false,"belongsTo":"satir"},{"text":"Externalizing the Problem","correct":true,"belongsTo":"narrative"},{"text":"Client Centered Therapy","correct":false,"belongsTo":"client-centered"},{"text":"Exception Questioning","correct":false,"belongsTo":"solution-focused"}],"rationale":"Externalizing the problem: questions designed to separate the person from the problem.","sourceLine":"Externalizing the Problem: This is a type of intervention. The therapist asks questions that are designed to separate the person from the problem."},{"id":"v_sft_miracle","tier":2,"type":"V_vignette","models":["solution-focused","narrative","cbt","existential"],"stem":"A therapist asks: “Imagine that tomorrow morning you wake up and a miracle has happened. What would be different that will tell you a miracle has happened and your problem has been solved?”\n\nThis is:","options":[{"text":"“Imaginal death” exercises","correct":false,"belongsTo":"existential"},{"text":"Unique Outcomes","correct":false,"belongsTo":"narrative"},{"text":"Finding Alternatives","correct":false,"belongsTo":"cbt"},{"text":"Miracle Questioning","correct":true,"belongsTo":"solution-focused"}],"rationale":"The packet's own scripted example of the miracle question.","sourceLine":"Miracle Questioning: The therapist asks the client to envision how the future will be when the problem no longer exists and what their life looks like then. Example: “Imagine that tomorrow morning you wake up and a miracle has happened. What would be different that will tell you a miracle has happened and your problem has been solved?”"},{"id":"e_objrel_look_for_term","tier":2,"type":"T2_examtip","models":["object-relations","self-psychology","attachment","self-psychology"],"stem":"A therapist becomes aware of strong feelings arising in themselves about a client. The packet flags this as an exam cue and names the term to look for.\n\nHow would an Object Relations therapist handle this?","options":[{"text":"Identify and process projective identification","correct":true,"belongsTo":"object-relations"},{"text":"Mirroring","correct":false,"belongsTo":"self-psychology"},{"text":"Attunement","correct":false,"belongsTo":"attachment"},{"text":"Optimal Frustration","correct":false,"belongsTo":"self-psychology"}],"rationale":"The packet says explicitly: T is aware of feeling something about the client, how would an object relations therapist handle this, look for this term.","sourceLine":"Identify and process projective identification (T is aware of feeling so and do about the client, how would object relations therapist handle this situation, look for this term)."},{"id":"v_selfpsych_enactment","tier":2,"type":"V_vignette","models":["self-psychology","object-relations","attachment","object-relations"],"stem":"A therapist says: “It sounds like what's going on with your partner is similar to what happened with your father.”\n\nIn Self Psychology this is:","options":[{"text":"Explore disruptions","correct":false,"belongsTo":"attachment"},{"text":"Confront resistance and primitive defenses","correct":false,"belongsTo":"object-relations"},{"text":"Addressing enactments","correct":true,"belongsTo":"self-psychology"},{"text":"Interpretation","correct":false,"belongsTo":"object-relations"}],"rationale":"The packet gives this exact sentence as its example of addressing enactments: situations that played out in the past or outside, talked about in session.","sourceLine":"Addressing enactments: situations in the therapy may have played out in the past, or outside in the client’s life. Being able to talk about in session together. “It sounds like what’s going on with your partner is similar to what happened with your father.”"},{"id":"e_attachment_exam_focus","tier":2,"type":"T2_examtip","models":["attachment","object-relations","self-psychology","gestalt"],"stem":"The packet gives explicit exam guidance about what an attachment-based therapist focuses on.\n\nOn the exam, an attachment therapist is specifically focused on:","options":[{"text":"How the person attaches in relationships and how they regulate their own emotions, exploring their early caregiver interactions","correct":true,"belongsTo":"attachment"},{"text":"Twinship Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Splitting","correct":false,"belongsTo":"object-relations"},{"text":"Top dog / underdog dialogue","correct":false,"belongsTo":"gestalt"}],"rationale":"Stated verbatim as exam guidance in the packet.","sourceLine":"On the exam, attachment therapist is specifically focused on how that person attaches in their relationships, and how they are able to regulate their own emotions. Explore history of their interactions looked like with their early caregiver."},{"id":"e_cc_no_phases","tier":2,"type":"T2_examtip","models":["client-centered","gestalt","experiential","existential"],"stem":"Client Centered therapy has no clear phases of treatment, and the packet says so. It also warns that the exam may still ask what a Client Centered therapist does in the initial or middle stage.\n\nWhat answer shape is correct there?","options":[{"text":"Empty chair","correct":false,"belongsTo":"gestalt"},{"text":"Unconditional positive regard, empathy, therapist congruence, and promotion of self-acceptance","correct":true,"belongsTo":"client-centered"},{"text":"Battle for Structure","correct":false,"belongsTo":"experiential"},{"text":"“Imaginal death” exercises","correct":false,"belongsTo":"existential"}],"rationale":"The packet defuses this trap directly: there are no phases, but if asked, look for unconditional positive regard, empathy, congruence and promotion of self-acceptance.","sourceLine":"No clear phases of treatment, T does not really have an agenda, due to it going against the concept of client centered. For the exam, you could have a question that asks you for initial or middle stages with client centered approach. Looking for answers that involved unconditional positive regard, client empathy, T express congruence with their reaction to the client, promotion of self-acceptance (the T can give support for self-acceptance ie when client feels shame), and congruence."},{"id":"t2_coll_gestalt_authenticpresenc","tier":2,"type":"T2_collision","models":["gestalt","client-centered","existential","experiential","satir"],"stem":"Gestalt Therapy share the marker “authentic presence” with Client Centered Therapy, Existential Therapy, Experiential / Symbolic Therapy (Whitaker), Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Gestalt Therapy?","options":[{"text":"Computer","correct":false,"belongsTo":"satir"},{"text":"Activating Constructive Anxiety","correct":false,"belongsTo":"experiential"},{"text":"Repeating words or exaggerating gestures","correct":true,"belongsTo":"gestalt"},{"text":"Incongruent Communication","correct":false,"belongsTo":"satir"}],"rationale":"“authentic presence” is claimed by Client Centered Therapy, Existential Therapy, Experiential / Symbolic Therapy (Whitaker), Gestalt Therapy, Satir Communications Therapy, so it discriminates nothing. Repeating words or exaggerating gestures is unique to Gestalt Therapy.","sourceLine":"Repeating words of overexaggerating gestures"},{"id":"t2_coll_existential_takingresponsibi","tier":2,"type":"T2_collision","models":["existential","bowen","satir"],"stem":"Existential Therapy share the marker “taking responsibility” with Bowen Family Systems, Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Existential Therapy?","options":[{"text":"Givens in life","correct":true,"belongsTo":"existential"},{"text":"Computer","correct":false,"belongsTo":"satir"},{"text":"Family Life Chronology","correct":false,"belongsTo":"satir"},{"text":"De-triangulation","correct":false,"belongsTo":"bowen"}],"rationale":"“taking responsibility” is claimed by Bowen Family Systems, Existential Therapy, Satir Communications Therapy, so it discriminates nothing. Givens in life is unique to Existential Therapy.","sourceLine":"Givens in life: death, freedom, meaningless, isolation. Encourages honesty about life’s conditions."},{"id":"v_experiential_whole_family","tier":2,"type":"V_vignette","models":["experiential","structural","gestalt","satir"],"stem":"A mother brings her child to therapy. Both are in the room. The therapist works from Experiential/Symbolic therapy.\n\nWhat is the therapist's initial intervention?","options":[{"text":"Empty chair","correct":false,"belongsTo":"gestalt"},{"text":"Joining","correct":false,"belongsTo":"structural"},{"text":"Family Sculpting","correct":false,"belongsTo":"satir"},{"text":"Discuss with the mother the need to include the entire family in therapy","correct":true,"belongsTo":"experiential"}],"rationale":"The packet states this answer outright: the therapist discusses with mom the need to include the entire family in therapy. That is the Battle for Structure.","sourceLine":"Battle for Structure: Therapist establishes the rules and working atmosphere of treatment. Includes the need for the entire family to be in therapy (a mother and child come in for therapy and there is a question for the initial intervention an experiential therapist would use: the therapist discusses with mom the need to include entire family in therapy would be the correct answer."},{"id":"t2_coll_cbt_istatements","tier":2,"type":"T2_collision","models":["cbt","bowen","satir"],"stem":"CBT (interventions) share the marker “I-statements” with Bowen Family Systems, Satir Communications Therapy, so that marker cannot tell them apart. Which of these IS distinctive of CBT (interventions)?","options":[{"text":"Family Sculpting","correct":false,"belongsTo":"satir"},{"text":"Triangles (Triangulation)","correct":false,"belongsTo":"bowen"},{"text":"Leveler","correct":false,"belongsTo":"satir"},{"text":"Communication Skills Training","correct":true,"belongsTo":"cbt"}],"rationale":"“I-statements” is claimed by Bowen Family Systems, CBT (interventions), Satir Communications Therapy, so it discriminates nothing. Communication Skills Training is unique to CBT (interventions).","sourceLine":"Communication Skills Training: Used in couples therapy to help couples talk about feelings and problems. CBT therapist working with couples. Managing conflict. I-statements, assertiveness training, teaching people how to listen, teaching people how to listen and not jump in with problem solving, teaching people how to identify when they are getting overly aroused so that they know when to take time-outs."},{"id":"e_bowen_three_generations","tier":2,"type":"T2_examtip","models":["bowen","structural","satir","strategic"],"stem":"The packet singles out one model as the only therapy concerned with the past three generations of the family.\n\nWhich model?","options":[{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"},{"text":"Structural Family Therapy","correct":false,"belongsTo":"structural"},{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"},{"text":"Bowen Family Systems","correct":true,"belongsTo":"bowen"}],"rationale":"Stated in the packet as a distinguishing fact: the only therapy that is concerned with the past three generations of the family.","sourceLine":"Change occurs by understanding multigenerational dynamics and increasing differentiation. The only therapy that is concerned with the past three generations of the family. People’s issues are transmitted through the family."},{"id":"t2_coll_strategic_homeworkbetweens","tier":2,"type":"T2_collision","models":["strategic","bowen","cbt","solution-focused"],"stem":"Strategic Therapy share the marker “homework / between-session task” with Bowen Family Systems, CBT (interventions), Solution-Focused Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Strategic Therapy?","options":[{"text":"Prescribing the Symptom","correct":true,"belongsTo":"strategic"},{"text":"Opposite Action","correct":false,"belongsTo":"cbt"},{"text":"Systematic Desensitization","correct":false,"belongsTo":"cbt"},{"text":"Bibliotherapy","correct":false,"belongsTo":"bowen"}],"rationale":"“homework / between-session task” is claimed by Bowen Family Systems, CBT (interventions), Solution-Focused Therapy, Strategic Therapy, so it discriminates nothing. Prescribing the Symptom is unique to Strategic Therapy.","sourceLine":"Prescribing the Symptom: A strategy in which the therapist encourages or instructs the client to engage in or practice the symptom. ie schedule a fight or schedule a worry time."},{"id":"v_structural_chair","tier":2,"type":"V_vignette","models":["structural","bowen","satir","strategic"],"stem":"A son habitually sits in the chair between his two parents. The therapist asks him to move to a chair on the opposite side of the room so he is not caught in the middle.\n\nThis Structural intervention is:","options":[{"text":"De-triangulation","correct":false,"belongsTo":"bowen"},{"text":"Family Sculpting","correct":false,"belongsTo":"satir"},{"text":"Ordeals","correct":false,"belongsTo":"strategic"},{"text":"Boundary Making","correct":true,"belongsTo":"structural"}],"rationale":"The packet gives this exact example under Boundary Making, a special case of enactment in which the therapist defines who is open and closed to whom.","sourceLine":"Boundary Making: Special case of enactment, in which the therapist defines areas of interaction that he rules open to certain members but closed to others. Example: a son is asked to leave his chair (in between his parents) and go to another chair on the opposite side of the room, so that he is not “caught in the middle”"},{"id":"t2_coll_satir_authenticpresenc","tier":2,"type":"T2_collision","models":["satir","client-centered","existential","experiential","gestalt"],"stem":"Satir Communications Therapy share the marker “authentic presence” with Client Centered Therapy, Existential Therapy, Experiential / Symbolic Therapy (Whitaker), Gestalt Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Satir Communications Therapy?","options":[{"text":"Activating Constructive Anxiety","correct":false,"belongsTo":"experiential"},{"text":"Body awareness","correct":false,"belongsTo":"gestalt"},{"text":"Leveler","correct":true,"belongsTo":"satir"},{"text":"Imaginal death","correct":false,"belongsTo":"existential"}],"rationale":"“authentic presence” is claimed by Client Centered Therapy, Existential Therapy, Experiential / Symbolic Therapy (Whitaker), Gestalt Therapy, Satir Communications Therapy, so it discriminates nothing. Leveler is unique to Satir Communications Therapy.","sourceLine":"Leveler: Congruent in their beliefs about self and others."},{"id":"t2_coll_narrative_strengthsandreso","tier":2,"type":"T2_collision","models":["narrative","satir","solution-focused"],"stem":"Narrative Therapy share the marker “strengths and resources” with Satir Communications Therapy, Solution-Focused Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Narrative Therapy?","options":[{"text":"Deconstructive Questions","correct":true,"belongsTo":"narrative"},{"text":"Blamer","correct":false,"belongsTo":"satir"},{"text":"Metaphors and Storytelling","correct":false,"belongsTo":"satir"},{"text":"Styles of Communication","correct":false,"belongsTo":"satir"}],"rationale":"“strengths and resources” is claimed by Narrative Therapy, Satir Communications Therapy, Solution-Focused Therapy, so it discriminates nothing. Deconstructive Questions is unique to Narrative Therapy.","sourceLine":"Deconstructive Questions: This is a type of intervention. Once the problem is externalized, the therapist will ask various questions designed to pull apart or dismantle the client’s problem-saturated stories."},{"id":"v_sft_coping","tier":2,"type":"V_vignette","models":["solution-focused"],"stem":"A client cannot identify any positive change. The therapist asks: “How do you keep going each day even when it feels like there is no hope?”\n\nThis is:","options":[{"text":"Scaling Questions","correct":false,"belongsTo":"solution-focused"},{"text":"Exception Questioning","correct":false,"belongsTo":"solution-focused"},{"text":"Presupposing Change","correct":false,"belongsTo":"solution-focused"},{"text":"Coping Questions","correct":true,"belongsTo":"solution-focused"}],"rationale":"Coping questions illustrate resources the client already has, validating difficulty without undermining their view of reality.","sourceLine":"Coping Questions: If a client has trouble identifying positive change, coping questions are asked by the therapist in order to illustrate resources that the client already has. This can include validating the client’s difficulties while also showing that they are still able to get up in the morning, go to school, etc. This highlights the client’s strengths without undermining their view of reality. These questions are supportive while also challenging the client and shifting the focus away from problem-focused narratives. Example: “How do you keep going each day even when it feels like there is no hope?”"},{"id":"v_objrel_annoyed","tier":2,"type":"V_vignette","models":["object-relations","self-psychology","self-psychology","attachment"],"stem":"During sessions with a particular client, the therapist repeatedly notices that they themselves feel annoyed. On reflection the therapist recognises the annoyance did not originate with them; they have taken on and begun to identify with a feeling the client put onto them.\n\nAn Object Relations therapist would name this:","options":[{"text":"Adversarial Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Mirroring Transference","correct":false,"belongsTo":"self-psychology"},{"text":"Projective Identification","correct":true,"belongsTo":"object-relations"},{"text":"Attunement","correct":false,"belongsTo":"attachment"}],"rationale":"The packet's own example, and it flags this as a term to look for on the exam: the therapist finds themselves feeling annoyed.","sourceLine":"Projective Identification (specific to object relations): Refers to a psychological process in which a person will project a thought or belief that they have onto a second person. Then, in most common definitions of projective identification, there is another action in which the second person is changed by the projection and begins to behave as though they are, in fact, actually characterized by those thoughts or beliefs that have been projected. The client is projecting onto the therapist a feeling of annoyance. What happens is the therapist realizes they feel annoyed. The therapist takes on the feeling themselves, they begin to identify with the feeling, the therapist finds themselves feeling annoyed. That’s the unconscious manipulation of the client putting those feelings onto the therapist. Sexual attraction: Therapist would say it’s really the client having those unconscious feelings towards the therapist."},{"id":"t2_coll_self-psychology_enactment","tier":2,"type":"T2_collision","models":["self-psychology","structural"],"stem":"Self Psychology share the marker “enactment” with Structural Family Therapy, so that marker cannot tell them apart. Which of these IS distinctive of Self Psychology?","options":[{"text":"Disengaged Boundaries","correct":false,"belongsTo":"structural"},{"text":"Family Map","correct":false,"belongsTo":"structural"},{"text":"Unbalancing","correct":false,"belongsTo":"structural"},{"text":"Adversarial
