ity","correct":false,"belongsTo":"satir"},{"text":"Enactment · Mimesis · Joining · Boundary Making","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Opening Cutoff Relationships: Encouraging and supporting clients to re-engage with estranged family members. | Models: Demonstrates new ways to interact and communicate. | Genogram: Create a multigenerational map of family emotional system. | Interacts with Family: Interrupts arguments – open conflict is prohibited as it raises anxiety."},{"id":"g_bowen_inv_0","tier":2,"type":"T2_group","models":["bowen"],"stem":"These are all interventions of which model?\n\nOpening Cutoff Relationships · Models · Genogram · Interacts with Family","options":[{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"},{"text":"Structural Family Therapy","correct":false,"belongsTo":"structural"},{"text":"Bowen Family Systems","correct":true,"belongsTo":"bowen"},{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"Opening Cutoff Relationships: Encouraging and supporting clients to re-engage with estranged family members. | Models: Demonstrates new ways to interact and communicate. | Genogram: Create a multigenerational map of family emotional system. | Interacts with Family: Interrupts arguments – open conflict is prohibited as it raises anxiety."},{"id":"g_strategic_fwd_0","tier":2,"type":"T2_group","models":["strategic"],"stem":"Which of these are Strategic Therapy interventions?","options":[{"text":"Boundary Making · Unbalancing · Reframe · Joining","correct":false,"belongsTo":"structural"},{"text":"Models · Increasing Differentiation · De-triangulation · Bibliotherapy","correct":false,"belongsTo":"bowen"},{"text":"Paradoxical Directives · Positioning · Homework · Ordeals","correct":true,"belongsTo":"strategic"},{"text":"Presupposing Change · Scaling Questions · Miracle Questioning · Coping Questions","correct":false,"belongsTo":"solution-focused"}],"rationale":"","sourceLine":"Paradoxical Directives: Maneuvers that are in apparent contradiction to the goals of therapy, yet are actually designed to achieve them; paradoxical interventions help avoid confrontation with therapist’s instructions; undermines resistance by keeping clients in charge. | Positioning: Therapist takes a more exaggerated and extreme view of the problem and the family is obligated to rebel. That leads to them seeing the ways in which they have Competency. (T says your family is completely hopeless w hopes they’d say no its not) | Homework: Assignments or directives that take place outside of therapy are essential to the therapy having a successful outcome. The underlying goal of the homework is to try to change the way the family dynamics function around the presenting problem that was identified in session. | Ordeals: Particular type of symptom prescription in which clients are encouraged to carry out harmless but unpleasant tasks whenever symptoms occur; example: having to get up and clean the basement every time the client cannot sleep."},{"id":"g_strategic_inv_0","tier":2,"type":"T2_group","models":["strategic"],"stem":"These are all interventions of which model?\n\nParadoxical Directives · Positioning · Homework · Ordeals","options":[{"text":"Solution-Focused Therapy","correct":false,"belongsTo":"solution-focused"},{"text":"Structural Family Therapy","correct":false,"belongsTo":"structural"},{"text":"Strategic Therapy","correct":true,"belongsTo":"strategic"},{"text":"Bowen Family Systems","correct":false,"belongsTo":"bowen"}],"rationale":"","sourceLine":"Paradoxical Directives: Maneuvers that are in apparent contradiction to the goals of therapy, yet are actually designed to achieve them; paradoxical interventions help avoid confrontation with therapist’s instructions; undermines resistance by keeping clients in charge. | Positioning: Therapist takes a more exaggerated and extreme view of the problem and the family is obligated to rebel. That leads to them seeing the ways in which they have Competency. (T says your family is completely hopeless w hopes they’d say no its not) | Homework: Assignments or directives that take place outside of therapy are essential to the therapy having a successful outcome. The underlying goal of the homework is to try to change the way the family dynamics function around the presenting problem that was identified in session. | Ordeals: Particular type of symptom prescription in which clients are encouraged to carry out harmless but unpleasant tasks whenever symptoms occur; example: having to get up and clean the basement every time the client cannot sleep."},{"id":"g_structural_fwd_0","tier":2,"type":"T2_group","models":["structural"],"stem":"Which of these are Structural Family Therapy interventions?","options":[{"text":"Reduce emotional reactivity · Genogram · Opening Cutoff Relationships · Increasing Differentiation","correct":false,"belongsTo":"bowen"},{"text":"Ordeals · Homework · Prescribing the Symptom · Positioning","correct":false,"belongsTo":"strategic"},{"text":"Enactment · Joining · Unbalancing · Mimesis","correct":true,"belongsTo":"structural"},{"text":"Take Responsibility · Metaphors and Storytelling · Family Sculpting · Transforming Rules","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"Enactment: The actualization of transactional patterns under the control of the therapist. It allows the therapist to observe how family members mutually regulate their behaviors, and to determine the place of the problem behavior within the sequence of transactions. | Joining: Therapist’s first task; involves blending in with the family, adapting the family’s affect, style, and language. | Unbalancing: Supporting someone who is in a one-down position, thus changing hierarchical position. | Mimesis: The therapist tracks the family’s style of communication and uses it."},{"id":"g_structural_inv_0","tier":2,"type":"T2_group","models":["structural"],"stem":"These are all interventions of which model?\n\nEnactment · Joining · Unbalancing · Mimesis","options":[{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"},{"text":"Structural Family Therapy","correct":true,"belongsTo":"structural"},{"text":"Bowen Family Systems","correct":false,"belongsTo":"bowen"},{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Enactment: The actualization of transactional patterns under the control of the therapist. It allows the therapist to observe how family members mutually regulate their behaviors, and to determine the place of the problem behavior within the sequence of transactions. | Joining: Therapist’s first task; involves blending in with the family, adapting the family’s affect, style, and language. | Unbalancing: Supporting someone who is in a one-down position, thus changing hierarchical position. | Mimesis: The therapist tracks the family’s style of communication and uses it."},{"id":"g_satir_fwd_0","tier":2,"type":"T2_group","models":["satir"],"stem":"Which of these are Satir Communications Therapy interventions?","options":[{"text":"Play, Humor, and “Craziness” · Activating Constructive Anxiety · Trial of Labor · Battle for Structure","correct":false,"belongsTo":"experiential"},{"text":"Reframing · Reduce emotional reactivity · Bibliotherapy · Increasing Differentiation","correct":false,"belongsTo":"bowen"},{"text":"Family Sculpting · Modeling Communication · Transforming Rules · Family Life Chronology","correct":true,"belongsTo":"satir"},{"text":"Joining · Reframe · Boundary Making · Unbalancing","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Family Sculpting: Put people into a spatial metaphor – a physical representation of family members characterizations. | Modeling Communication: Therapist uses “I” messages; expresses thoughts and feelings directly; avoids statements about what others are thinking or feeling; is honest. | Transforming Rules: Assisting clients to create more functional, less rigid guidelines. | Family Life Chronology: Gathering history as far back as possible. Include: ideology, values, rules, disruptions, moves, and major events. What the family has been through and how those events impact the family. How past events and unresolved issues are carried out presently."},{"id":"g_satir_inv_0","tier":2,"type":"T2_group","models":["satir"],"stem":"These are all interventions of which model?\n\nFamily Sculpting · Modeling Communication · Transforming Rules · Family Life Chronology","options":[{"text":"Satir Communications Therapy","correct":true,"belongsTo":"satir"},{"text":"Structural Family Therapy","correct":false,"belongsTo":"structural"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"},{"text":"Bowen Family Systems","correct":false,"belongsTo":"bowen"}],"rationale":"","sourceLine":"Family Sculpting: Put people into a spatial metaphor – a physical representation of family members characterizations. | Modeling Communication: Therapist uses “I” messages; expresses thoughts and feelings directly; avoids statements about what others are thinking or feeling; is honest. | Transforming Rules: Assisting clients to create more functional, less rigid guidelines. | Family Life Chronology: Gathering history as far back as possible. Include: ideology, values, rules, disruptions, moves, and major events. What the family has been through and how those events impact the family. How past events and unresolved issues are carried out presently."},{"id":"g_narrative_fwd_0","tier":2,"type":"T2_group","models":["narrative"],"stem":"Which of these are Narrative Therapy interventions?","options":[{"text":"Deconstructive Questions · Unique Outcomes · Externalizing the Problem · Re-authoring the story","correct":true,"belongsTo":"narrative"},{"text":"Increasing Differentiation · Teaching “I” Statements · Models · Reframing","correct":false,"belongsTo":"bowen"},{"text":"Miracle Questioning · Affirmations/Compliments · Exception Questioning · Presupposing Change","correct":false,"belongsTo":"solution-focused"},{"text":"Ordeals · Restraining · Paradoxical Directives · Positioning","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Deconstructive Questions: This is a type of intervention. Once the problem is externalized, the therapist will ask various questions designed to pull apart or dismantle the client’s problem-saturated stories. | Unique Outcomes: This is a type of intervention. The therapist asks questions to highlight times in the client’s life when they were able to resist the effects of the problem. This is a prerequisite for re-authoring the client’s story. | Externalizing the Problem: This is a type of intervention. The therapist asks questions that are designed to separate the person from the problem. | Re-authoring the story: Assist client in reauthoring their story"},{"id":"g_narrative_inv_0","tier":2,"type":"T2_group","models":["narrative"],"stem":"These are all interventions of which model?\n\nDeconstructive Questions · Unique Outcomes · Externalizing the Problem · Re-authoring the story","options":[{"text":"Solution-Focused Therapy","correct":false,"belongsTo":"solution-focused"},{"text":"Bowen Family Systems","correct":false,"belongsTo":"bowen"},{"text":"Narrative Therapy","correct":true,"belongsTo":"narrative"},{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Deconstructive Questions: This is a type of intervention. Once the problem is externalized, the therapist will ask various questions designed to pull apart or dismantle the client’s problem-saturated stories. | Unique Outcomes: This is a type of intervention. The therapist asks questions to highlight times in the client’s life when they were able to resist the effects of the problem. This is a prerequisite for re-authoring the client’s story. | Externalizing the Problem: This is a type of intervention. The therapist asks questions that are designed to separate the person from the problem. | Re-authoring the story: Assist client in reauthoring their story"},{"id":"g_solution-focused_fwd_0","tier":2,"type":"T2_group","models":["solution-focused"],"stem":"Which of these are Solution-Focused Therapy interventions?","options":[{"text":"Externalizing the Problem · Deconstructive Questions · Written Artifact · Re-authoring the story","correct":false,"belongsTo":"narrative"},{"text":"Formula First Session Task (FFST) · Miracle Questioning · Coping Questions · Affirmations/Compliments","correct":true,"belongsTo":"solution-focused"},{"text":"Restraining · Paradoxical Directives · Ordeals · Positioning","correct":false,"belongsTo":"strategic"},{"text":"Problem-Solving Training · Relaxation Training · Reframing · Finding Alternatives","correct":false,"belongsTo":"cbt"}],"rationale":"","sourceLine":"Formula First Session Task (FFST): A homework task to observe what’s already working “Between now and our next meeting, observe what happens in your life that you’d like to continue.” | Miracle Questioning: The therapist asks the client to envision how the future will be when the problem no longer exists and what their life looks like then. Example: “Imagine that tomorrow morning you wake up and a miracle has happened. What would be different that will tell you a miracle has happened and your problem has been solved?” | Coping Questions: If a client has trouble identifying positive change, coping questions are asked by the therapist in order to illustrate resources that the client already has. This can include validating the client’s difficulties while also showing that they are still able to get up in the morning, go to school, etc. This highlights the client’s strengths without undermining their view of reality. These questions are supportive while also challenging the client and shifting the focus away from problem-focused narratives. Example: “How do you keep going each day even when it feels like there is no hope?” | Affirmations/Compliments: Regularly acknowledge progress, strengths, and resources. Example: Tell the client, \"I am impressed you are sitting in that chair again after what you just went through.\""},{"id":"g_solution-focused_inv_0","tier":2,"type":"T2_group","models":["solution-focused"],"stem":"These are all interventions of which model?\n\nFormula First Session Task (FFST) · Miracle Questioning · Coping Questions · Affirmations/Compliments","options":[{"text":"Solution-Focused Therapy","correct":true,"belongsTo":"solution-focused"},{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"},{"text":"CBT","correct":false,"belongsTo":"cbt"},{"text":"Narrative Therapy","correct":false,"belongsTo":"narrative"}],"rationale":"","sourceLine":"Formula First Session Task (FFST): A homework task to observe what’s already working “Between now and our next meeting, observe what happens in your life that you’d like to continue.” | Miracle Questioning: The therapist asks the client to envision how the future will be when the problem no longer exists and what their life looks like then. Example: “Imagine that tomorrow morning you wake up and a miracle has happened. What would be different that will tell you a miracle has happened and your problem has been solved?” | Coping Questions: If a client has trouble identifying positive change, coping questions are asked by the therapist in order to illustrate resources that the client already has. This can include validating the client’s difficulties while also showing that they are still able to get up in the morning, go to school, etc. This highlights the client’s strengths without undermining their view of reality. These questions are supportive while also challenging the client and shifting the focus away from problem-focused narratives. Example: “How do you keep going each day even when it feels like there is no hope?” | Affirmations/Compliments: Regularly acknowledge progress, strengths, and resources. Example: Tell the client, \"I am impressed you are sitting in that chair again after what you just went through.\""},{"id":"g_object-relations_fwd_0","tier":2,"type":"T2_group","models":["object-relations"],"stem":"Which of these are Object Relations interventions?","options":[{"text":"Establish a holding environment · Confront resistance and primitive defenses · Interpretation · Identify and process projective identification","correct":true,"belongsTo":"object-relations"},{"text":"Genogram · Reduce emotional reactivity · Bibliotherapy · Interacts with Family","correct":false,"belongsTo":"bowen"},{"text":"Repair disruptions of the self-object transference · Identify alternative self-objects · Mourning loss of selfobjects · Establish a therapeutic holding environment","correct":false,"belongsTo":"self-psychology"},{"text":"Repair · Provide a secure base · Attunement · Explore disruptions","correct":false,"belongsTo":"attachment"}],"rationale":"","sourceLine":"Establish a holding environment: Establish a holding environment | Confront resistance and primitive defenses: Confront (aka bringing the issues to attention: I notice when I bring this up, you quickly change the subject) resistance and primitive defense mechanisms. | Interpretation: Promote insight and growth through interpretation. | Identify and process projective identification: Identify and process projective identification (T is aware of feeling so and do about the client, how would object relations therapist handle this situation, look for this term)."},{"id":"g_object-relations_inv_0","tier":2,"type":"T2_group","models":["object-relations"],"stem":"These are all interventions of which model?\n\nEstablish a holding environment · Confront resistance and primitive defenses · Interpretation · Identify and process projective identification","options":[{"text":"Attachment-Based Therapy (Bowlby)","correct":false,"belongsTo":"attachment"},{"text":"Bowen Family Systems","correct":false,"belongsTo":"bowen"},{"text":"Object Relations","correct":true,"belongsTo":"object-relations"},{"text":"Self Psychology","correct":false,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Establish a holding environment: Establish a holding environment | Confront resistance and primitive defenses: Confront (aka bringing the issues to attention: I notice when I bring this up, you quickly change the subject) resistance and primitive defense mechanisms. | Interpretation: Promote insight and growth through interpretation. | Identify and process projective identification: Identify and process projective identification (T is aware of feeling so and do about the client, how would object relations therapist handle this situation, look for this term)."},{"id":"g_self-psychology_fwd_0","tier":2,"type":"T2_group","models":["self-psychology"],"stem":"Which of these are Self Psychology interventions?","options":[{"text":"Standing up while speaking · Empty chair · Present experience while discussing the past · Repeating statement","correct":false,"belongsTo":"gestalt"},{"text":"Establish a therapeutic holding environment · Identify alternative self-objects · Repair disruptions of the self-object transference · Mourning loss of selfobjects","correct":true,"belongsTo":"self-psychology"},{"text":"Establish a holding environment · Identify and process projective identification · Focus on transference/countertransference · Confront resistance and primitive defenses","correct":false,"belongsTo":"object-relations"},{"text":"Attunement · Repair stage · Provide a secure base · Explore disruptions","correct":false,"belongsTo":"attachment"}],"rationale":"","sourceLine":"Establish a therapeutic holding environment: Establish a therapeutic holding environment | Identify alternative self-objects: Identify alternative self-objects: people they did have had positive relationship with them. Through their relationship with T they learn about different positive selfobjects, and can start to identify healthy selfobjects for themselves. | Repair disruptions of the self-object transference: Repair disruptions of the self-object transference | Mourning loss of selfobjects: Mourning the mother they may have never had. They can grieve these losses. An acceptance of that loss, a sadness that is allowed to happen over it. Cry for their younger selves, inner child."},{"id":"g_self-psychology_inv_0","tier":2,"type":"T2_group","models":["self-psychology"],"stem":"These are all interventions of which model?\n\nEstablish a therapeutic holding environment · Identify alternative self-objects · Repair disruptions of the self-object transference · Mourning loss of selfobjects","options":[{"text":"Self Psychology","correct":true,"belongsTo":"self-psychology"},{"text":"Attachment-Based Therapy (Bowlby)","correct":false,"belongsTo":"attachment"},{"text":"Object Relations","correct":false,"belongsTo":"object-relations"},{"text":"Gestalt Therapy","correct":false,"belongsTo":"gestalt"}],"rationale":"","sourceLine":"Establish a therapeutic holding environment: Establish a therapeutic holding environment | Identify alternative self-objects: Identify alternative self-objects: people they did have had positive relationship with them. Through their relationship with T they learn about different positive selfobjects, and can start to identify healthy selfobjects for themselves. | Repair disruptions of the self-object transference: Repair disruptions of the self-object transference | Mourning loss of selfobjects: Mourning the mother they may have never had. They can grieve these losses. An acceptance of that loss, a sadness that is allowed to happen over it. Cry for their younger selves, inner child."},{"id":"g_attachment_fwd_0","tier":2,"type":"T2_group","models":["attachment"],"stem":"Which of these are Attachment-Based Therapy (Bowlby) interventions?","options":[{"text":"Demonstrate containment · Mourning loss of selfobjects · Repair disruptions of the self-object transference · Mourning ambitions and fantasies","correct":false,"belongsTo":"self-psychology"},{"text":"Transforming Rules · Family Sculpting · Metaphors and Storytelling · Family Life Chronology","correct":false,"belongsTo":"satir"},{"text":"Repair stage · Collaboratively identifying attachment style · Repair · Explore disruptions","correct":true,"belongsTo":"attachment"},{"text":"Establish a holding environment · Interpretation · Identify and process projective identification · Focus on transference/countertransference","correct":false,"belongsTo":"object-relations"}],"rationale":"Only one is Attachment-Based Therapy (Bowlby).","sourceLine":"Repair stage: Repair stage of the therapy aims to alter the patient’s current reactions to the events that cause them emotional distress by sharing their own interpretations of the event. By sharing their own subjective interpretation, the therapist helps create a new reality of the painful events for the patient in order to get rid of unwanted emotions and reactions. | Collaboratively identifying attachment style: Collaboratively identifying client’s “attachment style,\" that is, problematic behavioral and emotional patterns, formed in early childhood as attempts to maintain attachment to primary caregivers. | Repair: Repair occurs during the late middle phase and the end of treatment. | Explore disruptions: Disruptions are explored in the middle phase. Disruptions include those in the early life of the client as well as those in current relationships, including the relationship with the therapist. Where they are having conflicts, where there is pain, disruptions in attunement. Can even apply to what happens in the therapy room, between client and the therapist."},{"id":"g_attachment_inv_0","tier":2,"type":"T2_group","models":["attachment"],"stem":"These are all interventions of which model?\n\nRepair stage · Collaboratively identifying attachment style · Repair · Explore disruptions","options":[{"text":"Self Psychology","correct":false,"belongsTo":"self-psychology"},{"text":"Attachment-Based Therapy (Bowlby)","correct":true,"belongsTo":"attachment"},{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"},{"text":"Object Relations","correct":false,"belongsTo":"object-relations"}],"rationale":"","sourceLine":"Repair stage: Repair stage of the therapy aims to alter the patient’s current reactions to the events that cause them emotional distress by sharing their own interpretations of the event. By sharing their own subjective interpretation, the therapist helps create a new reality of the painful events for the patient in order to get rid of unwanted emotions and reactions. | Collaboratively identifying attachment style: Collaboratively identifying client’s “attachment style,\" that is, problematic behavioral and emotional patterns, formed in early childhood as attempts to maintain attachment to primary caregivers. | Repair: Repair occurs during the late middle phase and the end of treatment. | Explore disruptions: Disruptions are explored in the middle phase. Disruptions include those in the early life of the client as well as those in current relationships, including the relationship with the therapist. Where they are having conflicts, where there is pain, disruptions in attunement. Can even apply to what happens in the therapy room, between client and the therapist."},{"id":"g_gestalt_fwd_0","tier":2,"type":"T2_group","models":["gestalt"],"stem":"Which of these are Gestalt Therapy interventions?","options":[{"text":"Experiments · Present experience while discussing the past · Standing up while speaking · Top dog / underdog dialogue","correct":true,"belongsTo":"gestalt"},{"text":"Transforming Rules · Metaphors and Storytelling · Take Responsibility · Modeling Communication","correct":false,"belongsTo":"satir"},{"text":"Play, Humor, and “Craziness” · Battle for Structure · Battle for Initiative · Trial of Labor","correct":false,"belongsTo":"experiential"},{"text":"Establish a therapeutic holding environment · Provide “experience-near” empathy · Mourning loss of selfobjects · Repair disruptions of the self-object transference","correct":false,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Experiments: Experiments in Gestalt: T can make suggestions of client trying something new. | Present experience while discussing the past: Paying to client’s present experience as they’re discussing the past: right now, what are experiencing as you think about that past relationship? | Standing up while speaking: Somebody stands up while saying something | Top dog / underdog dialogue: Top dog / underdog dialogue"},{"id":"g_gestalt_inv_0","tier":2,"type":"T2_group","models":["gestalt"],"stem":"These are all interventions of which model?\n\nExperiments · Present experience while discussing the past · Standing up while speaking · Top dog / underdog dialogue","options":[{"text":"Self Psychology","correct":false,"belongsTo":"self-psychology"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"},{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"},{"text":"Gestalt Therapy","correct":true,"belongsTo":"gestalt"}],"rationale":"","sourceLine":"Experiments: Experiments in Gestalt: T can make suggestions of client trying something new. | Present experience while discussing the past: Paying to client’s present experience as they’re discussing the past: right now, what are experiencing as you think about that past relationship? | Standing up while speaking: Somebody stands up while saying something | Top dog / underdog dialogue: Top dog / underdog dialogue"},{"id":"g_existential_fwd_0","tier":2,"type":"T2_group","models":["existential"],"stem":"Which of these are Existential Therapy key concepts?","options":[{"text":"Battle for Structure · Trial of Labor · Activating Constructive Anxiety · Play, Humor, and “Craziness”","correct":false,"belongsTo":"experiential"},{"text":"Repeating statement · Standing up while speaking · Present experience while discussing the past · Experiments","correct":false,"belongsTo":"gestalt"},{"text":"Mastering emotional pain · Givens in life · Imaginal death · Focus on moment to moment","correct":true,"belongsTo":"existential"},{"text":"Demonstrate containment · Repair disruptions of the self-object transference · Provide “experience-near” empathy · Identify alternative self-objects","correct":false,"belongsTo":"self-psychology"}],"rationale":"","sourceLine":"Mastering emotional pain: Mastering emotional pain: unique healing activities. Relating to pain as something that you have endured and has shaped who you are, so that the painful experience has meaning and significance. Being able to share your deepest wounds with a present nonjudgemental person – T is there with C in their suffering. | Givens in life: Givens in life: death, freedom, meaningless, isolation. Encourages honesty about life’s conditions. | Imaginal death: “Imaginal death” exercises: Envisioning one's death to reflect on what truly matters. Brings clarity, gratitude, and urgency for authentic living. | Focus on moment to moment: Focus on moment to moment during therapy, process not content."},{"id":"g_existential_inv_0","tier":2,"type":"T2_group","models":["existential"],"stem":"These are all key concepts of which model?\n\nMastering emotional pain · Givens in life · Imaginal death · Focus on moment to moment","options":[{"text":"Gestalt Therapy","correct":false,"belongsTo":"gestalt"},{"text":"Existential Therapy","correct":true,"belongsTo":"existential"},{"text":"Self Psychology","correct":false,"belongsTo":"self-psychology"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"}],"rationale":"","sourceLine":"Mastering emotional pain: Mastering emotional pain: unique healing activities. Relating to pain as something that you have endured and has shaped who you are, so that the painful experience has meaning and significance. Being able to share your deepest wounds with a present nonjudgemental person – T is there with C in their suffering. | Givens in life: Givens in life: death, freedom, meaningless, isolation. Encourages honesty about life’s conditions. | Imaginal death: “Imaginal death” exercises: Envisioning one's death to reflect on what truly matters. Brings clarity, gratitude, and urgency for authentic living. | Focus on moment to moment: Focus on moment to moment during therapy, process not content."},{"id":"g_experiential_fwd_0","tier":2,"type":"T2_group","models":["experiential"],"stem":"Which of these are Experiential / Symbolic Therapy (Whitaker) interventions?","options":[{"text":"Unbalancing · Enactment · Mimesis · Boundary Making","correct":false,"belongsTo":"structural"},{"text":"Standing up while speaking · Repeating words or exaggerating gestures · Empty chair · Experiments","correct":false,"belongsTo":"gestalt"},{"text":"Activating Constructive Anxiety · Battle for Initiative · Battle for Structure · Play, Humor, and “Craziness”","correct":true,"belongsTo":"experiential"},{"text":"Family Sculpting · Transforming Rules · Take Responsibility · Metaphors and Storytelling","correct":false,"belongsTo":"satir"}],"rationale":"Only one is Experiential / Symbolic Therapy (Whitaker).","sourceLine":"Activating Constructive Anxiety: Reframing anxiety in the family as efforts toward competence (fear of failing to accomplish what one is capable of). Enhancing motivation, if you identify the positive thing they were afraid wouldn’t happen. | Battle for Initiative: Motivation for change must come from family. Includes having a family state the agenda for each session, waiting silently for family to take initiative, allowing family to determine how change is going to happen. The therapist should not be working harder than the family. A family comes in, and nobody is speaking. What would experiential therapist do? The right answer would be the therapist would wait silently for the family to take initiative. | Battle for Structure: Therapist establishes the rules and working atmosphere of treatment. Includes the need for the entire family to be in therapy (a mother and child come in for therapy and there is a question for the initial intervention an experiential therapist would use: the therapist discusses with mom the need to include entire family in therapy would be the correct answer. | Play, Humor, and “Craziness”: Play, Humor, and “Craziness:” Tapping irrational side. Finding solutions in creative interactions."},{"id":"g_experiential_inv_0","tier":2,"type":"T2_group","models":["experiential"],"stem":"These are all interventions of which model?\n\nActivating Constructive Anxiety · Battle for Initiative · Battle for Structure · Play, Humor, and “Craziness”","options":[{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"},{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":true,"belongsTo":"experiential"},{"text":"Structural Family Therapy","correct":false,"belongsTo":"structural"},{"text":"Gestalt Therapy","correct":false,"belongsTo":"gestalt"}],"rationale":"","sourceLine":"Activating Constructive Anxiety: Reframing anxiety in the family as efforts toward competence (fear of failing to accomplish what one is capable of). Enhancing motivation, if you identify the positive thing they were afraid wouldn’t happen. | Battle for Initiative: Motivation for change must come from family. Includes having a family state the agenda for each session, waiting silently for family to take initiative, allowing family to determine how change is going to happen. The therapist should not be working harder than the family. A family comes in, and nobody is speaking. What would experiential therapist do? The right answer would be the therapist would wait silently for the family to take initiative. | Battle for Structure: Therapist establishes the rules and working atmosphere of treatment. Includes the need for the entire family to be in therapy (a mother and child come in for therapy and there is a question for the initial intervention an experiential therapist would use: the therapist discusses with mom the need to include entire family in therapy would be the correct answer. | Play, Humor, and “Craziness”: Play, Humor, and “Craziness:” Tapping irrational side. Finding solutions in creative interactions."},{"id":"g_cbt_fwd_0","tier":2,"type":"T2_group","models":["cbt"],"stem":"Which of these are CBT interventions?","options":[{"text":"Formula First Session Task (FFST) · Miracle Questioning · Exception Questioning · Affirmations/Compliments","correct":false,"belongsTo":"solution-focused"},{"text":"Positioning · Prescribing the Symptom · Ordeals · Restraining","correct":false,"belongsTo":"strategic"},{"text":"Systematic Desensitization · Downward Arrow · Socratic Questioning · Anxiety Management Training","correct":true,"belongsTo":"cbt"},{"text":"Deconstructive Questions · Externalizing the Problem · Enlisting a Witness · Unique Outcomes","correct":false,"belongsTo":"narrative"}],"rationale":"","sourceLine":"Systematic Desensitization: Systematic desensitization pairs relaxation with exposure to something stressful. Clients are taught to relax in anxiety producing situations. People taught how to relax, exposed to stressful situation, then exposed and use those techniques can be real life or imagery. A type of Counterconditioning: replacing fear with relaxation. - Create fear hierarchy - Relaxation training - Gradual exposure (in imagination or real life) Systematic Desensitization = “Let’s gradually face your fear, while staying relaxed, until it no longer feels threatening.” | Downward Arrow: Used to uncover underlying assumptions. “If this is true, what does it mean about you and your life?” Therapist moved downwards – people didn’t like me at the party. What was the evidence for that? What did that mean to you? I wasn’t important, and what does that mean about yourself? I am worthless. If that’s true, what does that mean about you and your life. Moves down to core belief person has. | Socratic Questioning: Questioning allows the therapist to stimulate the client’s self-awareness, focus on the problem definition, expose the client’s belief system, and challenge irrational beliefs while revealing the client’s cognitive processes. Questions that dive below surface to collect evidence for someone’s thinking. What evidence led you to believe this? Are there alternate ways of thinking about the situation? How did you get to this answer, what is the evidence that led you there? | Anxiety Management Training: Teaches skills for specific situations using imagery. The client practices relaxation until anxiety is reduced then continues with imagery. Uses a lot of imagery and practicing relaxation skills. Teaches general coping skills. - Diaphragmatic breathing - Progressive muscle relaxation - Cognitive reframing - Coping self-statements - Thought-stopping - Self-monitoring of anxiety - Coping self-statements - Problem-solving training Skill acquisition, done early in therapy. Anxiety Management Training = “Learn how to calm your mind and body when anxiety hits — anytime, anywhere.”"},{"id":"g_cbt_inv_0","tier":2,"type":"T2_group","models":["cbt"],"stem":"These are all interventions of which model?\n\nSystematic Desensitization · Downward Arrow · Socratic Questioning · Anxiety Management Training","options":[{"text":"Narrative Therapy","correct":false,"belongsTo":"narrative"},{"text":"CBT","correct":true,"belongsTo":"cbt"},{"text":"Solution-Focused Therapy","correct":false,"belongsTo":"solution-focused"},{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Systematic Desensitization: Systematic desensitization pairs relaxation with exposure to something stressful. Clients are taught to relax in anxiety producing situations. People taught how to relax, exposed to stressful s stems interventions?","options":[{"text":"Homework · Positioning · Ordeals · Restraining","correct":false,"belongsTo":"strategic"},{"text":"Models · Reframing · Bibliotherapy · Reduce emotional reactivity","correct":true,"belongsTo":"bowen"},{"text":"Enactment · Boundary Making · Mimesis · Reframe","correct":false,"belongsTo":"structural"},{"text":"Modeling Communication · Take Responsibility · Family Sculpting · Metaphors and Storytelling","correct":false,"belongsTo":"satir"}],"rationale":"","sourceLine":"Models: Demonstrates new ways to interact and communicate. | Reframing: The presenting problem as a multigenerational problem that is caused by factors beyond the individual. Reframing issues as multigenerational issue. | Bibliotherapy: Assigning reading material. | Reduce emotional reactivity: Reduce emotional reactivity by having family members talk to the therapist."},{"id":"g_bowen_inv_1","tier":2,"type":"T2_group","models":["bowen"],"stem":"These are all interventions of which model?\n\nModels · Reframing · Bibliotherapy · Reduce emotional reactivity","options":[{"text":"Bowen Family Systems","correct":true,"belongsTo":"bowen"},{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"},{"text":"Structural Family Therapy","correct":false,"belongsTo":"structural"},{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Models: Demonstrates new ways to interact and communicate. | Reframing: The presenting problem as a multigenerational problem that is caused by factors beyond the individual. Reframing issues as multigenerational issue. | Bibliotherapy: Assigning reading material. | Reduce emotional reactivity: Reduce emotional reactivity by having family members talk to the therapist."},{"id":"g_strategic_fwd_1","tier":2,"type":"T2_group","models":["strategic"],"stem":"Which of these are Strategic Therapy interventions?","options":[{"text":"Reframe · Joining · Boundary Making · Enactment","correct":false,"belongsTo":"structural"},{"text":"Coping Questions · Miracle Questioning · Affirmations/Compliments · Exception Questioning","correct":false,"belongsTo":"solution-focused"},{"text":"Increasing Differentiation · De-triangulation · Reduce emotional reactivity · Reframing","correct":false,"belongsTo":"bowen"},{"text":"Prescribing the Symptom · Homework · Restraining · Positioning","correct":true,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Prescribing the Symptom: A strategy in which the therapist encourages or instructs the client to engage in or practice the symptom. ie schedule a fight or schedule a worry time. | Homework: Assignments or directives that take place outside of therapy are essential to the therapy having a successful outcome. The underlying goal of the homework is to try to change the way the family dynamics function around the presenting problem that was identified in session. | Restraining: The therapist will discourage change or changing too quickly in an effort to elicit the desire to change from the client. | Positioning: Therapist takes a more exaggerated and extreme view of the problem and the family is obligated to rebel. That leads to them seeing the ways in which they have Competency. (T says your family is completely hopeless w hopes they’d say no its not)"},{"id":"g_strategic_inv_1","tier":2,"type":"T2_group","models":["strategic"],"stem":"These are all interventions of which model?\n\nPrescribing the Symptom · Homework · Restraining · Positioning","options":[{"text":"Solution-Focused Therapy","correct":false,"belongsTo":"solution-focused"},{"text":"Strategic Therapy","correct":true,"belongsTo":"strategic"},{"text":"Bowen Family Systems","correct":false,"belongsTo":"bowen"},{"text":"Structural Family Therapy","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Prescribing the Symptom: A strategy in which the therapist encourages or instructs the client to engage in or practice the symptom. ie schedule a fight or schedule a worry time. | Homework: Assignments or directives that take place outside of therapy are essential to the therapy having a successful outcome. The underlying goal of the homework is to try to change the way the family dynamics function around the presenting problem that was identified in session. | Restraining: The therapist will discourage change or changing too quickly in an effort to elicit the desire to change from the client. | Positioning: Therapist takes a more exaggerated and extreme view of the problem and the family is obligated to rebel. That leads to them seeing the ways in which they have Competency. (T says your family is completely hopeless w hopes they’d say no its not)"},{"id":"g_structural_fwd_1","tier":2,"type":"T2_group","models":["structural"],"stem":"Which of these are Structural Family Therapy interventions?","options":[{"text":"Bibliotherapy · Interacts with Family · Models · Increasing Differentiation","correct":false,"belongsTo":"bowen"},{"text":"Restraining · Ordeals · Homework · Positioning","correct":false,"belongsTo":"strategic"},{"text":"Metaphors and Storytelling · Family Sculpting · Modeling Communication · Family Life Chronology","correct":false,"belongsTo":"satir"},{"text":"Mimesis · Tracking · Joining · Reframe","correct":true,"belongsTo":"structural"}],"rationale":"","sourceLine":"Mimesis: The therapist tracks the family’s style of communication and uses it. | Tracking: The therapist pays close attention to family members and how they relate to one another during an enactment or spontaneous behavioral sequence, noticing boundaries, coalitions, roles, rules, etc. | Joining: Therapist’s first task; involves blending in with the family, adapting the family’s affect, style, and language. | Reframe: Putting the presenting problem in a perspective that is both different from what the family brings and more workable."},{"id":"g_structural_inv_1","tier":2,"type":"T2_group","models":["structural"],"stem":"These are all interventions of which model?\n\nMimesis · Tracking · Joining · Reframe","options":[{"text":"Satir Communications Therapy","correct":false,"belongsTo":"satir"},{"text":"Bowen Family Systems","correct":false,"belongsTo":"bowen"},{"text":"Structural Family Therapy","correct":true,"belongsTo":"structural"},{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Mimesis: The therapist tracks the family’s style of communication and uses it. | Tracking: The therapist pays close attention to family members and how they relate to one another during an enactment or spontaneous behavioral sequence, noticing boundaries, coalitions, roles, rules, etc. | Joining: Therapist’s first task; involves blending in with the family, adapting the family’s affect, style, and language. | Reframe: Putting the presenting problem in a perspective that is both different from what the family brings and more workable."},{"id":"g_satir_fwd_1","tier":2,"type":"T2_group","models":["satir"],"stem":"Which of these are Satir Communications Therapy interventions?","options":[{"text":"Play, Humor, and “Craziness” · Battle for Initiative · Activating Constructive Anxiety · Trial of Labor","correct":false,"belongsTo":"experiential"},{"text":"Enactment · Reframe · Boundary Making · Tracking","correct":false,"belongsTo":"structural"},{"text":"Metaphors and Storytelling · Transforming Rules · Modeling Communication · Family Sculpting","correct":true,"belongsTo":"satir"},{"text":"Opening Cutoff Relationships · De-triangulation · Genogram · Reduce emotional reactivity","correct":false,"belongsTo":"bowen"}],"rationale":"","sourceLine":"Metaphors and Storytelling: Used to help clients understand their roles. | Transforming Rules: Assisting clients to create more functional, less rigid guidelines. | Modeling Communication: Therapist uses “I” messages; expresses thoughts and feelings directly; avoids statements about what others are thinking or feeling; is honest. | Family Sculpting: Put people into a spatial metaphor – a physical representation of family members characterizations."},{"id":"g_satir_inv_1","tier":2,"type":"T2_group","models":["satir"],"stem":"These are all interventions of which model?\n\nMetaphors and Storytelling · Transforming Rules · Modeling Communication · Family Sculpting","options":[{"text":"Experiential / Symbolic Therapy (Whitaker)","correct":false,"belongsTo":"experiential"},{"text":"Bowen Family Systems","correct":false,"belongsTo":"bowen"},{"text":"Satir Communications Therapy","correct":true,"belongsTo":"satir"},{"text":"Structural Family Therapy","correct":false,"belongsTo":"structural"}],"rationale":"","sourceLine":"Metaphors and Storytelling: Used to help clients understand their roles. | Transforming Rules: Assisting clients to create more functional, less rigid guidelines. | Modeling Communication: Therapist uses “I” messages; expresses thoughts and feelings directly; avoids statements about what others are thinking or feeling; is honest. | Family Sculpting: Put people into a spatial metaphor – a physical representation of family members characterizations."},{"id":"g_narrative_fwd_1","tier":2,"type":"T2_group","models":["narrative"],"stem":"Which of these are Narrative Therapy interventions?","options":[{"text":"Scaling Questions · Formula First Session Task (FFST) · Affirmations/Compliments · Presupposing Change","correct":false,"belongsTo":"solution-focused"},{"text":"Re-authoring the story · Unique Outcomes · Enlisting a Witness · Mapping the Influence","correct":true,"belongsTo":"narrative"},{"text":"Interacts with Family · Reframing · De-triangulation · Reduce emotional reactivity","correct":false,"belongsTo":"bowen"},{"text":"Restraining · Paradoxical Directives · Prescribing the Symptom · Ordeals","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Re-authoring the story: Assist client in reauthoring their story | Unique Outcomes: This is a type of intervention. The therapist asks questions to highlight times in the client’s life when they were able to resist the effects of the problem. This is a prerequisite for re-authoring the client’s story. | Enlisting a Witness: This is a type of intervention. The client invites someone in their life to hear them share the new narrative. This person bears witness to the client’s telling of the new story and becomes an ally to strengthen or thicken this new story. | Mapping the Influence: This is a type of intervention. The therapist asks a series of questions to understand the effects of the problem in the client’s life."},{"id":"g_narrative_inv_1","tier":2,"type":"T2_group","models":["narrative"],"stem":"These are all interventions of which model?\n\nRe-authoring the story · Unique Outcomes · Enlisting a Witness · Mapping the Influence","options":[{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"},{"text":"Bowen Family Systems","correct":false,"belongsTo":"bowen"},{"text":"Solution-Focused Therapy","correct":false,"belongsTo":"solution-focused"},{"text":"Narrative Therapy","correct":true,"belongsTo":"narrative"}],"rationale":"","sourceLine":"Re-authoring the story: Assist client in reauthoring their story | Unique Outcomes: This is a type of intervention. The therapist asks questions to highlight times in the client’s life when they were able to resist the effects of the problem. This is a prerequisite for re-authoring the client’s story. | Enlisting a Witness: This is a type of intervention. The client invites someone in their life to hear them share the new narrative. This person bears witness to the client’s telling of the new story and becomes an ally to strengthen or thicken this new story. | Mapping the Influence: This is a type of intervention. The therapist asks a series of questions to understand the effects of the problem in the client’s life."},{"id":"g_solution-focused_fwd_1","tier":2,"type":"T2_group","models":["solution-focused"],"stem":"Which of these are Solution-Focused Therapy interventions?","options":[{"text":"Thought Record · Behavioral Experiments · Communication Skills Training · Cognitive Restructuring","correct":false,"belongsTo":"cbt"},{"text":"Exception Questioning · Scaling Questions · Affirmations/Compliments · Coping Questions","correct":true,"belongsTo":"solution-focused"},{"text":"Ordeals · Homework · Paradoxical Directives · Positioning","correct":false,"belongsTo":"strategic"},{"text":"Deconstructive Questions · Externalizing the Problem · Mapping the Influence · Unique Outcomes","correct":false,"belongsTo":"narrative"}],"rationale":"","sourceLine":"Exception Questioning: The therapist asks the client to think of a time in their life when the particular problem did not exist and what the client did differently during this time. The goal here is to focus on what has worked in the past to provide the client with a positive perspective. Example: “Tell me about the times when you don’t get angry.” | Scaling Questions: The therapist asks the client to think of a scale ranging from the worst things could be to the best. The client then rates their current position on the scale and is asked to identify how they could move up or down the scale. The client is also encouraged to identify what point on the scale would be good enough or where their “perfect future” is. Example: “You said that things are between a 4 and a 5. What would need to happen so that things were between a 5 and 6?” | Affirmations/Compliments: Regularly acknowledge progress, strengths, and resources. Example: Tell the client, \"I am impressed you are sitting in that chair again after what you just went through.\" | Coping Questions: If a client has trouble identifying positive change, coping questions are asked by the therapist in order to illustrate resources that the client already has. This can include validating the client’s difficulties while also showing that they are still able to get up in the morning, go to school, etc. This highlights the client’s strengths without undermining their view of reality. These questions are supportive while also challenging the client and shifting the focus away from problem-focused narratives. Example: “How do you keep going each day even when it feels like there is no hope?”"},{"id":"g_solution-focused_inv_1","tier":2,"type":"T2_group","models":["solution-focused"],"stem":"These are all interventions of which model?\n\nException Questioning · Scaling Questions · Affirmations/Compliments · Coping Questions","options":[{"text":"CBT","correct":false,"belongsTo":"cbt"},{"text":"Solution-Focused Therapy","correct":true,"belongsTo":"solution-focused"},{"text":"Narrative Therapy","correct":false,"belongsTo":"narrative"},{"text":"Strategic Therapy","correct":false,"belongsTo":"strategic"}],"rationale":"","sourceLine":"Exception Questioning: The therapist asks the client to think of a time in their life when the particular problem did not exist and what the client did differently during this time. The goal here is to focus on what has worked in the past to provide the client with a positive perspective. Example: “Tell me about the times when you don’t get angry.” | Scaling Questions: The therapist asks the client to think of a scale ranging from the worst things could be to the best. The client then rates their current position on the scale and is asked to identify how they could move up or down the scale. The client is also encouraged to identify what point on the scale would be good enough or where their “perfect future” is. Example: “You said that things are between a 4 and a 5. What would need to happen so that things were between a 5 and 6?” | Affirmations/Compliments: Regularly acknowledge progress, strengths, and resources. Example: Tell the client, \"I am impressed you are sitting in that chair again after what you just went through.\" | Coping Questions: If a client has trouble identifying positive change, coping questions are asked by the therapist in order to illus const BUILT    = "2026-09-06";
const EXAM     = "2026-09-15";

const MODELS = THEORIES.models;
const BYID   = Object.fromEntries(MODELS.map(m => [m.id, m]));
const NAME   = id => (BYID[id] ? BYID[id].name : id);

/* ---------- mastery state: localStorage, deliberately ~20 lines ---------- */
const KEY = "lmft.theory.v1";
const today = () => new Date().toISOString().slice(0, 10);
let S = load();
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {concepts:{}, learned:{}}; }
  catch(e){ return {concepts:{}, learned:{}}; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function rec(id){ return S.concepts[id] || (S.concepts[id] = {seen:0, correct:0, correctDates:[], confidentWrong:0}); }
function score(id, right, knew){
  const r = rec(id); r.seen++;
  if (right){ r.correct++; if (!r.correctDates.includes(today())) r.correctDates.push(today()); }
  else if (knew) r.confidentWrong++;
  save();
}
/* retired = 3 correct across 3 distinct calendar days */
const retired = id => (S.concepts[id] ? S.concepts[id].correctDates.length >= 3 : false);
/* a confidently wrong answer is the most dangerous state on the board */
function weight(id){
  const r = S.concepts[id];
  if (!r) return 2;                       // unseen
  if (retired(id)) return 0;
  let w = 1 + r.confidentWrong * 2;       // double weight per confident miss
  if (r.seen && r.correct / r.seen < .5) w += 1;
  return w;
}

/* ---------- queue ---------- */
const SESSION = 20;
const LKEY = "lmft.learnN";
const LEARN_SIZES = [3, 5, 10];
function learnN(){
  try { const v = parseInt(localStorage.getItem(LKEY), 10);
        return LEARN_SIZES.includes(v) ? v : 3; } catch(e){ return 3; }
}
function poolFor(mode, modelId){
  let p = ITEMS.filter(i => weight(i.id) > 0);
  if (mode === "learn" && modelId) p = p.filter(i => i.models[0] === modelId);
  if (mode === "vignette")        p = p.filter(i => i.type === "V_vignette");
  if (mode === "drill")           p = p.filter(i => i.type !== "V_vignette");
  return p;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

/* Never two consecutive items from the same model. Blocked practice feels
   more productive and produces worse discrimination, which is the exact
   failure mode here. */
function interleave(list){
  // Always take from the model with the MOST items left (that isn't the one
  // just served). Taking merely the first different model strands a crowded
  // model's leftovers at the tail and produces a same-model pair there.
  const out = [], pool = list.slice();
  let last = null;
  while (pool.length){
    const count = {};
    pool.forEach(x => count[x.models[0]] = (count[x.models[0]] || 0) + 1);
    let best = null;
    for (const m in count)
      if (m !== last && (best === null || count[m] > count[best])) best = m;
    if (best === null) best = last;            // one model left; unavoidable
    const i = pool.findIndex(x => x.models[0] === best);
    out.push(pool[i]); last = best; pool.splice(i, 1);
  }
  return out;
}
function buildQueue(mode, modelId, n){
  const pool = poolFor(mode, modelId);
  const weighted = [];
  pool.forEach(i => { const w = weight(i.id); for (let k = 0; k < w; k++) weighted.push(i); });
  shuffle(weighted);
  const seen = new Set(), picked = [];
  for (const it of weighted){
    if (seen.has(it.id)) continue;
    seen.add(it.id); picked.push(it);
    if (picked.length >= (n || SESSION)) break;
  }
  // collision items weighted heavy in drill
  if (mode === "drill") picked.sort((a,b) =>
    (b.type === "T2_collision") - (a.type === "T2_collision"));
  return interleave(picked);
}

/* ---------- session ---------- */
let Q = [], qi = 0, mode = "learn", learnModel = null, answered = null;
let stats = {right:0, wrong:0, confidentWrong:0, missed:[]};

const el = document.getElementById("view");
const foot = document.getElementById("foot"), frow = document.getElementById("frow");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function daysLeft(){
  const d = Math.ceil((new Date(EXAM) - new Date(today())) / 864e5);
  return d > 0 ? d + " days to exam" : (d === 0 ? "exam today" : "");
}
document.getElementById("days").textContent = daysLeft();

const TABS = [["learn","Learn"],["drill","Drill"],["vignette","Vignette"],["grid","Grid"],["progress","Progress"]];
function learnedAll(){ return MODELS.every(m => S.learned[m.id]); }
function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(([k,l]) => {
    const lock = (k === "vignette" && !learnedAll());
    return `<button data-tab="${k}" ${lock?"disabled":""} aria-current="${mode===k}">${l}${lock?" 🔒":""}</button>`;
  }).join("");
}
document.getElementById("nav").onclick = e => {
  const b = e.target.closest("button[data-tab]"); if (!b || b.disabled) return;
  go(b.dataset.tab);
};
function go(tab){ mode = tab; learnModel = null; Q = []; qi = 0; renderNav(); render(); }

/* ---------- model state for the dashboard ---------- */
function modelState(id){
  const its = ITEMS.filter(i => i.models[0] === id);
  if (!its.length) return {k:"new", label:"no items"};
  const seen = its.filter(i => S.concepts[i.id]);
  if (!seen.length) return {k:"new", label:"not started"};
  const done = its.filter(i => retired(i.id)).length;
  const cw = seen.reduce((n,i) => n + S.concepts[i.id].confidentWrong, 0);
  if (done === its.length) return {k:"solid", label:"retired"};
  if (cw > 0) return {k:"shaky", label:cw + " confident miss" + (cw>1?"es":"")};
  return {k:"learning", label:done + "/" + its.length + " retired"};
}

/* ---------- views ---------- */
function render(){
  foot.hidden = true;
  document.body.toggleAttribute("data-wide", mode === "grid" || mode === "progress");
  if (mode === "grid")     return renderGrid();
  if (mode === "progress") return renderProgress();
  if (mode === "learn" && !learnModel) return renderLearnPicker();
  if (!Q.length){ Q = buildQueue(mode, learnModel, mode === "learn" ? learnN() : SESSION); qi = 0; stats = {right:0,wrong:0,confidentWrong:0,missed:[]}; }
  // An empty queue means every item here is retired. Falling through to the
  // summary would report "0%" for a session she never had, and "Another"
  // would rebuild the same empty queue forever.
  if (!Q.length) return renderExhausted();
  if (qi >= Q.length) return renderSummary();
  renderItem();
}

function renderExhausted(){
  const what = mode === "learn" && learnModel ? NAME(learnModel)
             : mode === "vignette" ? "the vignettes" : "this set";
  el.innerHTML = `<h2>Nothing left here</h2>
    <div class="card"><p>Every item in ${esc(what)} is retired — three correct on three
    separate days.</p></div>
    <div class="row">
      ${mode === "learn" ? '<button class="btn ghost" id="pick">Another model</button>' : ""}
      <button class="btn" id="toDrill">Drill</button>
      <button class="btn ghost" id="toGrid">The grid</button>
    </div>`;
  const pk = document.getElementById("pick");
  if (pk) pk.onclick = () => { learnModel = null; Q = []; render(); };
  document.getElementById("toDrill").onclick = () => go("drill");
  document.getElementById("toGrid").onclick  = () => go("grid");
}

function renderLearnPicker(){
  el.innerHTML = `<h2>Learn</h2>
    <p class="note">${MODELS.filter(m=>S.learned[m.id]).length} of ${MODELS.length} opened. Questions per model:
      ${LEARN_SIZES.map(n=>`<button class="sz${n===learnN()?" on":""}" data-n="${n}">${n}</button>`).join("")}</p>
    <div class="grid14">${MODELS.map(m => {
      const st = modelState(m.id);
      return `<button class="tile s-${st.k}" data-m="${m.id}">
        <b>${esc(m.name)}</b><span>${S.learned[m.id] ? "✓ " : ""}${st.label}</span></button>`;
    }).join("")}</div>`;
  el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { learnModel = b.dataset.m; renderBrief(); });
  el.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    try { localStorage.setItem(LKEY, b.dataset.n); } catch(e){}
    renderLearnPicker();
  });
}

function factList(arr, empty){
  if (arr === null) return `<p class="null">${empty}</p>`;
  if (!arr || !arr.length) return `<p class="null">${empty}</p>`;
  return `<ul class="kv">${arr.map(f => `<li>${esc(f.text)}</li>`).join("")}</ul>`;
}
function renderBrief(){
  const m = BYID[learnModel];
  const ph = m.phases;
  el.innerHTML = `
    <span class="tag">${esc(m.family.join(" · "))} · ${esc(m.sourceDoc)}</span>
    <h2>${esc(m.name)}</h2>
    <div class="card">
      <h3>Theory of change</h3>
      ${m.changeMechanism ? `<p>${esc(m.changeMechanism.text)}</p>`
        : `<p class="null">Your packet has no theory of change for this model. It is an intervention catalogue. Nothing has been invented to fill the gap.</p>`}
      <h3>Therapist role</h3>
      ${factList(m.therapistRoles, "Your packet lists no therapist role section for this model.")}
      <h3>Goals</h3>
      ${factList(m.goals, "Your packet lists no treatment goals section for this model.")}
      <h3>Signature interventions</h3>
      <ul class="kv">${m.interventions.slice(0,8).map(c => `<li><b>${esc(c.term)}</b> — ${esc(c.definition.slice(0,190))}</li>`).join("") || '<li class="null">none listed</li>'}</ul>
      <h3>Phases of treatment</h3>
      ${ph === null
        ? `<div class="banner warn">Your packet says this model has <b>no clear phases of treatment</b> — and warns the exam may still ask about the initial or middle stage anyway. Look for unconditional positive regard, empathy, therapist congruence and promotion of self-acceptance.</div>`
        : ["beginning","middle","end"].map(k => `<p><b>${k}.</b> ${esc((ph[k]||[]).map(f=>f.text).join(" "))||"—"}</p>`).join("")}
      ${m.examTips.length ? `<h3>Flagged for the exam</h3>${m.examTips.map(t=>`<div class="src"><b>from your packet</b>${esc(t.sourceLine)}</div>`).join("")}` : ""}
    </div>
    <div class="row"><button class="btn" id="start">Answer ${learnN()} question${learnN()===1?"":"s"} on this</button>
    <button class="btn ghost" id="back">All models</button></div>`;
  document.getElementById("back").onclick = () => { learnModel = null; render(); };
  document.getElementById("start").onclick = () => {
    S.learned[learnModel] = today(); save(); renderNav();
    Q = buildQueue("learn", learnModel, learnN()); qi = 0;
    stats = {right:0,wrong:0,confidentWrong:0,missed:[]}; render();
  };
}

function renderItem(){
  const it = Q[qi]; answered = null;
  el.innerHTML = `
    <div class="bar"><i style="width:${(qi/Q.length)*100}%"></i></div>
    <div class="note">${qi+1} of ${Q.length}${mode!=="learn"?" · "+esc(NAME(it.models[0])):""}</div>
    <div class="card">
      <span class="tag">${esc(it.type.replace(/^[TV]\d?_/,"").replace("_"," "))}</span>
      <div class="stem">${esc(it.stem)}</div>
      <div id="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.text)}</button>`).join("")}</div>
      <div id="reveal"></div>
    </div>`;
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    // dragging across the text to select it should not count as answering
    const sel = window.getSelection && window.getSelection();
    if (sel && sel.toString().trim() && b.contains(sel.anchorNode)) return;
    choose(it, +b.dataset.i);
  });
}

function choose(it, i){
  if (answered !== null) return;
  answered = i;
  const right = it.options[i].correct;
  right ? stats.right++ : stats.wrong++;
  el.querySelectorAll(".opt").forEach((b,j) => {
    b.classList.add("done");
    if (it.options[j].correct) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
  });
  const chosen = it.options[i];
  document.getElementById("reveal").innerHTML = `
    ${it.rationale ? `<p>${esc(it.rationale)}</p>` : ""}
    ${!right && chosen.belongsTo !== it.models[0]
      ? `<p class="note">What you picked belongs to <b>${esc(NAME(chosen.belongsTo))}</b>.</p>` : ""}
    <div class="src"><b>verbatim from your packet</b>${esc(it.sourceLine)}</div>
    <p class="note" style="margin-top:12px"><button class="reopen" id="flag">Flag this question</button></p>`;
  document.getElementById("flag").onclick = () => feedback({
    label: "This question (" + it.id + ") will be attached so Tannen can find it.",
    detail: "item: " + it.id + "\nmodel: " + NAME(it.models[0])
          + "\nstem: " + it.stem.replace(/\s+/g, " ").slice(0, 240)
          + "\nkeyed answer: " + it.options.filter(o => o.correct)[0].text.slice(0, 120)
          + "\nshe answered: " + chosen.text.slice(0, 120) + (right ? " (correct)" : " (wrong)")
  });
  foot.hidden = false;
  frow.innerHTML = `<button class="btn ghost" data-k="0">Guessed</button>
    <button class="btn" data-k="1">Knew it</button>`;
  frow.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const knew = b.dataset.k === "1";
    if (!right && knew) stats.confidentWrong++;
    score(it.id, right, knew);
    // A miss is collected for an opt-in retry at the end, not spliced back
    // into the live queue: growing the denominator mid-session moves the
    // goalposts, and re-asking two items later tests memory of an answer read
    // ten seconds ago. The return that matters is the next calendar day, and
    // that is handled by the mastery state.
    if (!right) stats.missed.push(it);
    qi++; foot.hidden = true; render();
  });
}

function renderSummary(){
  const n = stats.right + stats.wrong;
  const acc = n ? Math.round(stats.right / n * 100) : 0;
  let msg = "";
  if (acc > 90) msg = `<div class="banner ok"><b>${acc}%.</b> Too easy — try Drill, or a model you have not opened.</div>`;
  else if (acc < 70) msg = `<div class="banner warn"><b>${acc}%.</b> Questions from different models are mixed together on purpose, which always scores lower than one model at a time. Aim for 70–80%.</div>`;
  else msg = `<div class="banner ok"><b>${acc}%.</b> Right where you want to be.</div>`;
  el.innerHTML = `<h2>Session done</h2>${msg}
    <div class="card"><ul class="kv">
      <li><b>${stats.right}</b> right, <b>${stats.wrong}</b> wrong</li>
      <li><b>${stats.confidentWrong}</b> confidently wrong ${stats.confidentWrong ? "— back twice as often" : ""}</li>
      <li>${MODELS.filter(m=>S.learned[m.id]).length} of ${MODELS.length} models opened in Learn</li>
    </ul></div>
    <div class="row">
      ${stats.missed.length ? `<button class="btn" id="retry">Retry the ${stats.missed.length} you missed</button>` : ""}
      <button class="btn${stats.missed.length?" ghost":""}" id="again">Another ${mode==="learn"?learnN():SESSION}</button>
      <button class="btn ghost" id="toGrid">See the grid</button>
      ${mode==="learn"?'<button class="btn ghost" id="pick">Another model</button>':""}
    </div>`;
  document.getElementById("again").onclick = () => { Q = []; render(); };
  const rt = document.getElementById("retry");
  if (rt) rt.onclick = () => {
    Q = interleave(stats.missed.slice()); qi = 0;
    stats = {right:0,wrong:0,confidentWrong:0,missed:[]};
    render();
  };
  document.getElementById("toGrid").onclick = () => go("grid");
  const p = document.getElementById("pick"); if (p) p.onclick = () => { learnModel = null; Q = []; render(); };
}

function renderProgress(){
  el.innerHTML = `<h2>Progress</h2>
    <p class="note">Theory is one domain of the LMCE. Green here is not ready for the exam.</p>
    <div class="grid14">${MODELS.map(m=>{
      const st = modelState(m.id);
      return `<div class="tile s-${st.k}"><b>${esc(m.name)}</b><span>${st.label}</span></div>`;
    }).join("")}</div>
    <h3>What the colours mean</h3>
    <ul class="kv note">
      <li><b>grey</b> not started</li>
      <li><b>amber</b> in progress</li>
      <li><b>red</b> you have answered confidently and been wrong here — the dangerous state</li>
      <li><b>green</b> every item retired: 3 correct on 3 different days</li>
    </ul>
    <div class="row"><button class="btn ghost" id="reset">Reset all progress</button>
    <button class="reopen" id="renote">Read the note again</button>
    <button class="reopen" id="fbopen">Send feedback</button></div>`;
  document.getElementById("renote").onclick = () => welcome();
  document.getElementById("fbopen").onclick = () => feedback(null);
  document.getElementById("reset").onclick = () => {
    if (confirm("Erase all progress on this device?")){ S = {concepts:{}, learned:{}}; save(); renderNav(); render(); }
  };
}

/* ---------- the grid: 14 models x 6 columns, one page ---------- */
const COLS = ["Change mechanism","Therapist role","Interventions","Beginning","Middle","End"];
function cell(m, c){
  // Every cell shows everything the packet has for that model. The old version
  // showed only the FIRST entry of each list -- and "signature intervention"
  // was not a curated pick, it was just interventions[0], whichever the packet
  // happened to list first. Since the bank now drills whole sets of
  // techniques, the grid has to show whole sets too.
  const all = a => (a && a.length ? a.map(x => x.text).join(" · ") : null);
  switch(c){
    case 0: return m.changeMechanism ? m.changeMechanism.text : null;
    case 1: return m.therapistRoles === null ? null : all(m.therapistRoles);
    case 2: return m.interventions.length
      ? m.interventions.map(x => x.term).join(" · ") : null;
    default: {
      if (m.phases === null) return null;
      const k = ["beginning","middle","end"][c-3];
      return all(m.phases[k]);
    }
  }
}
function renderGrid(){
  el.innerHTML = `<h2>The grid</h2>
    <p class="note">A blank cell is blank in your packet.</p>
    <div class="card scroll"><table class="grid"><thead><tr><th>Model</th>${COLS.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${MODELS.map(m=>`<tr><td>${esc(m.name)}</td>${COLS.map((_,i)=>{
      const v = cell(m,i);
      return `<td>${v === null ? '<span class="null">not in packet</span>' : esc(v)}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="note">Built ${esc(BUILT)} from your five packets.</p>`;
}

/* ---------- theme ----------
   Three states, not two. "Auto" is the default so the app follows her Mac's
   own light/dark schedule; the other two are explicit overrides that win in
   both directions. */
const TKEY = "lmft.theme";
const THEMES = [
  {v:"auto",  label:"◐ Auto"},
  {v:"light", label:"☀ Light"},
  {v:"dark",  label:"☾ Dark"},
];
function applyTheme(v){
  const root = document.documentElement;
  if (v === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", v);
  const btn = document.getElementById("theme");
  if (btn) btn.textContent = (THEMES.find(t => t.v === v) || THEMES[0]).label;
  // keep the iOS/macOS browser chrome in step with the page
  const dark = v === "dark" || (v === "auto" &&
    window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0f1319" : "#f6f7f9");
}
function readTheme(){
  try { return localStorage.getItem(TKEY) || "auto"; } catch(e){ return "auto"; }
}
function initTheme(){
  applyTheme(readTheme());
  const btn = document.getElementById("theme");
  if (btn) btn.onclick = () => {
    const i = THEMES.findIndex(t => t.v === readTheme());
    const next = THEMES[(i + 1) % THEMES.length].v;
    try { localStorage.setItem(TKEY, next); } catch(e){}
    applyTheme(next);
  };
  // while on Auto, follow the OS if it flips mid-session
  if (window.matchMedia){
    const mq = window.matchMedia("(prefers-color-scheme:dark)");
    const onFlip = () => { if (readTheme() === "auto") applyTheme("auto"); };
    if (mq.addEventListener) mq.addEventListener("change", onFlip);
    else if (mq.addListener) mq.addListener(onFlip);
  }
}

/* ---------- feedback ----------
   Static site, so there is no backend to POST to. mailto is the only route
   that works with no signup and no third party. The address is assembled at
   runtime rather than sitting in the HTML, so scrapers of this public repo
   do not get a plain-text address. */
function fbAddr(){ return ["tannen",".","skriver","@","gmail",".","com"].join(""); }
function feedback(prefill){
  const d = document.createElement("div");
  d.className = "overlay";
  d.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Send feedback">
    <h2>Send feedback</h2>
    <p class="lede">Goes to Tannen. If a question looks wrong, say so — the
    packet wins over this app, and a bad item is worth catching.</p>
    <textarea id="fbtext" rows="7" placeholder="What happened?"
      style="width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);
      background:var(--bg);color:var(--ink);font:inherit;resize:vertical"></textarea>
    ${prefill ? `<div class="src"><b>attached automatically</b>${esc(prefill.label)}</div>` : ""}
    <div class="row" style="margin-top:14px">
      <button class="btn" id="fbsend">Open email</button>
      <button class="btn ghost" id="fbcopy">Copy instead</button>
      <button class="btn ghost" id="fbclose">Cancel</button>
    </div>
    <p class="byline" id="fbnote">“Open email” opens your mail app with it ready to send.
    If nothing opens, use Copy instead and paste it into a text.</p>
  </div>`;
  document.body.appendChild(d);
  const ta = d.querySelector("#fbtext");
  ta.focus();
  const compose = () => {
    let b = ta.value.trim() || "(no message)";
    if (prefill) b += "\n\n---\n" + prefill.detail;
    b += "\n\nbuild " + BUILT;
    return b;
  };
  d.querySelector("#fbclose").onclick = () => d.remove();
  d.querySelector("#fbsend").onclick = () => {
    window.location.href = "mailto:" + fbAddr()
      + "?subject=" + encodeURIComponent("LMFT tool feedback")
      + "&body=" + encodeURIComponent(compose());
  };
  d.querySelector("#fbcopy").onclick = () => {
    const t = compose() + "\n\n(send to " + fbAddr() + ")";
    const done = () => d.querySelector("#fbnote").textContent =
      "Copied. Paste it into a text or email to Tannen.";
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, done);
    else { ta.value = t; ta.select(); try{document.execCommand("copy");}catch(e){} done(); }
  };
}

// Only the storage read is guarded. Retrying welcome() inside a catch would
// throw twice if welcome() itself were the thing that failed.

try { seenWelcome = !!localStorage.getItem(WKEY); } catch(e){}
if (!seenWelcome && document.body) welcome();
