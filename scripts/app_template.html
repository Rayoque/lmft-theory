<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f1f5fa">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%278%27%20fill%3D%27%232f5c8f%27%2F%3E%3Cpath%20d%3D%27M16%2010.5%20L10%2021%20M16%2010.5%20L22%2021%20M10%2021%20L22%2021%27%20stroke%3D%27%23eaf2fb%27%20stroke-width%3D%271.9%27%20stroke-linecap%3D%27round%27%20fill%3D%27none%27%2F%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2710.5%27%20r%3D%273.6%27%20fill%3D%27%23eaf2fb%27%2F%3E%3Ccircle%20cx%3D%2710%27%20cy%3D%2721%27%20r%3D%273.6%27%20fill%3D%27%23eaf2fb%27%2F%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2721%27%20r%3D%273.6%27%20fill%3D%27%23eaf2fb%27%2F%3E%3C%2Fsvg%3E">
<title>LMFT Theory</title>
<style>
:root{
  --bg:#f1f5fa; --card:#fdfeff; --ink:#13253d; --dim:#5f7085; --line:#d9e3ef;
  --accent:#2f5c8f; --accent-ink:#fff; --ok:#2f7355; --okbg:#e4f1e9;
  --bad:#9e4740; --badbg:#f8e8e5; --warn:#8a5a00; --warnbg:#fdf3e0;
  --src:#e9f0f8; --radius:16px; --wrap:760px;
  --prog:#8a6a3a; --shbg:#f7f0e4;
  --sh:0 1px 2px rgba(19,37,61,.06), 0 8px 20px rgba(19,37,61,.06);
}
/* Dark tokens live in a named block so both the system preference and an
   explicit choice can pull from the same place. The media query is guarded so
   choosing Light beats a dark OS; the [data-theme] rule after it means
   choosing Dark beats a light OS. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1521; --card:#142030; --ink:#e4edf8; --dim:#8ea0b6; --line:#213145;
    --accent:#86b6e8; --accent-ink:#0c1521; --ok:#79c79b; --okbg:#14271d;
    --bad:#e0968e; --badbg:#2b1b18; --warn:#f0c274; --warnbg:#33280f;
    --src:#0f1926; --prog:#d0a86c; --shbg:#241d12;
    --sh:0 6px 18px rgba(0,0,0,.30);
  }
}
:root[data-theme="dark"]{
    --bg:#0c1521; --card:#142030; --ink:#e4edf8; --dim:#8ea0b6; --line:#213145;
  --accent:#86b6e8; --accent-ink:#0c1521; --ok:#79c79b; --okbg:#14271d;
  --bad:#e0968e; --badbg:#2b1b18; --warn:#f0c274; --warnbg:#33280f;
  --src:#0f1926; --prog:#d0a86c; --shbg:#241d12;
  --sh:0 6px 18px rgba(0,0,0,.30);
}
.theme{margin-left:10px;background:none;border:1px solid var(--line);
  color:var(--dim);font:inherit;font-size:12px;line-height:1;cursor:pointer;
  padding:6px 9px;border-radius:999px;white-space:nowrap}
.theme:hover{color:var(--ink);border-color:var(--dim)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:var(--wrap);margin:0 auto;padding:12px 14px 24px}
/* Reading views keep a short measure; Compare and the dashboard get the window.
   Header, nav and content share one knob so they never fall out of line. */
body[data-wide] .wrap,body[data-wide] .hrow,body[data-wide] nav,body[data-wide] .frow{--wrap:1500px}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
h2{font:600 21px/1.25 Georgia,'Iowan Old Style','Times New Roman',serif;
  margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:18px 0 7px}
p{margin:0 0 10px}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-top));
  padding-top:calc(10px + env(safe-area-inset-top));
}
.hrow{max-width:var(--wrap);margin:0 auto;display:flex;align-items:center;gap:10px}
.days{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
nav{max-width:var(--wrap);margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{
  flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--dim);
  padding:7px 13px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
}
nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav button:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
button.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--card);color:var(--ink);
  user-select:text;-webkit-user-select:text;
  border:1px solid var(--line);border-radius:calc(var(--radius) - 4px);
  padding:12px 14px;margin-bottom:9px;font:inherit;cursor:pointer;line-height:1.45;
  box-shadow:var(--sh);
}
button.opt .ch{
  flex:0 0 auto;width:21px;height:21px;margin-top:1px;border-radius:50%;
  border:1px solid var(--line);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--dim);user-select:none;
}
button.opt .ot{flex:1;min-width:0}
button.opt .mk{flex:0 0 auto;font-size:14px;font-weight:700;line-height:1.3;user-select:none}
button.opt.correct .ch{border-color:var(--ok);color:var(--ok)}
button.opt.correct .mk{color:var(--ok)}
button.opt.wrong .ch{border-color:var(--bad);color:var(--bad)}
button.opt.wrong .mk{color:var(--bad)}
button.opt:active{transform:scale(.995)}
button.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.opt.correct{border-color:var(--ok);background:var(--okbg)}
button.opt.wrong{border-color:var(--bad);background:var(--badbg)}
button.opt.done{cursor:default}
.btn{
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;
  padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:9px;flex-wrap:wrap}
.stem{font:600 17px/1.5 Georgia,'Iowan Old Style','Times New Roman',serif;
  white-space:pre-wrap;margin-bottom:14px}
.tag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;margin-bottom:10px;
}
.src{
  background:var(--src);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:14px;line-height:1.55;color:var(--ink);margin-top:10px;
}
.src b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:5px;font-weight:700}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 2px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.grid14{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.tile{
  background:var(--card);border:1px solid var(--line);border-left-width:4px;
  border-radius:13px;padding:11px 12px;cursor:pointer;text-align:left;font:inherit;
  color:var(--ink);box-shadow:var(--sh);
}
.tile b{display:block;font-size:14.5px;line-height:1.3;margin-bottom:4px}
.tile span{font-size:12px;color:var(--dim)}
.tile{border-left-width:6px}
/* the card keeps the ordinary surface; the state is carried by the edge, the
   dot and the label, which is enough and does not turn the dashboard into a
   patchwork */
.s-new{border-left-color:var(--line)}
.s-learning{border-left-color:var(--prog)}
.s-shaky{border-left-color:var(--bad)}
.s-solid{border-left-color:var(--ok)}
.s-today{border-left-color:var(--accent)}
.tile .st{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;
  letter-spacing:.005em}
.tile .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--line)}
.s-new .st{color:var(--dim)}
.s-learning .dot{background:var(--prog)} .s-learning .st{color:var(--prog)}
.s-shaky .dot{background:var(--bad)}     .s-shaky .st{color:var(--bad)}
.s-solid .dot{background:var(--ok)}      .s-solid .st{color:var(--ok)}
.s-today .dot{background:var(--accent)}  .s-today .st{color:var(--accent)}
.tile .nums{display:flex;align-items:center;gap:7px;font-size:11.5px;
  color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.key{display:flex;align-items:flex-start;gap:8px;flex:1 1 210px;
  background:var(--card);border:1px solid var(--line);border-left-width:6px;
  border-radius:11px;padding:9px 11px}
.key i{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.key.s-new{border-left-color:var(--line)}
.key.s-learning{border-left-color:var(--prog)}
.key.s-learning .dot{background:var(--prog)}
.key b{color:var(--ink)}
.key b{display:block;font-size:12.5px;font-weight:700}
.key span{font-size:11.5px;color:var(--dim);line-height:1.45}
.note{font-size:13.5px;color:var(--dim);line-height:1.55}
.banner{border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.55;margin-bottom:12px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.bad{background:var(--badbg);color:var(--bad)}
table.grid{border-collapse:collapse;font-size:11.5px;width:100%;table-layout:fixed}
table.grid th,table.grid td{border:1px solid var(--line);padding:6px 7px;vertical-align:top;text-align:left}
table.grid th{background:var(--src);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
table.grid td:first-child,table.grid th:first-child{font-weight:700;width:11%}
table.grid td{line-height:1.5}
table.grid td:first-child{white-space:normal}
/* one entry per line, in the table and in the phone accordion */
ul.cl{margin:0;padding:0;list-style:none}
ul.cl li{position:relative;padding-left:11px;margin-bottom:5px}
ul.cl li:last-child{margin-bottom:0}
ul.cl li::before{content:"";position:absolute;left:1px;top:.62em;
  width:3px;height:3px;border-radius:50%;background:var(--dim)}
ul.cl.one li{padding-left:0}
ul.cl.one li::before{display:none}
.mf ul.cl li{padding-left:14px;margin-bottom:8px}
.mf ul.cl li::before{left:3px;width:4px;height:4px;top:.6em}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---- Compare: the picker ---- */
.cmpbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 6px}
.cmpbar select{
  font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%;
  cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
                   linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;
}
.cmpbar select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cmpbar .pr{display:inline-flex;align-items:center;gap:8px;flex:1 1 190px;min-width:0}
.cmpbar select{flex:1 1 auto;min-width:0}
.cmpbar .vs{flex:0 0 auto;font-size:12px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.07em}
.cmpopt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0 14px}

/* ---- Compare: the columns ---- */
.sbs{margin-top:2px}
.sbshead{
  position:sticky;top:var(--hh,64px);z-index:6;background:var(--bg);
  padding:7px 0 6px;border-bottom:1px solid var(--line);margin-bottom:2px;
}
.sbsrow,.sbshead{display:grid;gap:10px;
  grid-template-columns:repeat(var(--n,2),minmax(0,1fr))}
.sbsname{font:700 14px/1.25 Georgia,'Iowan Old Style',serif;color:var(--ink);
  overflow-wrap:anywhere}
.sbssec{margin:16px 0 0}
.sbssec>h3{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);margin:0 0 7px}
.sbscol{font-size:13.5px;line-height:1.5;overflow-wrap:anywhere;min-width:0}
.sbscol .cl li{margin-bottom:6px}
.sbscol .null{font-size:12.5px}
.sbscol .hid{margin:6px 0 0;font-size:11.5px;color:var(--dim)}
/* What both models claim, on one row. The row is the explanation. */
.agrp{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin:0 0 5px}
.arow+.agrp{margin-top:13px}
.arow{background:var(--shbg);border-left:3px solid var(--prog);
  border-radius:0 8px 8px 0;padding:7px 10px;margin-bottom:5px}
.acells{display:grid;gap:10px;
  grid-template-columns:repeat(var(--n,2),minmax(0,1fr))}
.acells>div{font-size:13.5px;line-height:1.45;overflow-wrap:anywhere;min-width:0}
.acells>div:empty::before{content:"\2014";color:var(--dim);opacity:.5}
.achip{display:block;font-size:9.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--prog);margin-bottom:4px}
.sbs.hi .sbscol li::before{background:var(--accent)}
@media (max-width:760px){
  /* one dropdown per line; stacked, they do not need "vs" and "and" spelling
     the relationship out at the cost of a line each */
  .cmpbar .pr{flex:1 1 100%}
  .cmpbar .vs{display:none}
  .sbsrow,.sbshead{gap:8px}
  .sbscol{font-size:12.5px}
  .sbsname{font-size:12.5px}
  .acells>div{font-size:12.5px}
  /* three columns will not fit a phone; let that one case scroll sideways
     rather than squeezing every model into forty characters a line */
  .sbs.n3 .sbsrow,.sbs.n3 .sbshead,
  .sbs.n3 .acells{grid-template-columns:repeat(3,150px)}
  .sbs.n3 .arow{width:max-content;min-width:100%}
  .sbs.n3{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sbs.n3 .sbshead{position:static}
}
/* one layout per screen width; the table is unreadable on a phone */
.gwide{display:block}
.gnarrow{display:none}
@media (max-width:760px){
  .gwide{display:none}
  .gnarrow{display:block}
}
.mrow{background:var(--card);border:1px solid var(--line);border-radius:13px;
  margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
.mrow>summary{
  cursor:pointer;padding:13px 15px;font:600 15.5px/1.35 Georgia,'Iowan Old Style',serif;
  display:flex;align-items:center;gap:9px;list-style:none;
}
.mrow>summary::-webkit-details-marker{display:none}
.mrow>summary::after{
  content:"";margin-left:auto;width:8px;height:8px;flex:0 0 auto;
  border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
  transform:rotate(45deg);transition:transform .15s;
}
.mrow[open]>summary::after{transform:rotate(-135deg)}
.mrow[open]>summary{border-bottom:1px solid var(--line)}
.mbody{padding:4px 15px 14px}
.mf{padding:11px 0;border-bottom:1px solid var(--line)}
.mf:last-child{border-bottom:0;padding-bottom:2px}
.mf b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.mf .mv{font-size:14.5px;line-height:1.55}
.kv{font-size:14.5px;line-height:1.6}
.kv li{margin-bottom:5px}
ul{margin:0 0 10px;padding-left:20px}
.dim{color:var(--dim)}
.null{color:var(--warn);font-style:italic}
footer{padding:0 14px calc(28px + env(safe-area-inset-bottom))}
@media (max-width:760px){
  footer{position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--card);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 18px rgba(0,0,0,.10)}
  /* only reserve the space while the bar is actually up */
  body[data-foot] .wrap{padding-bottom:104px}
}
.frow{max-width:var(--wrap);margin:0 auto;display:flex;gap:9px;align-items:center}
.frow .note{flex:1;min-width:0}
/* first-run welcome */
.overlay{position:fixed;inset:0;background:rgba(8,11,16,.62);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:22px 14px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;
  max-width:560px;width:100%;padding:26px 24px 22px;margin:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.28)}
.hey{font-size:16.5px;line-height:1.7;white-space:pre-wrap;
  background:var(--src);border-radius:13px;padding:18px 19px;margin:0 0 6px}
.sig{text-align:right;font-size:15px;color:var(--dim);margin:0 0 20px;padding-right:4px}
.modal h2{font-size:21px;margin:0 0 4px}
.modal .lede{font-size:14px;color:var(--dim);margin:0 0 18px}
.pt{margin:0 0 15px;font-size:14.5px;line-height:1.6}
.pt b{display:block;margin-bottom:3px;font-size:15px;color:var(--ink)}
.byline{font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);
  padding-top:13px;margin-top:19px;line-height:1.6}
#again2{width:100%;margin-top:6px;padding:14px}
.sz{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;
  font-size:12px;cursor:pointer;padding:3px 9px;border-radius:999px;margin-left:5px}
.sz.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.reopen{background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;
  text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>LMFT Theory</h1>
    <span class="days" id="days"></span>
    <button class="theme" id="sound" title="Chimes on a right answer and at each milestone"></button>
    <button class="theme" id="theme" title="Light, dark, or follow the system"></button>
  </div>
  <nav id="nav"></nav>
</header>
<div class="wrap" id="view"></div>
<footer id="foot" hidden><div class="frow" id="frow"></div></footer>

<script>
/* ---------- data (inlined at build time: single file, works offline) ---------- */
const THEORIES = __THEORIES__;
const ITEMS    = __ITEMS__;
const BUILT    = "__BUILT__";
const EXAM     = "2026-09-15";

const MODELS = THEORIES.models;
const BYID   = Object.fromEntries(MODELS.map(m => [m.id, m]));
const NAME   = id => (BYID[id] ? BYID[id].name : id);

/* ---------- mastery state: localStorage, deliberately ~20 lines ---------- */
const KEY = "lmft.theory.v1";
const today = () => {
  const d = new Date();                       // local, not UTC: toISOString()
  const p = n => String(n).padStart(2, "0");  // rolled evening sessions
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
};
let S = load();
function load(){
  try { const v = JSON.parse(localStorage.getItem(KEY)) || {};
    return {concepts: v.concepts || {}, learned: v.learned || {},
            done: v.done || {}}; }
  catch(e){ return {concepts:{}, learned:{}, done:{}}; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function rec(id){ return S.concepts[id] || (S.concepts[id] = {seen:0, correct:0, correctDates:[], confidentWrong:0}); }
function score(id, right, knew){
  const r = rec(id); r.seen++;
  if (right){ r.correct++; if (!r.correctDates.includes(today())) r.correctDates.push(today()); }
  else if (knew) r.confidentWrong++;
  save();
}
/* retired = 3 correct across 3 distinct calendar days */
const retired = id => (S.concepts[id] ? S.concepts[id].correctDates.length >= 3 : false);
/* a confidently wrong answer is the most dangerous state on the board */
function weight(id){
  const r = S.concepts[id];
  if (!r) return 3;                       // unseen: show these first
  if (retired(id)) return 0;
  // Already answered correctly today. Asking again the same day is what made
  // it feel like the same questions on a loop; it also teaches nothing. The
  // item returns tomorrow, which is the spacing that makes it stick.
  if (r.correctDates.includes(today())) return 0;
  let w = 1 + r.confidentWrong * 2;       // double weight per confident miss
  if (r.seen && r.correct / r.seen < .5) w += 1;
  return w;
}

/* ---------- queue ---------- */
const SESSION = 20;
const LKEY = "lmft.learnN";
const LEARN_SIZES = [3, 5, 10];
function learnN(){
  try { const v = parseInt(localStorage.getItem(LKEY), 10);
        return LEARN_SIZES.includes(v) ? v : 3; } catch(e){ return 3; }
}
/* A session is only as long as the pool allows. Client Centered has three
   items and there are seventeen vignettes, so a flat 10 or 20 promised
   questions that could never be delivered. */
function sessionN(mode, modelId){
  const want = mode === "learn" ? learnN() : SESSION;
  return Math.min(want, poolFor(mode, modelId).length);
}
function scopeFor(mode, modelId){
  let p = ITEMS.slice();
  if (mode === "learn" && modelId) p = p.filter(i => i.models[0] === modelId);
  if (mode === "vignette")        p = p.filter(i => i.type === "V_vignette");
  if (mode === "drill")           p = p.filter(i => i.type !== "V_vignette");
  if (mode === "drill" && drillModels)
    p = p.filter(i => i.models.some(x => drillModels.indexOf(x) >= 0));
  return p;
}
function poolFor(mode, modelId){
  return scopeFor(mode, modelId).filter(i => weight(i.id) > 0);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

/* Never two consecutive items from the same model. Blocked practice feels
   more productive and produces worse discrimination, which is the exact
   failure mode here. */
function interleave(list){
  // Always take from the model with the MOST items left (that isn't the one
  // just served). Taking merely the first different model strands a crowded
  // model's leftovers at the tail and produces a same-model pair there.
  // Second rule: never two identical stems back to back. Learn is scoped to
  // one model, so the model rule is inert there and the stem rule is the only
  // thing standing between her and the same sentence twice running.
  const out = [], pool = list.slice();
  let last = null;                             // the item just served
  const ok = x => !last || x.stem !== last.stem;
  while (pool.length){
    const count = {};
    pool.forEach(x => count[x.models[0]] = (count[x.models[0]] || 0) + 1);
    const models = Object.keys(count).sort((a, b) => count[b] - count[a]);
    let i = -1;
    for (const m of models){
      if (last && m === last.models[0] && models.length > 1) continue;
      i = pool.findIndex(x => x.models[0] === m && ok(x));
      if (i >= 0) break;
    }
    if (i < 0) i = pool.findIndex(ok);          // same model, but a new stem
    if (i < 0) i = 0;                           // nothing else left
    out.push(pool[i]); last = pool[i]; pool.splice(i, 1);
  }
  return out;
}
function buildQueue(mode, modelId, n){
  const pool = poolFor(mode, modelId);
  const weighted = [];
  pool.forEach(i => { const w = weight(i.id); for (let k = 0; k < w; k++) weighted.push(i); });
  shuffle(weighted);
  const want = n || SESSION;
  const seen = new Set(), stems = new Set(), picked = [], spare = [];
  for (const it of weighted){
    if (seen.has(it.id)) continue;
    seen.add(it.id);
    // Four of a model's group items share two stems and its phase items share
    // two more. Take a fresh stem first and hold the repeats in reserve, so a
    // three-question session is three different questions whenever it can be.
    if (stems.has(it.stem)) { spare.push(it); continue; }
    stems.add(it.stem); picked.push(it);
    if (picked.length >= want) break;
  }
  // Fall back to the held-back repeats rather than serve a short session.
  for (const it of spare){
    if (picked.length >= want) break;
    picked.push(it);
  }
  // collision items weighted heavy in drill
  if (mode === "drill") picked.sort((a,b) =>
    (b.type === "T2_collision") - (a.type === "T2_collision"));
  return interleave(picked);
}

/* ---------- session ---------- */
let Q = [], qi = 0, mode = "learn", learnModel = null, answered = null;
/* Drill normally spans everything. Set from Compare, it spans just the models
   being compared -- including every overlap item that touches either of them,
   which is the whole reason to drill a pair straight after reading it. */
let drillModels = null;
/* One snapshot per answer, so Back can put the record and the tally back
   exactly as they were. score() mutates S.concepts in place, so a shallow
   copy would not survive the undo. */
let undoStack = [];
function showFoot(on){
  foot.hidden = !on;
  document.body.toggleAttribute("data-foot", !!on);
}
function snapshot(it){
  undoStack.push({
    qi: qi,
    stats: Object.assign({}, stats, {missed: stats.missed.slice()}),
    id: it.id,
    rec: S.concepts[it.id] ? JSON.parse(JSON.stringify(S.concepts[it.id])) : null,
  });
}
function undo(){
  const u = undoStack.pop();
  if (!u) return;
  qi = u.qi;
  stats = u.stats;
  if (u.rec === null) delete S.concepts[u.id]; else S.concepts[u.id] = u.rec;
  save();
  answered = null;
  showFoot(false);
  render();
}
let stats = {right:0, wrong:0, confidentWrong:0, missed:[]};

const el = document.getElementById("view");
const foot = document.getElementById("foot"), frow = document.getElementById("frow");
/* The packet writes many option texts mid-sentence, so they arrive
   lowercase. Capitalise for display only: the verbatim line shown underneath
   stays exactly as the packet has it, which is the point of showing it. */
const cap = t => (t && t[0] >= "a" && t[0] <= "z") ? t[0].toUpperCase() + t.slice(1) : t;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function daysLeft(){
  const d = Math.ceil((new Date(EXAM) - new Date(today())) / 864e5);
  return d > 0 ? d + " days to exam" : (d === 0 ? "exam today" : "");
}
document.getElementById("days").textContent = daysLeft();

const TABS = [["learn","Learn"],["drill","Drill"],["vignette","Vignette"],["compare","Compare"],["progress","Progress"]];
function learnedAll(){ return MODELS.every(m => S.learned[m.id]); }
function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(([k,l]) => {
    const lock = (k === "vignette" && !learnedAll());
    return `<button data-tab="${k}" ${lock?"disabled":""} aria-current="${mode===k}">${l}${lock?" 🔒":""}</button>`;
  }).join("");
}
document.getElementById("nav").onclick = e => {
  const b = e.target.closest("button[data-tab]"); if (!b || b.disabled) return;
  go(b.dataset.tab);
};
function go(tab){ mode = tab; learnModel = null; Q = []; qi = 0; undoStack = [];
  drillModels = null; renderNav(); render(); }
/* Same as go("drill"), minus the clearing. Tapping the Drill tab afterwards
   is how she gets back to all fourteen. */
function goDrill(ids){
  mode = "drill"; learnModel = null; Q = []; qi = 0; undoStack = [];
  drillModels = ids && ids.length ? ids : null;
  stats = {right:0, wrong:0, confidentWrong:0, missed:[]};
  renderNav(); render();
}

/* ---------- model state for the dashboard ---------- */
/* what is finished today, and what is finished for good */
function tallies(id){
  const its = ITEMS.filter(i => i.models[0] === id);
  const t = today();
  return {
    total: its.length,
    locked: its.filter(i => retired(i.id)).length,
    today: its.filter(i => {
      const r = S.concepts[i.id];
      return r && r.correctDates.indexOf(t) >= 0;
    }).length,
  };
}
function modelState(id){
  const its = ITEMS.filter(i => i.models[0] === id);
  if (!its.length) return {k:"new", label:"No items"};
  const seen = its.filter(i => S.concepts[i.id]);
  if (!seen.length) return {k:"new", label:"Not started"};
  const done = its.filter(i => retired(i.id)).length;
  const cw = seen.reduce((n,i) => n + S.concepts[i.id].confidentWrong, 0);
  // The label carries the state. Counts live on the line underneath, once.
  // Confident misses stay here because nothing else reports them.
  const misses = cw + " confident miss" + (cw > 1 ? "es" : "");
  if (done === its.length) return {k:"solid", label:"Locked in"};
  // Nothing left to serve today, but not finished for good.
  if (!its.some(i => weight(i.id) > 0)) return {k:"today", label:"Done today"};
  if (cw > 0) return {k:"shaky", label:misses};
  return {k:"learning", label:"In progress"};
}

/* ---------- views ---------- */
function render(){
  showFoot(false);
  document.body.toggleAttribute("data-wide", mode === "compare" || mode === "progress");
  if (mode === "compare")  return renderCompare();
  if (mode === "progress") return renderProgress();
  if (mode === "learn" && !learnModel) return renderLearnPicker();
  if (!Q.length){ Q = buildQueue(mode, learnModel, sessionN(mode, learnModel)); qi = 0; undoStack = []; stats = {right:0,wrong:0,confidentWrong:0,missed:[]}; }
  // An empty queue means every item here is retired. Falling through to the
  // summary would report "0%" for a session that never happened, and "Another"
  // would rebuild the same empty queue forever.
  if (!Q.length) return renderExhausted();
  if (qi >= Q.length) return renderSummary();
  renderItem();
}

function renderExhausted(){
  const what = mode === "learn" && learnModel ? NAME(learnModel)
             : mode === "vignette" ? "the vignettes" : "this set";
  // Sound the milestone once, not every time she lands back on this screen.
  if (mode === "learn" && learnModel){
    const done = scopeFor(mode, learnModel).every(i => retired(i.id));
    const mark = done ? "locked" : "day:" + today();
    if (S.done[learnModel] !== "locked" && S.done[learnModel] !== mark){
      S.done[learnModel] = mark; save();
      (done ? chimeLocked : chimeDayClear)();
    }
  }
  // Two different empty pools, and conflating them would be a lie: everything
  // locked in for good, versus everything answered correctly today.
  const left = scopeFor(mode, learnModel).filter(i => !retired(i.id)).length;
  el.innerHTML = left
    ? `<h2>Done here for today</h2>
       <div class="card"><p>You have answered everything in ${esc(what)} correctly
       today. It comes back tomorrow — spacing it out over days is what makes it
       stick, and repeating it now would not.</p></div>`
    : `<h2>Nothing left here</h2>
       <div class="card"><p>Every item in ${esc(what)} is locked in — three correct
       on three separate days.</p></div>`;
  el.innerHTML += `
    <div class="row">
      ${mode === "learn" ? '<button class="btn ghost" id="pick">Another model</button>' : ""}
      <button class="btn" id="toDrill">Drill</button>
      <button class="btn ghost" id="toGrid">Compare models</button>
    </div>`;
  const pk = document.getElementById("pick");
  if (pk) pk.onclick = () => { learnModel = null; Q = []; render(); };
  document.getElementById("toDrill").onclick = () => go("drill");
  document.getElementById("toGrid").onclick  = () => go("compare");
}

function renderLearnPicker(){
  el.innerHTML = `<h2>Learn</h2>
    <p class="note">${MODELS.filter(m=>S.learned[m.id]).length} of ${MODELS.length} opened. Questions per model:
      ${LEARN_SIZES.map(n=>`<button class="sz${n===learnN()?" on":""}" data-n="${n}">${n}</button>`).join("")}</p>
    <div class="grid14">${MODELS.map(m => {
      const st = modelState(m.id);
      const t = tallies(m.id);
      return `<button class="tile s-${st.k}" data-m="${m.id}" title="Locked in = right on three different days. Same-day repeats count once.">
        <b>${esc(m.name)}</b>
        <span class="nums"><i class="dot"></i>${t.today} of ${t.total} today &middot; ${t.locked} locked in${
          st.k === "shaky" ? " &middot; " + st.label : ""}</span>
        </button>`;
    }).join("")}</div>`;
  el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { learnModel = b.dataset.m; renderBrief(); });
  el.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    try { localStorage.setItem(LKEY, b.dataset.n); } catch(e){}
    renderLearnPicker();
  });
}

function factList(arr, empty){
  if (arr === null) return `<p class="null">${empty}</p>`;
  if (!arr || !arr.length) return `<p class="null">${empty}</p>`;
  return `<ul class="kv">${arr.map(f => `<li>${esc(f.text)}</li>`).join("")}</ul>`;
}
function renderBrief(){
  const m = BYID[learnModel];
  const ph = m.phases;
  el.innerHTML = `
    <span class="tag">${esc(m.family.join(" · "))} · ${esc(m.sourceDoc)}</span>
    <h2>${esc(m.name)}</h2>
    <div class="card">
      <h3>Theory of change</h3>
      ${m.changeMechanism ? `<p>${esc(m.changeMechanism.text)}</p>`
        : `<p class="null">Your packet has no theory of change for this model. It is an intervention catalogue. Nothing has been invented to fill the gap.</p>`}
      <h3>Therapist role</h3>
      ${factList(m.therapistRoles, "Your packet lists no therapist role section for this model.")}
      <h3>Goals</h3>
      ${factList(m.goals, "Your packet lists no treatment goals section for this model.")}
      <h3>Interventions</h3>
      <ul class="kv">${m.interventions.slice(0,8).map(c => `<li><b>${esc(c.term)}</b> — ${esc(c.definition.slice(0,190))}</li>`).join("") || '<li class="null">none listed</li>'}</ul>
      <h3>Phases of treatment</h3>
      ${ph === null
        ? `<div class="banner warn">Your packet says this model has <b>no clear phases of treatment</b> — and warns the exam may still ask about the initial or middle stage anyway. Look for unconditional positive regard, empathy, therapist congruence and promotion of self-acceptance.</div>`
        : ["beginning","middle","end"].map(k => `<p><b>${k}.</b> ${esc((ph[k]||[]).map(f=>f.text).join(" "))||"—"}</p>`).join("")}
      ${m.examTips.length ? `<h3>Flagged for the exam</h3>${m.examTips.map(t=>`<div class="src"><b>from your packet</b>${esc(t.sourceLine)}</div>`).join("")}` : ""}
    </div>
    <div class="row"><button class="btn" id="start">Answer ${sessionN("learn", learnModel)} question${sessionN("learn", learnModel)===1?"":"s"} on this</button>
    <button class="btn ghost" id="back">All models</button></div>`;
  document.getElementById("back").onclick = () => { learnModel = null; render(); };
  document.getElementById("start").onclick = () => {
    S.learned[learnModel] = today(); save(); renderNav();
    Q = buildQueue("learn", learnModel, sessionN("learn", learnModel)); qi = 0; undoStack = [];
    stats = {right:0,wrong:0,confidentWrong:0,missed:[]}; render();
  };
}

function renderItem(){
  const it = Q[qi]; answered = null;
  try { window.scrollTo(0, 0); } catch(e){}
  el.innerHTML = `
    <div class="bar"><i style="width:${(qi/Q.length)*100}%"></i></div>
    <div class="note">${qi+1} of ${Q.length}${mode!=="learn"?" · "+esc(NAME(it.models[0])):""}${
      undoStack.length ? ` · <button class="reopen" id="back" title="Undo the last answer (backspace)">Back</button>` : ""}</div>
    <div class="card">
      <span class="tag">${esc(TAGS[it.type] || it.type)}</span>
      <div class="stem">${esc(it.stem)}</div>
      <div id="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}" title="Press ${'ABCD'[i]}, or arrow keys and space"><span class="ch">${"ABCD"[i]}</span><span class="ot">${esc(cap(o.text))}</span></button>`).join("")}</div>
      <div id="reveal"></div>
    </div>`;
  const bk = document.getElementById("back");
  if (bk) bk.onclick = () => undo();
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    // dragging across the text to select it should not count as answering
    const sel = window.getSelection && window.getSelection();
    if (sel && sel.toString().trim() && b.contains(sel.anchorNode)) return;
    choose(it, +b.dataset.i);
  });
}

function choose(it, i){
  if (answered !== null) return;
  answered = i;
  const right = it.options[i].correct;
  snapshot(it);
  if (right) chime();
  right ? stats.right++ : stats.wrong++;
  // Persist immediately. Scoring only inside the confidence handler meant an
  // answer was silently discarded if the reveal was read and then another
  // tab tapped -- and the welcome says to go and look at Compare.
  score(it.id, right, false);
  if (!right) stats.missed.push(it);
  el.querySelectorAll(".opt").forEach((b,j) => {
    b.classList.add("done");
    // a mark as well as a colour: the result should not depend on telling
    // red from green, and it reads faster than the tint alone
    if (it.options[j].correct){
      b.classList.add("correct");
      b.insertAdjacentHTML("beforeend", '<span class="mk">\u2713</span>');
    } else if (j === i){
      b.classList.add("wrong");
      b.insertAdjacentHTML("beforeend", '<span class="mk">\u2715</span>');
    }
  });
  const chosen = it.options[i];
  document.getElementById("reveal").innerHTML = `
    ${it.rationale ? `<p>${esc(it.rationale)}</p>` : ""}
    ${!right && chosen.belongsTo !== it.models[0]
      ? `<p class="note">What you picked belongs to <b>${esc(NAME(chosen.belongsTo))}</b>.</p>` : ""}
    <div class="src"><b>verbatim from your packet</b>${esc(it.sourceLine)}</div>
    <p class="note" style="margin-top:12px"><button class="reopen" id="flag">Flag this question</button></p>`;
  document.getElementById("flag").onclick = () => feedback({
    label: "This question (" + it.id + ") will be attached so Tannen can find it.",
    detail: "item: " + it.id + "\nmodel: " + NAME(it.models[0])
          + "\nstem: " + it.stem.replace(/\s+/g, " ").slice(0, 240)
          + "\nkeyed answer: " + it.options.filter(o => o.correct)[0].text.slice(0, 120)
          + "\nshe answered: " + chosen.text.slice(0, 120) + (right ? " (correct)" : " (wrong)")
  });
  showFoot(true);
  frow.innerHTML = `<button class="btn ghost" data-k="0" title="Arrow keys to move, space to choose">Guessed</button>
    <button class="btn" data-k="1" title="Arrow keys to move, space to choose">Knew it</button>`;
  if (right) frow.querySelector('[data-k="1"]').focus();
  frow.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const knew = b.dataset.k === "1";
    // the attempt is already recorded; confidence only adds the danger flag
    if (!right && knew){ stats.confidentWrong++; rec(it.id).confidentWrong++; save(); }
    // A miss is collected for an opt-in retry at the end, not spliced back
    // into the live queue: growing the denominator mid-session moves the
    // goalposts, and re-asking two items later tests memory of an answer read
    // ten seconds ago. The return that matters is the next calendar day, and
    // that is handled by the mastery state.
    qi++; showFoot(false); render();
  });
}

function renderSummary(){
  chimeDone();
  const n = stats.right + stats.wrong;
  const acc = n ? Math.round(stats.right / n * 100) : 0;
  let msg = "";
  if (acc > 90) msg = `<div class="banner ok"><b>${acc}%.</b> Too easy — try Drill, or a model you have not opened.</div>`;
  else if (acc < 70) msg = `<div class="banner warn"><b>${acc}%.</b> Questions from different models are mixed together on purpose, which always scores lower than one model at a time. Aim for 70–80%.</div>`;
  else msg = `<div class="banner ok"><b>${acc}%.</b> Right where you want to be.</div>`;
  el.innerHTML = `<h2>Session done</h2>${msg}
    <div class="card"><ul class="kv">
      <li><b>${stats.right}</b> right, <b>${stats.wrong}</b> wrong</li>
      <li><b>${stats.confidentWrong}</b> confidently wrong ${stats.confidentWrong ? "— back twice as often" : ""}</li>
      <li>${MODELS.filter(m=>S.learned[m.id]).length} of ${MODELS.length} models opened in Learn</li>
    </ul></div>
    <div class="row">
      ${stats.missed.length ? `<button class="btn" id="retry">Retry the ${stats.missed.length} you missed</button>` : ""}
      <button class="btn${stats.missed.length?" ghost":""}" id="again">Another ${sessionN(mode, learnModel)}</button>
      <button class="btn ghost" id="toGrid">Compare models</button>
      ${mode==="learn"?'<button class="btn ghost" id="pick">Another model</button>':""}
    </div>`;
  document.getElementById("again").onclick = () => { Q = []; render(); };
  const rt = document.getElementById("retry");
  if (rt) rt.onclick = () => {
    Q = interleave(stats.missed.slice()); qi = 0; undoStack = [];
    stats = {right:0,wrong:0,confidentWrong:0,missed:[]};
    render();
  };
  document.getElementById("toGrid").onclick = () => go("compare");
  const p = document.getElementById("pick"); if (p) p.onclick = () => { learnModel = null; Q = []; render(); };
}

function renderProgress(){
  const key = [
    ["new",      "Not started",   "Nothing answered in this model yet."],
    ["learning", "In progress",   "Some answered, more to come back to."],
    ["shaky",    "Watch this one","You answered confidently and were wrong here. " +
                                  "The most dangerous state on the board."],
    ["today",    "Done for today","Everything right today. It returns tomorrow " +
                                  "— the gap is what makes it stick."],
    ["solid",    "Locked in",     "Every question right on three different days."],
  ];
  el.innerHTML = `<h2>LMFT Theory Progress</h2>

    <h3>What the colours mean</h3>
    <div class="legend">${key.map(k=>`<div class="key s-${k[0]}">
      <i class="dot"></i><div><b>${k[1]}</b><span>${k[2]}</span></div>
    </div>`).join("")}</div>

    <h3>The fourteen models</h3>
    <div class="grid14">${MODELS.map(m=>{
      const st = modelState(m.id), t = tallies(m.id);
      return `<div class="tile s-${st.k}">
        <b>${esc(m.name)}</b>
        <span class="nums"><i class="dot"></i>${t.today} of ${t.total} today &middot; ${t.locked} locked in${
          st.k === "shaky" ? " &middot; " + st.label : ""}</span>
      </div>`;
    }).join("")}</div>


    <div class="row" style="margin-top:16px">
      <button class="btn ghost" id="reset">Reset all progress</button>
      <button class="reopen" id="renote">Read the note again</button>
      <button class="reopen" id="fbopen">Send feedback</button>
    </div>`;
  document.getElementById("renote").onclick = () => welcome();
  document.getElementById("fbopen").onclick = () => feedback(null);
  document.getElementById("reset").onclick = () => {
    if (confirm("Erase all progress on this device?")){
      // done:{} matters -- renderExhausted reads it, and a reset without it
      // left the milestone chimes reading an undefined map
      S = {concepts:{}, learned:{}, done:{}};
      save(); renderNav(); render();
    }
  };
}


/* ---------- Compare: 14 models x 6 columns, one page ---------- */
/* What the question is testing, in plain words rather than the build brief's.
   "collision" and "marker" are vocabulary from the spec, and these are read
   these mid-question. */
const TAGS = {
  T1_change:    "theory of change",
  T1_marker:    "signature term",
  T1_phase:     "phase",
  T2_collision: "overlap",
  T2_examtip:   "exam tip",
  T2_group:     "which set",
  T3_concept:   "definition",
  V_vignette:   "vignette",
};
const COLS = ["Change mechanism","Therapist role","Interventions","Beginning","Middle","End"];
/* A cell is a LIST of entries, never a joined string. Middot-joining eight
   interventions produced one long grey sentence that nobody reads to the end;
   one entry per line is the whole point of the page. */
function cell(m, c){
  // Every cell shows everything the packet has for that model. The old version
  // showed only the FIRST entry of each list -- and "signature intervention"
  // was not a curated pick, it was just interventions[0], whichever the packet
  // happened to list first. Since the bank now drills whole sets of
  // techniques, this page has to show whole sets too.
  // {t: what to show, k: which idea it is}. k is the number build_app.py
  // interned from collisions.json, so two models saying one thing in two
  // wordings carry the same k. Prose has no k -- there is nothing to match.
  const all = a => (a && a.length ? a.map(x => ({t:x.text, k:x.k})) : null);
  switch(c){
    case 0: return m.changeMechanism ? [{t:m.changeMechanism.text, k:null}] : null;
    case 1: return m.therapistRoles === null ? null : all(m.therapistRoles);
    case 2: return m.interventions.length
      ? m.interventions.map(x => ({t:x.term, k:x.k})) : null;
    default: {
      if (m.phases === null) return null;
      const ph = ["beginning","middle","end"][c-3];
      return all(m.phases[ph]);
    }
  }
}
/* One entry, one line. A lone entry keeps its line but loses the bullet --
   a bulleted list of one reads as a mistake. */
function cellHTML(m, i){
  const v = cell(m, i);
  if (v === null) return '<span class="null">not in packet</span>';
  return '<ul class="cl' + (v.length === 1 ? " one" : "") + '">'
    + v.map(e => "<li>" + esc(e.t) + "</li>").join("") + "</ul>";
}
/* Which models are side by side, and how the overlap is drawn. Kept in
   localStorage so closing the tab mid-comparison does not lose the pair. */
const CKEY = "lmft.compare";
let cmpSel = [], cmpHi = true, cmpDiff = false;
try {
  const c = JSON.parse(localStorage.getItem(CKEY)) || {};
  if (Array.isArray(c.sel))
    cmpSel = c.sel.filter(id => MODELS.some(m => m.id === id)).slice(0, 3);
  if (typeof c.hi === "boolean") cmpHi = c.hi;
  if (typeof c.diff === "boolean") cmpDiff = c.diff;
} catch(e){}
function cmpSave(){
  try { localStorage.setItem(CKEY,
    JSON.stringify({sel: cmpSel, hi: cmpHi, diff: cmpDiff})); } catch(e){}
}
const MODEL = id => MODELS.find(m => m.id === id);

/* How many of the compared models carry each idea in this section. An entry
   in two of three columns is neither unique nor universal, so the count is
   kept rather than a boolean. */
function overlap(i){
  const n = {};
  cmpSel.forEach(id => {
    const v = cell(MODEL(id), i);
    if (!v) return;
    const once = {};
    v.forEach(e => {
      if (e.k === null || once[e.k]) return;
      once[e.k] = 1; n[e.k] = (n[e.k] || 0) + 1;
    });
  });
  return n;
}

/* Split one section into the rows the models share and the entries they do
   not. A shared row carries each model's own wording, so the two spellings of
   one idea sit next to each other rather than being collapsed into whichever
   packet happened to be read first. */
function split(i){
  const per = cmpSel.map(id => cell(MODEL(id), i));
  if (!cmpHi) return {rows: [], own: per.map(v => v && v.map(e => e.t))};
  const n = overlap(i), rows = [], done = {};
  per.forEach(v => {
    if (!v) return;
    v.forEach(e => {
      if (e.k === null || (n[e.k] || 1) < 2 || done[e.k]) return;
      done[e.k] = 1;
      rows.push({
        count: n[e.k],
        cells: per.map(v2 => {
          const hit = v2 && v2.filter(x => x.k === e.k)[0];
          return hit ? hit.t : null;
        }),
      });
    });
  });
  return {
    rows: rows,
    own: per.map(v => v && v.filter(e => e.k === null || (n[e.k] || 1) < 2)
                           .map(e => e.t)),
  };
}

function column(list){
  if (list === null || list === undefined)
    return '<span class="null">not in packet</span>';
  if (!list.length) return '<span class="null">\u2014</span>';
  return '<ul class="cl' + (list.length === 1 ? " one" : "") + '">'
    + list.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>";
}

function sbsSection(c, i){
  const sp = split(i);
  const both = cmpSel.length === 2 ? "Both models" : "More than one";
  const head = sp.rows.length && !cmpDiff
    ? '<p class="agrp">' + both + '</p>'
      + sp.rows.map(r => '<div class="arow">'
          + (r.count < cmpSel.length
              ? '<span class="achip">' + r.count + ' of ' + cmpSel.length + '</span>' : "")
          + '<div class="acells">'
          + r.cells.map(t => "<div>" + (t ? esc(t) : "") + "</div>").join("")
          + '</div></div>').join("")
      + '<p class="agrp">Only that model</p>'
    : (sp.rows.length && cmpDiff
        ? '<p class="agrp">' + sp.rows.length + ' shared, hidden</p>' : "");
  return '<section class="sbssec"><h3>' + esc(c) + '</h3>' + head
    + '<div class="sbsrow">'
    + sp.own.map(l => '<div class="sbscol">' + column(l) + '</div>').join("")
    + '</div></section>';
}

function cmpPicker(){
  const slot = k => {
    const cur = cmpSel[k] || "";
    const opts = MODELS.map(m =>
      `<option value="${m.id}"${m.id === cur ? " selected" : ""}${
        cmpSel.indexOf(m.id) >= 0 && m.id !== cur ? " disabled" : ""}>${esc(m.name)}</option>`).join("");
    return `<select data-slot="${k}" aria-label="Model ${k+1} to compare"><option value="">${
      k < 2 ? "Choose a model" : "Add a third"}</option>${opts}</select>`;
  };
  // each dropdown travels with the word in front of it, so neither can wrap
  // away from the other
  const unit = (w, k) => `<span class="pr"><span class="vs">${w}</span>${slot(k)}</span>`;
  // the third dropdown only appears once there is something to add it to
  const three = cmpSel.length >= 2 ? unit("and", 2) : "";
  return `<div class="cmpbar"><span class="pr">${slot(0)}</span>${unit("vs", 1)}${three}
    ${cmpSel.length ? '<button class="sz" id="cmpClear">Show all 14</button>' : ""}</div>`;
}

function renderCompare(){
  const val = (m,i) => cellHTML(m,i);
  const sbs = cmpSel.length >= 2;

  const body = sbs ? `
    <div class="cmpopt">
      <button class="sz${cmpHi ? " on" : ""}" id="cmpHi">Highlight overlap</button>
      <button class="sz${cmpDiff ? " on" : ""}" id="cmpDiff">Differences only</button>
    </div>
    <div class="sbs${cmpHi ? " hi" : ""} n${cmpSel.length}" style="--n:${cmpSel.length}">
      <div class="sbshead">${cmpSel.map(id =>
        `<div class="sbsname">${esc(MODEL(id).name)}</div>`).join("")}</div>
      ${COLS.map((c,i) => sbsSection(c, i)).join("")}
    </div>
    <div class="row"><button class="btn" id="cmpDrill">Drill these ${
      cmpSel.length} models</button></div>
    <p class="note">Anything blank is blank in your packet.</p>`
  : `
    <p class="note">Pick two models above to put them side by side. Anything blank
    here is blank in your packet.</p>

    <div class="gwide card scroll"><table class="grid">
      <thead><tr><th>Model</th>${COLS.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${MODELS.map(m=>`<tr><td>${esc(m.name)}</td>${
        COLS.map((_,i)=>`<td>${val(m,i)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>

    <div class="gnarrow">${MODELS.map(m=>`<details class="mrow">
      <summary>${esc(m.name)}</summary>
      <div class="mbody">${COLS.map((c,i)=>
        `<div class="mf"><b>${esc(c)}</b><div class="mv">${val(m,i)}</div></div>`).join("")}</div>
    </details>`).join("")}</div>

    <p class="note">Built ${esc(BUILT)} from your five packets.</p>`;

  el.innerHTML = `<h2>Compare models</h2>${cmpPicker()}${body}`;

  // the names pin under the header, whatever height the header happens to be
  try {
    document.documentElement.style.setProperty(
      "--hh", document.querySelector("header").offsetHeight + "px");
  } catch(e){}

  el.querySelectorAll("select[data-slot]").forEach(sel => sel.onchange = () => {
    const k = +sel.dataset.slot, v = sel.value, next = cmpSel.slice();
    if (!v) next.splice(k, 1); else next[k] = v;
    cmpSel = next.filter(Boolean).slice(0, 3);
    cmpSave(); renderCompare();
  });
  const cl = document.getElementById("cmpClear");
  if (cl) cl.onclick = () => { cmpSel = []; cmpSave(); renderCompare(); };
  const hi = document.getElementById("cmpHi");
  if (hi) hi.onclick = () => { cmpHi = !cmpHi; cmpSave(); renderCompare(); };
  const df = document.getElementById("cmpDiff");
  if (df) df.onclick = () => { cmpDiff = !cmpDiff; cmpSave(); renderCompare(); };
  const dr = document.getElementById("cmpDrill");
  if (dr) dr.onclick = () => goDrill(cmpSel.slice());
}

/* ---------- sound ----------
   Rendered to a WAV and played through an <audio> element rather than
   straight out of Web Audio. iOS mutes Web Audio when the side switch is on
   silent, but lets an audio element through as media. Everything is still
   synthesised in the page -- no files ship, and it still works offline. */
const SKEY = "lmft.sound";
function soundOn(){
  try { return localStorage.getItem(SKEY) !== "0"; } catch(e){ return true; }
}

/* a voice is [wave, hz, delay, length, peak] */
const C2 = 65.41, C3 = 130.81, C5 = 523.25, E5 = 659.25, F5 = 698.46, G5 = 783.99;
const C6 = 1046.50, E6 = 1318.51, G6 = 1567.98, C7 = 2093.00,
      E7 = 2637.02, G7 = 3135.96;

const SPECS = {
  /* right answer: C-E-G rising */
  right: [["sine", C6, 0, 0.10, 0.038], ["sine", E6, 0.045, 0.10, 0.038],
          ["sine", G6, 0.090, 0.11, 0.038]],
  /* session finished: the same run carried up to the octave */
  done:  [["sine", C6, 0, 0.10, 0.036], ["sine", E6, 0.055, 0.10, 0.036],
          ["sine", G6, 0.110, 0.10, 0.036], ["sine", C7, 0.170, 0.25, 0.040]],
  /* model cleared for today: that, with two notes flicked above it */
  day:   [["sine", C6, 0, 0.10, 0.034], ["sine", E6, 0.055, 0.10, 0.034],
          ["sine", G6, 0.110, 0.10, 0.034], ["sine", C7, 0.170, 0.22, 0.038],
          ["sine", E7, 0.320, 0.11, 0.026], ["sine", G7, 0.390, 0.24, 0.026]],
  /* model locked for good: struck on a suspension over a low C, resolving
     into the major chord half a second in and then holding */
  locked:[["sine", C2, 0, 0.070, 0.070], ["sine", C3, 0, 3.40, 0.032],
          ["sine", C5, 0, 3.20, 0.017], ["sine", G5, 0, 3.20, 0.017],
          ["sine", C6, 0, 3.20, 0.017], ["sine", C5*1.006, 0, 3.20, 0.017],
          ["sine", C6*1.004, 0, 3.20, 0.017],
          ["sine", F5, 0.02, 0.62, 0.020],
          ["sine", E5, 0.50, 2.85, 0.020], ["sine", E5*0.994, 0.50, 2.85, 0.012],
          ["sine", C6, 0.62, 0.30, 0.019], ["sine", E6, 0.705, 0.30, 0.019],
          ["sine", G6, 0.790, 0.30, 0.019], ["sine", C7, 0.88, 2.20, 0.022]]
};

function schedule(ac, spec){
  spec.forEach(function(v){
    var t = ac.currentTime + v[2];
    var osc = ac.createOscillator(), g = ac.createGain();
    osc.type = v[0];
    osc.frequency.setValueAtTime(v[1], t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v[4], t + 0.010);
    g.gain.exponentialRampToValueAtTime(0.0001, t + v[3]);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t); osc.stop(t + v[3] + 0.02);
  });
}

function wavURL(buf){
  var n = buf.length, d = buf.getChannelData(0);
  var ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab), i;
  function str(off, sv){ for (i = 0; i < sv.length; i++) v.setUint8(off + i, sv.charCodeAt(i)); }
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, buf.sampleRate, true); v.setUint32(28, buf.sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, n * 2, true);
  for (i = 0; i < n; i++){
    var x = Math.max(-1, Math.min(1, d[i]));
    v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
  }
  return URL.createObjectURL(new Blob([ab], {type: "audio/wav"}));
}

var URLS = {}, PENDING = {}, LIVE = null;
var ELS = {}, warmed = false;
/* named prerender, not render: the app already has a render() and a
   collision here silently blanked the whole view */
function prerender(name){
  if (URLS[name] || PENDING[name]) return;
  var OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OC) return;
  var spec = SPECS[name];
  var secs = 0.2 + spec.reduce(function(m, v){ return Math.max(m, v[2] + v[3]); }, 0);
  try {
    var oc = new OC(1, Math.ceil(44100 * secs), 44100);
    schedule(oc, spec);
    PENDING[name] = true;
    oc.startRendering().then(function(buf){
      URLS[name] = wavURL(buf); PENDING[name] = false;
      // build and preload the players now, not at the moment she needs them
      ELS[name] = [0, 1].map(function(){
        var el = new Audio(URLS[name]);
        el.preload = "auto";
        try { el.load(); } catch(e){}
        return el;
      });
      if (warmed) warmOne(name);
    }, function(){ PENDING[name] = false; });
  } catch(e){ PENDING[name] = false; }
}
/* render them all up front so the first correct answer is not silent */
["right", "done", "day", "locked"].forEach(prerender);

/* Run each player once at zero volume during a real gesture. That forces the
   decode and satisfies the autoplay gate, so the first real chime is not the
   one that pays for both. */
function warmOne(name){
  (ELS[name] || []).forEach(function(el){
    try {
      el.volume = 0;
      var p = el.play();
      var stop = function(){ el.pause(); el.currentTime = 0; el.volume = 1; };
      if (p && p.then) p.then(stop, stop); else stop();
    } catch(e){ el.volume = 1; }
  });
}
function warmAudio(){
  if (warmed) return;
  warmed = true;
  Object.keys(ELS).forEach(warmOne);
}
["pointerdown", "touchend", "keydown"].forEach(function(ev){
  document.addEventListener(ev, warmAudio, {passive: true});
});

function play(name){
  if (!soundOn()) return;
  try {
    var pool = ELS[name];
    if (pool && pool.length){
      // prefer one that is not mid-ring, so a fast streak does not clip
      var el = pool.find(function(x){ return x.paused || x.ended; }) || pool[0];
      el.volume = 1;
      try { el.currentTime = 0; } catch(e){}
      var p = el.play();
      if (p && p.catch) p.catch(function(){ liveFallback(name); });
      return;
    }
    liveFallback(name);
  } catch(e){ liveFallback(name); }
}
/* Web Audio, for browsers with no OfflineAudioContext and for the very first
   sound if rendering has not finished yet. Audible only when the phone is not
   on silent, which is exactly the case this whole detour exists to fix. */
function liveFallback(name){
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    LIVE = LIVE || new C();
    if (LIVE.state === "running"){ schedule(LIVE, SPECS[name]); return; }
    var r = LIVE.resume();
    if (r && r.then) r.then(function(){ schedule(LIVE, SPECS[name]); }, function(){});
    else schedule(LIVE, SPECS[name]);
  } catch(e){}
}

const chime         = function(){ play("right"); };
const chimeDone     = function(){ play("done"); };
const chimeDayClear = function(){ play("day"); };
const chimeLocked   = function(){ play("locked"); };

function initSound(){
  const b = document.getElementById("sound");
  if (!b) return;
  const paint = () => { b.textContent = soundOn() ? "\u266a On" : "\u266a Off"; };
  paint();
  b.onclick = () => {
    try { localStorage.setItem(SKEY, soundOn() ? "0" : "1"); } catch(e){}
    paint();
    if (soundOn()) chime();
  };
}

/* ---------- theme ----------
   Three states, not two. "Auto" is the default so the app follows the operating system's
   own light/dark schedule; the other two are explicit overrides that win in
   both directions. */
const TKEY = "lmft.theme";
const THEMES = [
  {v:"auto",  label:"◐ Auto"},
  {v:"light", label:"☀ Light"},
  {v:"dark",  label:"☾ Dark"},
];
function applyTheme(v){
  const root = document.documentElement;
  if (v === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", v);
  const btn = document.getElementById("theme");
  if (btn) btn.textContent = (THEMES.find(t => t.v === v) || THEMES[0]).label;
  // keep the iOS/macOS browser chrome in step with the page
  const dark = v === "dark" || (v === "auto" &&
    window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0c1521" : "#f1f5fa");
}
function readTheme(){
  try { return localStorage.getItem(TKEY) || "auto"; } catch(e){ return "auto"; }
}
function initTheme(){
  applyTheme(readTheme());
  const btn = document.getElementById("theme");
  if (btn) btn.onclick = () => {
    const i = THEMES.findIndex(t => t.v === readTheme());
    const next = THEMES[(i + 1) % THEMES.length].v;
    try { localStorage.setItem(TKEY, next); } catch(e){}
    applyTheme(next);
  };
  // while on Auto, follow the OS if it flips mid-session
  if (window.matchMedia){
    const mq = window.matchMedia("(prefers-color-scheme:dark)");
    const onFlip = () => { if (readTheme() === "auto") applyTheme("auto"); };
    if (mq.addEventListener) mq.addEventListener("change", onFlip);
    else if (mq.addListener) mq.addListener(onFlip);
  }
}

  pts.forEach((p, i) => {
    const b = p.querySelector("b");
    b.textContent = (i + 1) + " · " + b.textContent;
  });
  d.querySelector("#wcount").textContent = WORDS[pts.length] || pts.length;
  d.querySelector("#again2").onclick = () => {
    try { localStorage.setItem(WKEY, "1"); } catch(e){}
    d.remove();
  };
}
// Only the storage read is guarded. Retrying welcome() inside a catch would
// throw twice if welcome() itself were the thing that failed.
let seenWelcome = false;
try { seenWelcome = !!localStorage.getItem(WKEY); } catch(e){}
if (!seenWelcome && document.body) welcome();

initTheme();
initSound();
/* Arrow keys move focus between the live choices; space and enter already
   activate a focused button, so nothing extra is needed to pick one. Before
   an answer is given the live choices are the options; after, the two confidence
   buttons. */
function d_typing(e){
  const t = e.target;
  return t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT");
}
function liveChoices(){
  const opts = [...document.querySelectorAll("#opts button.opt:not(.done)")];
  return opts.length ? opts : [...document.querySelectorAll("footer [data-k]")];
}
document.addEventListener("keydown", e => {
  if (e.key === "Backspace" && undoStack.length && !d_typing(e)){ e.preventDefault(); undo(); return; }
  // the chips show A-D, so those keys have to actually work
  if (!d_typing(e) && !e.metaKey && !e.ctrlKey && !e.altKey && /^[a-d]$/i.test(e.key)){
    const opts = [...document.querySelectorAll("#opts button.opt:not(.done)")];
    const b = opts["abcd".indexOf(e.key.toLowerCase())];
    if (b){ e.preventDefault(); b.click(); return; }
  }
  if (!["ArrowDown","ArrowUp","ArrowRight","ArrowLeft"].includes(e.key)) return;
  const list = liveChoices();
  if (!list.length) return;
  e.preventDefault();
  const fwd = e.key === "ArrowDown" || e.key === "ArrowRight";
  const cur = list.indexOf(document.activeElement);
  const next = fwd ? (cur + 1) % list.length
                   : (cur <= 0 ? list.length - 1 : cur - 1);
  list[next].focus();
});

renderNav();
render();
</script>
</body>
